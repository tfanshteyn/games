const puffs = [];
function cannonSmoke(cn) {
  const m = cannonMuzzle(cn);
  for (let i = 0; i < 10; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 6), MAT.smoke.clone());
    p.position.set(m.x, m.y + 0.1, m.z);
    p.userData = { vx: (Math.random() - 0.5) * 0.6, vy: 0.4 + Math.random() * 0.6, vz: (Math.random() - 0.5) * 0.6, life: 1.4 };
    scene.add(p); puffs.push(p);
  }
}
function updateSmoke(dt) {
  for (let i = puffs.length - 1; i >= 0; i--) {
    const p = puffs[i], u = p.userData;
    u.life -= dt;
    p.position.x += u.vx * dt; p.position.y += u.vy * dt; p.position.z += u.vz * dt;
    p.scale.multiplyScalar(1 + dt * (u.grow ?? 1.5));
    p.material.opacity = Math.max(0, Math.min(1, u.life / 1.4)) * 0.8;
    if (u.life <= 0) { scene.remove(p); p.geometry.dispose(); p.material.dispose(); puffs.splice(i, 1); }
  }
}

function addBeachScenery(hole) {
  const b = holeBounds(hole);
  const pick = (m0, m1) => {
    for (let i = 0; i < 40; i++) {
      const x = b.x0 - m1 + rnd() * (b.x1 - b.x0 + 2 * m1), z = b.z0 - m1 + rnd() * (b.z1 - b.z0 + 2 * m1);
      const dx = Math.max(b.x0 - x, 0, x - b.x1), dz = Math.max(b.z0 - z, 0, z - b.z1);
      const d = Math.hypot(dx, dz);
      if (d > m0 && d < m1 && Math.hypot(x - hole.tee.x, z - hole.tee.z) > 2.8) return [x, z]; // keep the tee-off camera clear
    }
    return [b.x1 + m1, b.z0];
  };
  for (let i = 0; i < 14; i++) { const [x, z] = pick(1.6, 8.5); addPalm(x, z, 2.4 + rnd() * 1.6, 0.25 + rnd() * 0.35, rnd() * 6.28); }
  for (let i = 0; i < 6; i++) { const [x, z] = pick(0.5, 2.5); addBarrel(x, z, rnd() < 0.4); }
  for (let i = 0; i < 3; i++) { const [x, z] = pick(0.6, 3); addChest(x, z, rnd() * 6.28, i === 0); }
  for (let i = 0; i < 3; i++) { const [x, z] = pick(0.8, 2.6); addPirateFlag(x, z, 1.4 + rnd() * 0.5); }
  const crates = 4;
  for (let i = 0; i < crates; i++) {
    const [x, z] = pick(0.5, 3), s = 0.22 + rnd() * 0.12;
    const cr = box(s, s, s, MAT.wood, x, s / 2 - 0.02, z); cr.rotation.y = rnd() * 6;
    holeGroup.add(cr);
  }
  const rocks = 14;
  const rock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), MAT.rock, rocks);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < rocks; i++) {
    const [x, z] = pick(0.4, 6), r = 0.1 + rnd() * 0.35;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6);
    m.compose(p.set(x, r * 0.25, z), q, s.set(r * 1.4, r * 0.8, r)); rock.setMatrixAt(i, m);
  }
  rock.castShadow = true; rock.receiveShadow = true; holeGroup.add(rock);

  // rope-and-post fence round the plot instead of a picket fence
  const fx0 = b.x0 - 1.4, fx1 = b.x1 + 1.4, fz0 = b.z0 - 1.4, fz1 = b.z1 + 1.4;
  const corners = [[fx0, fz0], [fx1, fz0], [fx1, fz1], [fx0, fz1], [fx0, fz0]];
  for (let k = 0; k < 4; k++) {
    const [ax, az] = corners[k], [bx, bz] = corners[k + 1];
    const len = Math.hypot(bx - ax, bz - az), n = Math.max(1, Math.round(len / 1.2));
    for (let i = 0; i < n; i++) {
      const x = ax + ((bx - ax) * i) / n, z = az + ((bz - az) * i) / n;
      const post = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.6, 7), MAT.wood);
      post.position.set(x, 0.28, z); post.castShadow = true;
      holeGroup.add(post);
      const x2 = ax + ((bx - ax) * (i + 1)) / n, z2 = az + ((bz - az) * (i + 1)) / n;
      // the rope sags between posts
      const pts = [];
      for (let j = 0; j <= 8; j++) { const t = j / 8; pts.push(new THREE.Vector3(x + (x2 - x) * t, 0.5 - Math.sin(t * Math.PI) * 0.12, z + (z2 - z) * t)); }
      holeGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 8, 0.012, 4, false), MAT.rope));
    }
  }

  // a pirate ship riding at anchor offshore
  const sx = b.x1 + 16, sz = (b.z0 + b.z1) / 2 - 6;
  const ship = new THREE.Group();
  ship.position.set(sx, -0.1, sz); ship.rotation.y = 0.6;
  const hullG = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 7, 16, 1, false, Math.PI / 2, Math.PI), MAT.hull);
  hullG.rotation.x = Math.PI / 2; hullG.scale.set(1.4, 1, 0.9); hullG.position.y = 0.2;
  ship.add(hullG);
  ship.add(box(2.6, 0.08, 6.6, MAT.deck, 0, 0.22, 0));
  for (const [z, h] of [[-1.5, 6], [1.5, 5]]) {
    const mst = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, h, 8), MAT.wood);
    mst.position.set(0, h / 2, z); ship.add(mst);
    const sl = new THREE.Mesh(new THREE.PlaneGeometry(2.4, h * 0.45), MAT.canvas);
    sl.position.set(0, h * 0.55, z); sl.rotation.y = Math.PI / 2; ship.add(sl);
  }
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(1, 0.62), MAT.skull);
  fl.position.set(0, 6.3, -1.5); fl.rotation.y = Math.PI / 2; ship.add(fl);
  anim.ship = ship;
  holeGroup.add(ship);
}

// A carved tiki statue: stacked blocks with a painted face.
function addTiki(x, y, z, rad, h) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = Math.round(rnd() * 3) * (Math.PI / 2);
  const w = rad * 1.6;
  g.add(box(w, h, w, MAT.tiki, 0, h / 2, 0));
  g.add(box(w * 1.25, 0.04, w * 1.25, MAT.tiki, 0, h + 0.02, 0));
  g.add(box(w * 0.9, 0.05, w * 0.9, MAT.tiki, 0, h + 0.065, 0));
  const f = w / 2 + 0.002;
  for (const ex of [-w * 0.22, w * 0.22]) g.add(box(w * 0.2, w * 0.14, 0.01, MAT.tikiPaint, ex, h * 0.72, f));
  g.add(box(w * 0.12, h * 0.22, 0.02, MAT.tiki, 0, h * 0.55, f + 0.005));
  g.add(box(w * 0.55, w * 0.1, 0.01, MAT.tikiPaint, 0, h * 0.32, f));
  holeGroup.add(g);
}

function addFerns(spots) {
  if (!spots.length) return;
  // a fern frond: a narrow leaf that tapers to a point
  const leaf = new THREE.BufferGeometry();
  leaf.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -0.02, 0.2, 0, 0, 0, 0, 0.02], 3));
  leaf.computeVertexNormals();
  const ferns = new THREE.InstancedMesh(leaf, MAT.fern, spots.length * 6);
  const m = new THREE.Matrix4(), e = new THREE.Euler(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  let k = 0;
  for (const [x, z] of spots) {
    for (let j = 0; j < 6; j++) {
      e.set(0, (j / 6) * Math.PI * 2 + rnd() * 0.5, 0.6 + rnd() * 0.5, 'YXZ');
      q.setFromEuler(e);
      m.compose(p.set(x, 0.02, z), q, s); ferns.setMatrixAt(k++, m);
    }
  }
  ferns.castShadow = true;
  holeGroup.add(ferns);
}

// A sprung steel frame round each block of trampoline cells.
function addTrampolineFrames(hole) {
  const pads = hole.cells.filter(c => c.ch === 'j');
  if (!pads.length) return;
  const c0 = Math.min(...pads.map(c => c.c)), c1 = Math.max(...pads.map(c => c.c)) + 1;
  const r0 = Math.min(...pads.map(c => c.r)), r1 = Math.max(...pads.map(c => c.r)) + 1;
  const y = pads[0].level * CONFIG.levelStep;
  const x0 = c0 * C, x1 = c1 * C, z0 = r0 * C, z1 = r1 * C;
  const g = new GeoBuilder();
  for (const [ax, az, bx, bz, nx, nz] of [[x0, z0, x1, z0, 0, -1], [x1, z0, x1, z1, 1, 0], [x1, z1, x0, z1, 0, 1], [x0, z1, x0, z0, -1, 0]]) {
    prism(g, ax, az, bx, bz, nx, nz, 0.06, y - 0.25, y + 0.015, y + 0.015);
  }
  holeGroup.add(meshOf(g, MACH.steel, true));
  for (let x = x0 + 0.1; x < x1; x += 0.2) for (const z of [z0 - 0.03, z1 + 0.03]) {
    const spring = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.004, 4, 8), MACH.steel);
    spring.position.set(x, y + 0.015, z); spring.rotation.y = Math.PI / 2;
    holeGroup.add(spring);
  }
}

// A smoking volcano cone with a glowing crater and lava running down its flanks.
function addVolcanoModel(v, big = false) {
  const g = new THREE.Group();
  g.position.set(v.x, -0.02, v.z);
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(v.radius * 0.22, v.radius, v.height, 28, 6, true), MAT.basaltRock);
  // roughen the slopes
  const pos = cone.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const yy = pos.getY(i);
    if (Math.abs(yy - v.height / 2) < 1e-3 || Math.abs(yy + v.height / 2) < 1e-3) continue;
    const k = 1 + (rnd() - 0.5) * 0.12;
    pos.setX(i, pos.getX(i) * k); pos.setZ(i, pos.getZ(i) * k);
  }
  cone.geometry.computeVertexNormals();
  cone.position.y = v.height / 2; cone.castShadow = !big; cone.receiveShadow = true;
  g.add(cone);
  const crater = new THREE.Mesh(new THREE.CircleGeometry(v.radius * 0.22, 24), MAT.lava);
  crater.rotation.x = -Math.PI / 2; crater.position.y = v.height - v.radius * 0.02;
  g.add(crater);
  // lava streams down the sides
  for (let k = 0; k < (big ? 5 : 3); k++) {
    const a = rnd() * Math.PI * 2, pts = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10, r = v.radius * (0.22 + 0.7 * t) + 0.02, wob = Math.sin(t * 9 + k) * 0.08;
      pts.push(new THREE.Vector3(Math.cos(a + wob) * r, v.height * (1 - t * 0.9) + 0.01, Math.sin(a + wob) * r));
    }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, v.radius * (big ? 0.03 : 0.05), 5, false), MAT.lava));
  }
  holeGroup.add(g);
  const glow = new THREE.PointLight(0xff6a1a, big ? 0 : 1.2, v.radius * 3, 2);
  glow.position.set(v.x, v.height + 0.4, v.z);
  if (!big) holeGroup.add(glow);
  anim.volcanoes.push({ x: v.x, y: v.height, z: v.z, size: big ? 3 : 0.5, timer: 0, glow: big ? null : glow });
}

function addJungleTree(x, z, h) {
  const g = new THREE.Group();
  g.position.set(x, -0.02, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.14, h, 7), MAT.bark);
  trunk.position.y = h / 2; trunk.castShadow = true;
  g.add(trunk);
  // a canopy of big flat leaves
  for (let k = 0; k < 7; k++) {
    const leaf = new THREE.Mesh(new THREE.CircleGeometry(0.55 + rnd() * 0.3, 7), k % 2 ? MAT.leafBig : MAT.leafDark);
    const a = (k / 7) * Math.PI * 2;
    leaf.position.set(Math.cos(a) * 0.45, h - 0.1 + rnd() * 0.3, Math.sin(a) * 0.45);
    leaf.rotation.set(-Math.PI / 2 + (rnd() - 0.5) * 0.7, a, 0, 'YXZ');
    leaf.castShadow = true;
    g.add(leaf);
  }
  // hanging vines
  for (let k = 0; k < 3; k++) {
    const len = 0.6 + rnd() * 0.8;
    const vine = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, len, 3), MAT.leafDark);
    vine.position.set((rnd() - 0.5) * 0.9, h - len / 2, (rnd() - 0.5) * 0.9);
    g.add(vine);
  }
  holeGroup.add(g);
}

function addBamboo(x, z) {
  const n = 4 + Math.floor(rnd() * 4);
  for (let i = 0; i < n; i++) {
    const h = 1.2 + rnd() * 1.6;
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, h, 6), MAT.bamboo);
    stalk.position.set(x + (rnd() - 0.5) * 0.35, h / 2 - 0.02, z + (rnd() - 0.5) * 0.35);
    stalk.rotation.set((rnd() - 0.5) * 0.15, 0, (rnd() - 0.5) * 0.15);
    stalk.castShadow = true;
    holeGroup.add(stalk);
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 5), MAT.fern);
    tuft.position.set(stalk.position.x, h - 0.05, stalk.position.z); tuft.rotation.x = Math.PI;
    holeGroup.add(tuft);
  }
}

function addTorch(x, z) {
  holeGroup.add(box(0.05, 1.1, 0.05, MAT.bamboo, x, 0.53, z));
  holeGroup.add(box(0.1, 0.1, 0.1, MAT.tiki, x, 1.1, z));
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 7), MAT.flame);
  flame.position.set(x, 1.25, z);
  holeGroup.add(flame);
  anim.flames.push(flame);
}

function addJungleScenery(hole) {
  const b = holeBounds(hole);
  const pick = (m0, m1) => {
    for (let i = 0; i < 40; i++) {
      const x = b.x0 - m1 + rnd() * (b.x1 - b.x0 + 2 * m1), z = b.z0 - m1 + rnd() * (b.z1 - b.z0 + 2 * m1);
      const dx = Math.max(b.x0 - x, 0, x - b.x1), dz = Math.max(b.z0 - z, 0, z - b.z1);
      const d = Math.hypot(dx, dz);
      if (d > m0 && d < m1 && Math.hypot(x - hole.tee.x, z - hole.tee.z) > 2.8) return [x, z]; // keep the tee-off camera clear
    }
    return [b.x1 + m1, b.z0];
  };
  for (let i = 0; i < 12; i++) { const [x, z] = pick(2, 9); addJungleTree(x, z, 2.2 + rnd() * 2); }
  for (let i = 0; i < 5; i++) { const [x, z] = pick(1.8, 8); addPalm(x, z, 2.4 + rnd() * 1.4, 0.2 + rnd() * 0.3, rnd() * 6.28); }
  for (let i = 0; i < 6; i++) { const [x, z] = pick(1, 4); addBamboo(x, z); }
  for (let i = 0; i < 4; i++) { const [x, z] = pick(0.6, 2.2); addTiki(x, -0.02, z, 0.18, 0.6 + rnd() * 0.5); }
  for (let i = 0; i < 6; i++) { const [x, z] = pick(0.5, 1.4); addTorch(x, z); }
  const ferns = [];
  for (let i = 0; i < 40; i++) ferns.push(pick(0.3, 3));
  addFerns(ferns);
  const rocks = 16;
  const rock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), MAT.basaltRock, rocks);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < rocks; i++) {
    const [x, z] = pick(0.4, 6), r = 0.12 + rnd() * 0.4;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6);
    m.compose(p.set(x, r * 0.3, z), q, s.set(r * 1.3, r * 0.9, r)); rock.setMatrixAt(i, m);
  }
  rock.castShadow = true; rock.receiveShadow = true; holeGroup.add(rock);
  // bamboo fence round the plot
  const fx0 = b.x0 - 1.4, fx1 = b.x1 + 1.4, fz0 = b.z0 - 1.4, fz1 = b.z1 + 1.4;
  for (const [ax, az, bx, bz] of [[fx0, fz0, fx1, fz0], [fx1, fz0, fx1, fz1], [fx1, fz1, fx0, fz1], [fx0, fz1, fx0, fz0]]) {
    const len = Math.hypot(bx - ax, bz - az), n = Math.round(len / 1.4);
    for (let i = 0; i <= n; i++) holeGroup.add(box(0.05, 0.55, 0.05, MAT.bamboo, ax + ((bx - ax) * i) / n, 0.26, az + ((bz - az) * i) / n));
    for (const y of [0.22, 0.45]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), MAT.bamboo);
      pole.position.set((ax + bx) / 2, y, (az + bz) / 2);
      pole.rotation.set(0, -Math.atan2(bz - az, bx - ax), Math.PI / 2);
      holeGroup.add(pole);
    }
  }
  // the great volcano on its own island, smoking on the horizon
  addVolcanoModel({ x: b.x1 + 45, z: b.z0 - 55, height: 18, radius: 22 }, true);
}

function emitAsh(v) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.1 * v.size, 8, 6), MAT.ash.clone());
  p.position.set(v.x + (Math.random() - 0.5) * 0.2 * v.size, v.y + 0.1, v.z + (Math.random() - 0.5) * 0.2 * v.size);
  p.userData = { vx: (Math.random() - 0.3) * 0.25 * v.size, vy: (0.35 + Math.random() * 0.3) * v.size, vz: (Math.random() - 0.5) * 0.25 * v.size, life: 3.5, grow: 0.5 };
  scene.add(p); puffs.push(p);
}

function fitSun(hole) {
  const b = holeBounds(hole);
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  const r = Math.hypot(b.x1 - b.x0, b.z1 - b.z0) / 2 + 4;
  sun.position.set(cx + 8, 16, cz + 5);
  sun.target.position.set(cx, 0, cz);
  const sc = sun.shadow.camera;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 1; sc.far = 50;
  sc.updateProjectionMatrix();
}

function updateAimLine(ball, angle, power, visible) {
  aimMesh.visible = visible;

  const len = 0.35 + power * 1.4, w = 0.012;
  const pos = aimGeo.attributes.position.array;
  for (let i = 0; i <= AIM_SEGS; i++) {
    const t = 0.06 + (i / AIM_SEGS) * len;
    const x = ball.x + dx * t, z = ball.z + dz * t;
    const y = (groundHeight(game.hole, x, z) ?? ball.y) + 0.006;
    pos.set([x - dz * w, y, z + dx * w], i * 6);

  }
  aimGeo.attributes.position.needsUpdate = true;
}

let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function noiseBuffer(ac, secs) {
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * secs), ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function tone(freq, dur, type, vol, when = 0, slide = 0) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, filterType, freq, when = 0, q = 1) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when;
  const src = ac.createBufferSource(); src.buffer = noiseBuffer(ac, dur);
  const f = ac.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(ac.destination); src.start(t);
}
const sfx = {
  putt: p => { noise(0.05, 0.25 + p * 0.4, 'bandpass', 2500, 0, 2); tone(320, 0.08, 'sine', 0.12 + p * 0.2, 0, 0.5); },
  wall: v => { const k = Math.min(1, v / 3); noise(0.06, 0.08 + k * 0.3, 'bandpass', 900, 0, 3); tone(170, 0.09, 'triangle', 0.06 + k * 0.2, 0, 0.7); },
  cup: () => { [0, 0.07, 0.13, 0.18].forEach((w, i) => noise(0.04, 0.25 - i * 0.04, 'bandpass', 3200 - i * 300, w, 4)); tone(140, 0.25, 'sine', 0.25, 0.2, 0.6); },
  cheer: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, 0.25 + i * 0.09)); },
  lip: () => { noise(0.05, 0.2, 'bandpass', 3000, 0, 5); tone(600, 0.06, 'sine', 0.06, 0.02, 0.7); },
  sizzle: () => { noise(0.9, 0.35, 'highpass', 2500, 0, 0.5); noise(0.5, 0.3, 'lowpass', 300, 0, 1); },
  bounce: v => { tone(160, 0.25, 'sine', 0.12 + Math.min(0.2, v / 20), 0, 2.2); noise(0.05, 0.08, 'bandpass', 600, 0, 2); },
  splash: () => { noise(0.6, 0.45, 'lowpass', 1400, 0, 0.7); noise(0.3, 0.2, 'highpass', 3000, 0.05); },
  tunnel: () => { noise(0.9, 0.25, 'lowpass', 260, 0, 1); },
  lift: () => { for (let i = 0; i < 10; i++) noise(0.03, 0.12, 'bandpass', 1800, i * 0.16, 6); tone(90, 1.6, 'sawtooth', 0.03, 0, 1.3); },
  cannon: () => { noise(0.9, 0.7, 'lowpass', 500, 0, 0.8); tone(70, 0.6, 'sine', 0.5, 0, 0.4); noise(1.4, 0.15, 'lowpass', 180, 0.1); },
  loop: () => { noise(0.7, 0.18, 'bandpass', 700, 0, 1.5); tone(300, 0.6, 'sine', 0.05, 0, 2); },
  post: v => { const k = Math.min(1, v / 3); tone(420, 0.18, 'sine', 0.12 + k * 0.15, 0, 1.8); noise(0.05, 0.12 + k * 0.2, 'bandpass', 1500, 0, 3); },
};

// ============================================================
//  GAME STATE
// ============================================================
const game = {
  screen: 'menu', theme: THEMES[0], roundLen: 15, players: [],
  holeList: [], holeN: 0, hole: null, def: null, cur: 0, strokes: 0,
  ball: null, phase: 'aim', aim: 0, power: 0, lastPos: null, simT: 0, acc: 0,
  overview: false, timer: 0, after: null,
};

const $ = id => document.getElementById(id);
const hud = $('hud'), cardEl = $('card'), menuEl = $('menu');

function banner(big, small, secs = 1.8) {
  const b = $('banner');
  b.querySelector('.big').textContent = big;
  b.querySelector('.small').textContent = small || '';
  b.style.opacity = 1;
  clearTimeout(banner.t);
  banner.t = setTimeout(() => { b.style.opacity = 0; }, secs * 1000);
}

function scoreName(strokes, par) {
  if (strokes === 1) return 'Hole in one!';
  const d = strokes - par;
  return { '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', '0': 'Par', '1': 'Bogey', '2': 'Double bogey' }[d] || `+${d}`;
}

function startRound() {
  const course = game.theme.course;
  game.holeList = game.roundLen === 10 ? course.shortRound.slice() : course.holes.map((_, i) => i);
  game.holeN = 0;
  game.players.forEach(p => { p.scores = []; });
  menuEl.classList.add('hidden');
  cardEl.classList.add('hidden');
  hud.classList.remove('hidden');
  game.screen = 'play';
  audio();
  loadHole();
}

function loadHole() {
  const idx = game.holeList[game.holeN];
  game.def = game.theme.course.holes[idx];
  game.hole = parseHole(game.def);
  buildHole(game.hole, game.theme.course.style);
  game.cur = 0;
  game.overview = false;
  game.field = distanceField(game.hole);
  const info = $('holeInfo');
  info.querySelector('.num').textContent = `Hole ${game.holeN + 1} of ${game.holeList.length} · ${game.theme.name}`;
  info.querySelector('.name').textContent = game.def.name;
  info.querySelector('.par').textContent = `Par ${game.def.par}`;
  startTurn(true);
}

function startTurn(firstOfHole) {
  const h = game.hole;
  game.strokes = 0;
  game.ball = createBall(h.tee);
  game.lastPos = { x: h.tee.x, y: h.tee.y, z: h.tee.z };
  ballMat.color.set(PLAYER_COLOURS[game.cur]).convertSRGBToLinear();
  ballMesh.visible = true;
  game.aim = aimTowardPath(h.tee);
  game.power = 0;
  game.phase = 'aim';
  snapCamera();
  const p = game.players[game.cur];
  if (firstOfHole) banner(`Hole ${game.holeN + 1}`, `${game.def.name} · Par ${game.def.par}${game.players.length > 1 ? ` · ${p.name} first` : ''}`, 2.2);
  else banner(`${p.name}'s turn`, `Hole ${game.holeN + 1} · Par ${game.def.par}`, 1.6);
  renderPlayers();
}

// Face down the course: follow the distance field a couple of metres from the ball.
function aimTowardPath(pos) {
  const h = game.hole, f = game.field;
  let cell = cellAt(h, pos.x, pos.z);
  for (let k = 0; k < 5; k++) {
    let best = null;
    for (const [dr, dc] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      const n = cellOf(h, cell.r + dr, cell.c + dc);
      if (n && f[n.r * h.cols + n.c] < f[(best || cell).r * h.cols + (best || cell).c]) best = n;
    }
    if (!best) break;
    cell = best;
  }
  const tx = (cell.c + 0.5) * C, tz = (cell.r + 0.5) * C;
  if (Math.hypot(tx - pos.x, tz - pos.z) < 0.01) return Math.atan2(h.cup.z - pos.z, h.cup.x - pos.x);
  return Math.atan2(tz - pos.z, tx - pos.x);
}

function renderPlayers() {
  $('players').innerHTML = game.players.map((p, i) => {
    const total = p.scores.reduce((a, b) => a + b, 0);
    const live = i === game.cur && game.screen === 'play' ? ` · ${game.strokes}` : '';
    return `<div class="chip ${i === game.cur ? 'on' : ''}"><span class="dot" style="background:${PLAYER_COLOURS[i]}"></span>${escapeHtml(p.name)}<span class="s">${total}${live}</span></div>`;
  }).join('');
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

function putt() {
  if (game.phase !== 'aim' || game.overview || game.power < 0.02) return;
  game.lastPos = { x: game.ball.x, y: game.ball.y, z: game.ball.z };
  shoot(game.ball, game.aim, game.power);
  sfx.putt(game.power);
  game.strokes++;
  game.phase = 'rolling';
  game.power = 0;
  renderPlayers();
}

function finishPlayer(score, label) {
  game.players[game.cur].scores[game.holeN] = score;
  game.phase = 'done';
  renderPlayers();
  later(label === 'cap' ? 1.6 : 2.0, () => {
    if (game.cur < game.players.length - 1) { game.cur++; startTurn(false); }
    else showHoleCard();
  });
}

function later(secs, fn) { game.timer = secs; game.after = fn; }

function handleEvents(events) {
  const b = game.ball;
  for (const ev of events) {
    const sp = Math.hypot(b.vx, b.vz);
    if (ev === 'wall') { if (sp > 0.15) sfx.wall(sp); }
    else if (ev === 'lip') sfx.lip();
    else if (ev === 'post') sfx.post(sp);
    else if (ev === 'tunnel') sfx.tunnel();
    else if (ev === 'lift') sfx.lift();
    else if (ev === 'loop') sfx.loop();
    else if (ev === 'cannon') { sfx.cannon(); const cn = game.hole.cannons.find(c => Math.hypot(c.a.x - b.x, c.a.z - b.z) < 0.6) || game.hole.cannons[0]; cannonSmoke(cn); }
    else if (ev === 'holed') {
      sfx.cup();
      const name = scoreName(game.strokes, game.def.par);
      if (game.strokes <= game.def.par) sfx.cheer();
      banner(name, `${game.players[game.cur].name} · ${game.strokes} stroke${game.strokes === 1 ? '' : 's'}`);
      finishPlayer(game.strokes, 'holed');
      return;
    } else if (ev === 'bounce') sfx.bounce(Math.abs(b.vy));
    else if (ev === 'water' || ev === 'lava' || ev === 'out') {
      if (ev === 'lava') sfx.sizzle(); else sfx.splash();
      game.strokes++;
      game.phase = 'penalty';
      ballMesh.visible = ev === 'out';
      if (game.strokes >= CONFIG.maxStrokes) {
        banner({ water: 'Splash!', lava: 'Lava!' }[ev] || 'Out!', `Stroke limit — scores ${CONFIG.maxStrokes + 1}`);
        finishPlayer(cappedScore(game.strokes, false), 'cap');
        return;
      }
      banner({ water: 'Splash!', lava: 'Lava! Too hot!' }[ev] || 'Out of bounds', '+1 stroke — back to where you hit from', 1.5);
      renderPlayers();
      later(1.4, () => {
        game.ball = createBall(game.lastPos);
        ballMesh.visible = true;
        game.phase = 'aim';
        game.aim = aimTowardPath(game.ball);
        snapCamera();
      });
      return;
    } else if (ev === 'stopped') {
      if (game.strokes >= CONFIG.maxStrokes) {
        banner('Stroke limit', `${game.players[game.cur].name} scores ${CONFIG.maxStrokes + 1}`);
        finishPlayer(cappedScore(game.strokes, false), 'cap');
        return;
      }
      game.phase = 'aim';
      game.aim = aimTowardPath(game.ball);
      return;
    }
  }
}

// ============================================================
//  SCORECARDS
// ============================================================
function scoreTable(upto) {
  const holes = game.holeList.slice(0, upto);
  const pars = holes.map(i => game.theme.course.holes[i].par);
  const parTot = pars.reduce((a, b) => a + b, 0);
  let html = '<table><tr><th>Hole</th>' + holes.map((_, i) => `<th>${i + 1}</th>`).join('') + '<th>Total</th><th>±</th></tr>';
  html += '<tr class="par"><td>Par</td>' + pars.map(p => `<td>${p}</td>`).join('') + `<td class="tot">${parTot}</td><td></td></tr>`;
  for (const [i, p] of game.players.entries()) {
    const sc = p.scores.slice(0, upto);
    const tot = sc.reduce((a, b) => a + b, 0), d = tot - parTot;
    html += `<tr><td><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PLAYER_COLOURS[i]};border:1px solid #0003;margin-right:6px"></span>${escapeHtml(p.name)}</td>`
      + sc.map((s, k) => `<td class="${s < pars[k] ? 'under' : s > pars[k] ? 'over' : ''}">${s}</td>`).join('')
      + `<td class="tot">${tot}</td><td class="${d < 0 ? 'under' : d > 0 ? 'over' : ''}">${d === 0 ? 'E' : d > 0 ? '+' + d : d}</td></tr>`;
  }
  return html + '</table>';
}

function showHoleCard() {
  game.screen = 'card';
  const last = game.holeN === game.holeList.length - 1;
  if (last) return showFinal();
  cardEl.querySelector('.box').innerHTML = `<h3>Hole ${game.holeN + 1} done</h3><div class="sub">${escapeHtml(game.def.name)} · Par ${game.def.par}</div>${scoreTable(game.holeN + 1)}
    <div class="actions"><button id="next">Next hole →</button></div>`;
  cardEl.classList.remove('hidden');
  $('next').onclick = () => { cardEl.classList.add('hidden'); game.holeN++; game.screen = 'play'; loadHole(); };
}

function showFinal() {
  const totals = game.players.map(p => p.scores.reduce((a, b) => a + b, 0));
  const best = Math.min(...totals);
  const winners = game.players.filter((_, i) => totals[i] === best).map(p => p.name);
  const title = game.players.length === 1 ? `Round complete — ${best} strokes` : winners.length > 1 ? `It's a tie! ${winners.join(' & ')}` : `${winners[0]} wins!`;
  cardEl.querySelector('.box').innerHTML = `<h3>${escapeHtml(title)}</h3><div class="sub">${escapeHtml(game.theme.name)} · ${game.holeList.length} holes</div>${scoreTable(game.holeList.length)}
    <div class="actions"><button id="again">Play again</button><button id="toMenu" class="alt">Menu</button></div>`;
  cardEl.classList.remove('hidden');
  $('again').onclick = startRound;
  $('toMenu').onclick = showMenu;
}

// ============================================================
//  MENU
// ============================================================
const menuState = { count: 1, names: ['Player 1', 'Player 2', 'Player 3', 'Player 4'], theme: 'sunny', len: 15 };
try { Object.assign(menuState, JSON.parse(localStorage.getItem('minigolf-menu') || '{}')); } catch (e) { /* private mode */ }

function renderMenu() {
  $('countRow').innerHTML = [1, 2, 3, 4].map(n => `<button class="pill ${n === menuState.count ? 'on' : ''}" data-n="${n}">${n} player${n > 1 ? 's' : ''}</button>`).join('');
  $('names').innerHTML = menuState.names.slice(0, menuState.count).map((nm, i) =>
    `<label><span class="dot" style="background:${PLAYER_COLOURS[i]}"></span><input maxlength="14" data-i="${i}" value="${escapeHtml(nm)}"></label>`).join('');
  $('themes').innerHTML = THEMES.map(t => `<button class="theme ${t.id === menuState.theme ? 'on' : ''}" data-id="${t.id}" ${t.course ? '' : 'disabled'}>
      <span class="sw" style="background:${t.colour}"></span><b>${t.name}</b><small>${t.blurb}</small>${t.course ? '' : '<br><span class="soon">COMING SOON</span>'}</button>`).join('');
  $('lenRow').innerHTML = [10, 15].map(n => `<button class="pill ${n === menuState.len ? 'on' : ''}" data-len="${n}">${n} holes</button>`).join('');
  $('countRow').querySelectorAll('button').forEach(b => b.onclick = () => { menuState.count = +b.dataset.n; renderMenu(); });
  $('names').querySelectorAll('input').forEach(inp => inp.oninput = () => { menuState.names[+inp.dataset.i] = inp.value; });
  $('themes').querySelectorAll('button').forEach(b => b.onclick = () => { menuState.theme = b.dataset.id; renderMenu(); });
  $('lenRow').querySelectorAll('button').forEach(b => b.onclick = () => { menuState.len = +b.dataset.len; renderMenu(); });
}

function showMenu() {
  game.screen = 'menu';
  cardEl.classList.add('hidden');
  hud.classList.add('hidden');
  menuEl.classList.remove('hidden');
  ballMesh.visible = false;
  aimMesh.visible = false;
  renderMenu();
}

$('play').onclick = () => {
  try { localStorage.setItem('minigolf-menu', JSON.stringify(menuState)); } catch (e) { /* private mode */ }
  game.theme = THEMES.find(t => t.id === menuState.theme && t.course) || THEMES[0];
  game.roundLen = menuState.len;
  game.players = menuState.names.slice(0, menuState.count).map((n, i) => ({ name: n.trim() || `Player ${i + 1}`, scores: [] }));
  startRound();
};
$('btnMenu').onclick = showMenu;
$('btnView').onclick = () => toggleOverview();

function toggleOverview() {
  if (game.screen !== 'play') return;
  game.overview = !game.overview;
  $('btnView').classList.toggle('on', game.overview);
}

// ============================================================
//  INPUT
// ============================================================
const drag = { active: false, id: null, sx: 0, sy: 0, startAim: 0 };
canvas.addEventListener('pointerdown', e => {
  if (game.screen !== 'play' || game.phase !== 'aim' || game.overview) return;
  audio();
  drag.active = true; drag.id = e.pointerId; drag.sx = e.clientX; drag.sy = e.clientY; drag.startAim = game.aim;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (!drag.active || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  game.aim = drag.startAim + dx * 0.004;
  game.power = Math.min(1, Math.max(0, dy / (window.innerHeight * 0.38)));
});
function endDrag(e, cancel) {
  if (!drag.active || e.pointerId !== drag.id) return;
  drag.active = false;
  canvas.style.cursor = 'grab';
  if (!cancel) putt(); else game.power = 0;
}
canvas.addEventListener('pointerup', e => endDrag(e, false));
canvas.addEventListener('pointercancel', e => endDrag(e, true));

const keys = {};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (game.screen !== 'play') return;
  if (e.code === 'Space') { e.preventDefault(); putt(); }
  if (e.code === 'KeyV') toggleOverview();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function keyboardAim(dt) {
  if (game.phase !== 'aim' || drag.active) return;
  const fine = keys.ShiftLeft || keys.ShiftRight ? 0.25 : 1;
  if (keys.ArrowLeft || keys.KeyA) game.aim -= 1.2 * fine * dt;
  if (keys.ArrowRight || keys.KeyD) game.aim += 1.2 * fine * dt;
  if (keys.ArrowUp || keys.KeyW) game.power = Math.min(1, game.power + 0.6 * fine * dt);
  if (keys.ArrowDown || keys.KeyS) game.power = Math.max(0, game.power - 0.6 * fine * dt);
}

// ============================================================
//  CAMERA
// ============================================================
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let followDir = 0;

function cameraTarget(out) {
  const b = game.ball, h = game.hole;
  if (game.overview) {
    const bd = holeBounds(h), cx = (bd.x0 + bd.x1) / 2, cz = (bd.z0 + bd.z1) / 2;
    const span = Math.max(bd.x1 - bd.x0, bd.z1 - bd.z0);
    out.pos.set(cx, span * 0.95 + 1.5, cz + span * 0.35 + 1);
    out.look.set(cx, 0, cz);
    return;
  }
  let dir = game.aim, dist = 2.1, height = 1.0, ahead = 1.4;
  if (game.phase !== 'aim') {
    const sp = Math.hypot(b.vx, b.vz);
    if (sp > 0.25) followDir = Math.atan2(b.vz, b.vx);
    dir = followDir; dist = 2.4; height = 1.25; ahead = 0.8;
  } else followDir = dir;
  let tx = b.x, ty = b.y, tz = b.z;
  const tr = b.transport;
  if (tr && tr.kind === 'loop') {
    // watch a loop from the side so its circle reads clearly
    const lp = h.loops.reduce((best, l) => (Math.hypot(l.M.x - b.x, l.M.z - b.z) < Math.hypot(best.M.x - b.x, best.M.z - b.z) ? l : best));
    out.pos.set(lp.M.x - lp.d[1] * 1.5, lp.M.y + 0.55, lp.M.z + lp.d[0] * 1.5);
    out.look.set(lp.M.x, lp.M.y + lp.radius, lp.M.z);
    return;
  }
  if (tr) {
    // ride along with a visible machine; for a hidden tunnel, wait at the exit
    dir = followDir = Math.atan2(tr.exit.vz, tr.exit.vx);
    if (tr.visible) { dist = 2.6; height = 1.1; ahead = 0; }
    else { tx = tr.exit.x; tz = tr.exit.z; ty = groundHeight(h, tx, tz) || 0; }
  }
  const dx = Math.cos(dir), dz = Math.sin(dir);
  out.pos.set(tx - dx * dist, ty + height, tz - dz * dist);
  out.look.set(tx + dx * ahead, ty, tz + dz * ahead);
}
const camT = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
function snapCamera() { cameraTarget(camT); camPos.copy(camT.pos); camLook.copy(camT.look); }

function updateCamera(dt) {
  cameraTarget(camT);
  const k = 1 - Math.exp(-dt * (game.overview ? 3 : game.phase === 'aim' ? 10 : 4));
  camPos.lerp(camT.pos, k);
  camLook.lerp(camT.look, k);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (game.screen === 'play' || game.screen === 'card') {
    keyboardAim(dt);
    game.acc += dt;
    while (game.acc >= CONFIG.dt) {
      game.acc -= CONFIG.dt;
      if (game.phase === 'rolling') handleEvents(stepBall(game.hole, game.ball, game.simT, CONFIG.dt));
      game.simT += CONFIG.dt;
    }
    if (game.after && (game.timer -= dt) <= 0) { const fn = game.after; game.after = null; fn(); }

    const b = game.ball;
    if (b) {
      ballMesh.position.set(b.x, b.y + CONFIG.ballR, b.z);
      if (b.transport) ballMesh.visible = b.transport.visible;
      else if (game.phase === 'rolling' || game.phase === 'aim') ballMesh.visible = true;
      const sp = Math.hypot(b.vx, b.vz);
      if (sp > 0) ballMesh.rotateOnWorldAxis(new THREE.Vector3(b.vz, 0, -b.vx).normalize(), (sp * dt) / CONFIG.ballR);
      updateAimLine(b, game.aim, game.power, game.phase === 'aim' && !game.overview);
    }
    animateMachines(game.simT);
    if (anim.flag) anim.flag.rotation.y = Math.sin(now / 700) * 0.35;
    TEX.water.offset.set(now / 30000, now / 45000);
    TEX.lagoon.offset.set(now / 26000, now / 40000);
    TEX.sea.offset.set(now / 60000, now / 90000);
    for (const [i, f] of anim.flags.entries()) f.rotation.y = (f.userData.baseY ??= f.rotation.y) + Math.sin(now / 500 + i) * 0.25;
    if (anim.ship) { anim.ship.rotation.z = Math.sin(now / 1800) * 0.03; anim.ship.position.y = -0.1 + Math.sin(now / 1300) * 0.05; }
    updateSmoke(dt);
    TEX.lava.offset.set(now / 70000, now / 50000);
    for (const v of anim.volcanoes) {
      v.timer -= dt;
      if (v.timer <= 0) { emitAsh(v); v.timer = v.size > 1 ? 0.25 : 0.5; }
      if (v.glow) v.glow.intensity = 1.0 + Math.sin(now / 230) * 0.25 + Math.random() * 0.15;
    }
    for (const fl of anim.flames) { const k = 0.85 + Math.random() * 0.3; fl.scale.set(k, 0.8 + Math.random() * 0.5, k); }

    $('power').querySelector('.fill').style.height = `${Math.round(game.power * 100)}%`;
    const hint = game.overview ? 'Overview — press Overview (V) to return'
      : game.phase === 'aim' ? 'Drag down for power, sideways to aim — release to putt · ←→ aim ↑↓ power Space putt'
      : game.phase === 'rolling' ? `${game.players[game.cur].name} · stroke ${game.strokes}` : '';
    const hintEl = $('hint');
    if (hintEl.textContent !== hint) hintEl.textContent = hint;
    hintEl.style.visibility = hint ? 'visible' : 'hidden';
    updateCamera(dt);
  } else {
    // menu backdrop: slow orbit over the first hole
    const t = now / 1000;
    if (game.hole) {
      const bd = holeBounds(game.hole), cx = (bd.x0 + bd.x1) / 2, cz = (bd.z0 + bd.z1) / 2;
      camera.position.set(cx + Math.cos(t * 0.1) * 9, 4.5, cz + Math.sin(t * 0.1) * 9);
      camera.lookAt(cx, 0, cz);
      animateMachines(t);
    }
  }
  renderer.render(scene, camera);
}

// Menu backdrop hole
game.def = SUNNY_PARK.holes[3];
game.hole = parseHole(game.def);
buildHole(game.hole);
ballMesh.visible = false;
aimMesh.visible = false;
renderMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
