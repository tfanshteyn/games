// A carved tiki statue: stacked blocks with a painted face.
function addTiki(x, y, z, rad, h) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = Math.round(rnd() * 3) * (Math.PI / 2);
  const w = rad * 1.6;
  g.add(box(w, h, w, MAT.tiki, 0, h / 2, 0));
  g.add(box(w * 1.25, 0.04, w * 1.25, MAT.tiki, 0, h + 0.02, 0));
  g.add(box(w * 0.9, 0.05, w * 0.9, MAT.tiki, 0, h + 0.065, 0));
  const f = w / 2 + 0.002;
  for (const ex of [-w * 0.22, w * 0.22]) g.add(box(w * 0.2, w * 0.14, 0.01, MAT.tikiPaint, ex, h * 0.72, f));
  g.add(box(w * 0.12, h * 0.22, 0.02, MAT.tiki, 0, h * 0.55, f + 0.005));
  g.add(box(w * 0.55, w * 0.1, 0.01, MAT.tikiPaint, 0, h * 0.32, f));
  holeGroup.add(g);
}

function addFerns(spots) {
  if (!spots.length) return;
  // a fern frond: a narrow leaf that tapers to a point
  const leaf = new THREE.BufferGeometry();
  leaf.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, -0.02, 0.2, 0, 0, 0, 0, 0.02], 3));
  leaf.computeVertexNormals();
  const ferns = new THREE.InstancedMesh(leaf, MAT.fern, spots.length * 6);
  const m = new THREE.Matrix4(), e = new THREE.Euler(), q = new THREE.Quaternion(), s = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3();
  let k = 0;
  for (const [x, z] of spots) {
    for (let j = 0; j < 6; j++) {
      e.set(0, (j / 6) * Math.PI * 2 + rnd() * 0.5, 0.6 + rnd() * 0.5, 'YXZ');
      q.setFromEuler(e);
      m.compose(p.set(x, 0.02, z), q, s); ferns.setMatrixAt(k++, m);
    }
  }
  ferns.castShadow = true;
  holeGroup.add(ferns);
}

// A sprung steel frame round each block of trampoline cells.
function addTrampolineFrames(hole) {
  const pads = hole.cells.filter(c => c.ch === 'j');
  if (!pads.length) return;
  const c0 = Math.min(...pads.map(c => c.c)), c1 = Math.max(...pads.map(c => c.c)) + 1;
  const r0 = Math.min(...pads.map(c => c.r)), r1 = Math.max(...pads.map(c => c.r)) + 1;
  const y = pads[0].level * CONFIG.levelStep;
  const x0 = c0 * C, x1 = c1 * C, z0 = r0 * C, z1 = r1 * C;
  const g = new GeoBuilder();
  for (const [ax, az, bx, bz, nx, nz] of [[x0, z0, x1, z0, 0, -1], [x1, z0, x1, z1, 1, 0], [x1, z1, x0, z1, 0, 1], [x0, z1, x0, z0, -1, 0]]) {
    prism(g, ax, az, bx, bz, nx, nz, 0.06, y - 0.25, y + 0.015, y + 0.015);
  }
  holeGroup.add(meshOf(g, STYLE === 'factory' ? MAT.hazard : MACH.steel, true));
  for (let x = x0 + 0.1; x < x1; x += 0.2) for (const z of [z0 - 0.03, z1 + 0.03]) {
    const spring = new THREE.Mesh(new THREE.TorusGeometry(0.02, 0.004, 4, 8), MACH.steel);
    spring.position.set(x, y + 0.015, z); spring.rotation.y = Math.PI / 2;
    holeGroup.add(spring);
  }
}

// A smoking volcano cone with a glowing crater and lava running down its flanks.
function addVolcanoModel(v, big = false) {
  const g = new THREE.Group();
  g.position.set(v.x, -0.02, v.z);
  const cone = new THREE.Mesh(new THREE.CylinderGeometry(v.radius * 0.22, v.radius, v.height, 28, 6, true), MAT.basaltRock);
  // roughen the slopes
  const pos = cone.geometry.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const yy = pos.getY(i);
    if (Math.abs(yy - v.height / 2) < 1e-3 || Math.abs(yy + v.height / 2) < 1e-3) continue;
    const k = 1 + (rnd() - 0.5) * 0.12;
    pos.setX(i, pos.getX(i) * k); pos.setZ(i, pos.getZ(i) * k);
  }
  cone.geometry.computeVertexNormals();
  cone.position.y = v.height / 2; cone.castShadow = !big; cone.receiveShadow = true;
  g.add(cone);
  const crater = new THREE.Mesh(new THREE.CircleGeometry(v.radius * 0.22, 24), MAT.lava);
  crater.rotation.x = -Math.PI / 2; crater.position.y = v.height - v.radius * 0.02;
  g.add(crater);
  // lava streams down the sides
  for (let k = 0; k < (big ? 5 : 3); k++) {
    const a = rnd() * Math.PI * 2, pts = [];
    for (let i = 0; i <= 10; i++) {
      const t = i / 10, r = v.radius * (0.22 + 0.7 * t) + 0.02, wob = Math.sin(t * 9 + k) * 0.08;
      pts.push(new THREE.Vector3(Math.cos(a + wob) * r, v.height * (1 - t * 0.9) + 0.01, Math.sin(a + wob) * r));
    }
    g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 20, v.radius * (big ? 0.03 : 0.05), 5, false), MAT.lava));
  }
  holeGroup.add(g);
  const glow = new THREE.PointLight(0xff6a1a, big ? 0 : 1.2, v.radius * 3, 2);
  glow.position.set(v.x, v.height + 0.4, v.z);
  if (!big) holeGroup.add(glow);
  anim.volcanoes.push({ x: v.x, y: v.height, z: v.z, size: big ? 3 : 0.5, timer: 0, glow: big ? null : glow });
}

function addJungleTree(x, z, h) {
  const g = new THREE.Group();
  g.position.set(x, -0.02, z);
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.14, h, 7), MAT.bark);
  trunk.position.y = h / 2; trunk.castShadow = true;
  g.add(trunk);
  // a canopy of big flat leaves
  for (let k = 0; k < 7; k++) {
    const leaf = new THREE.Mesh(new THREE.CircleGeometry(0.55 + rnd() * 0.3, 7), k % 2 ? MAT.leafBig : MAT.leafDark);
    const a = (k / 7) * Math.PI * 2;
    leaf.position.set(Math.cos(a) * 0.45, h - 0.1 + rnd() * 0.3, Math.sin(a) * 0.45);
    leaf.rotation.set(-Math.PI / 2 + (rnd() - 0.5) * 0.7, a, 0, 'YXZ');
    leaf.castShadow = true;
    g.add(leaf);
  }
  // hanging vines
  for (let k = 0; k < 3; k++) {
    const len = 0.6 + rnd() * 0.8;
    const vine = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, len, 3), MAT.leafDark);
    vine.position.set((rnd() - 0.5) * 0.9, h - len / 2, (rnd() - 0.5) * 0.9);
    g.add(vine);
  }
  holeGroup.add(g);
}

function addBamboo(x, z) {
  const n = 4 + Math.floor(rnd() * 4);
  for (let i = 0; i < n; i++) {
    const h = 1.2 + rnd() * 1.6;
    const stalk = new THREE.Mesh(new THREE.CylinderGeometry(0.025, 0.03, h, 6), MAT.bamboo);
    stalk.position.set(x + (rnd() - 0.5) * 0.35, h / 2 - 0.02, z + (rnd() - 0.5) * 0.35);
    stalk.rotation.set((rnd() - 0.5) * 0.15, 0, (rnd() - 0.5) * 0.15);
    stalk.castShadow = true;
    holeGroup.add(stalk);
    const tuft = new THREE.Mesh(new THREE.ConeGeometry(0.12, 0.3, 5), MAT.fern);
    tuft.position.set(stalk.position.x, h - 0.05, stalk.position.z); tuft.rotation.x = Math.PI;
    holeGroup.add(tuft);
  }
}

function addTorch(x, z) {
  holeGroup.add(box(0.05, 1.1, 0.05, MAT.bamboo, x, 0.53, z));
  holeGroup.add(box(0.1, 0.1, 0.1, MAT.tiki, x, 1.1, z));
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.06, 0.2, 7), MAT.flame);
  flame.position.set(x, 1.25, z);
  holeGroup.add(flame);
  anim.flames.push(flame);
}

function addJungleScenery(hole) {
  const b = holeBounds(hole);
  const pick = (m0, m1) => {
    for (let i = 0; i < 40; i++) {
      const x = b.x0 - m1 + rnd() * (b.x1 - b.x0 + 2 * m1), z = b.z0 - m1 + rnd() * (b.z1 - b.z0 + 2 * m1);
      const dx = Math.max(b.x0 - x, 0, x - b.x1), dz = Math.max(b.z0 - z, 0, z - b.z1);
      const d = Math.hypot(dx, dz);
      if (d > m0 && d < m1 && Math.hypot(x - hole.tee.x, z - hole.tee.z) > 2.8) return [x, z]; // keep the tee-off camera clear
    }
    return [b.x1 + m1, b.z0];
  };
  for (let i = 0; i < 12; i++) { const [x, z] = pick(2, 9); addJungleTree(x, z, 2.2 + rnd() * 2); }
  for (let i = 0; i < 5; i++) { const [x, z] = pick(1.8, 8); addPalm(x, z, 2.4 + rnd() * 1.4, 0.2 + rnd() * 0.3, rnd() * 6.28); }
  for (let i = 0; i < 6; i++) { const [x, z] = pick(1, 4); addBamboo(x, z); }
  for (let i = 0; i < 4; i++) { const [x, z] = pick(0.6, 2.2); addTiki(x, -0.02, z, 0.18, 0.6 + rnd() * 0.5); }
  for (let i = 0; i < 6; i++) { const [x, z] = pick(0.5, 1.4); addTorch(x, z); }
  const ferns = [];
  for (let i = 0; i < 40; i++) ferns.push(pick(0.3, 3));
  addFerns(ferns);
  const rocks = 16;
  const rock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), MAT.basaltRock, rocks);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < rocks; i++) {
    const [x, z] = pick(0.4, 6), r = 0.12 + rnd() * 0.4;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6);
    m.compose(p.set(x, r * 0.3, z), q, s.set(r * 1.3, r * 0.9, r)); rock.setMatrixAt(i, m);
  }
  rock.castShadow = true; rock.receiveShadow = true; holeGroup.add(rock);
  // bamboo fence round the plot
  const fx0 = b.x0 - 1.4, fx1 = b.x1 + 1.4, fz0 = b.z0 - 1.4, fz1 = b.z1 + 1.4;
  for (const [ax, az, bx, bz] of [[fx0, fz0, fx1, fz0], [fx1, fz0, fx1, fz1], [fx1, fz1, fx0, fz1], [fx0, fz1, fx0, fz0]]) {
    const len = Math.hypot(bx - ax, bz - az), n = Math.round(len / 1.4);
    for (let i = 0; i <= n; i++) holeGroup.add(box(0.05, 0.55, 0.05, MAT.bamboo, ax + ((bx - ax) * i) / n, 0.26, az + ((bz - az) * i) / n));
    for (const y of [0.22, 0.45]) {
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, len, 6), MAT.bamboo);
      pole.position.set((ax + bx) / 2, y, (az + bz) / 2);
      pole.rotation.set(0, -Math.atan2(bz - az, bx - ax), Math.PI / 2);
      holeGroup.add(pole);
    }
  }
  // the great volcano on its own island, smoking on the horizon
  addVolcanoModel({ x: b.x1 + 45, z: b.z0 - 55, height: 18, radius: 22 }, true);
}

function emitAsh(v) {
  const p = new THREE.Mesh(new THREE.SphereGeometry(0.1 * v.size, 8, 6), MAT.ash.clone());
  p.position.set(v.x + (Math.random() - 0.5) * 0.2 * v.size, v.y + 0.1, v.z + (Math.random() - 0.5) * 0.2 * v.size);
  p.userData = { vx: (Math.random() - 0.3) * 0.25 * v.size, vy: (0.35 + Math.random() * 0.3) * v.size, vz: (Math.random() - 0.5) * 0.25 * v.size, life: 3.5, grow: 0.5 };
  scene.add(p); puffs.push(p);
}

function addHedges(spots) {
  if (!spots.length) return;
  const hedge = new THREE.InstancedMesh(new THREE.BoxGeometry(0.2, 0.18, 0.2), MAT.hedge, spots.length);
  const m = new THREE.Matrix4();
  spots.forEach(([x, z], i) => { m.makeTranslation(x, 0.07, z); hedge.setMatrixAt(i, m); });
  hedge.castShadow = true; hedge.receiveShadow = true;
  holeGroup.add(hedge);
}

// A suit of armour on a plinth, holding a shield.
function addArmour(x, y, z, rad) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = rnd() * 6.28;
  g.add(box(rad * 2, 0.04, rad * 2, MAT.castle, 0, 0.02, 0));
  const body = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.55, rad * 0.75, 0.2, 10), MAT.armour);
  body.position.y = 0.14; body.castShadow = true;
  const helm = new THREE.Mesh(new THREE.SphereGeometry(rad * 0.5, 12, 10), MAT.armour);
  helm.position.y = 0.29; helm.castShadow = true;
  const visor = box(rad * 0.6, 0.012, 0.01, MAT.dark, 0, 0.29, rad * 0.48);
  const plume = new THREE.Mesh(new THREE.ConeGeometry(0.015, 0.08, 6), MAT.flag);
  plume.position.y = 0.37;
  const shield = box(rad * 0.9, rad * 1.1, 0.012, MAT.banner, rad * 0.5, 0.16, rad * 0.6);
  shield.rotation.y = 0.4;
  g.add(body, helm, visor, plume, shield);
  holeGroup.add(g);
}

// A wooden catapult behind the mouth; its arm is cocked, ready to fling.
function addCatapultModel(hole, cn) {
  const a = cn.a;
  const bx = a.x - a.out[0] * 0.6, bz = a.z - a.out[1] * 0.6;
  const g = new THREE.Group();
  g.position.set(bx, a.y, bz);
  g.rotation.y = Math.atan2(cn.target.x - bx, cn.target.z - bz);
  for (const sx of [-0.16, 0.16]) {
    g.add(box(0.05, 0.05, 0.6, MAT.wood, sx, 0.05, 0));
    const upright = box(0.05, 0.4, 0.05, MAT.wood, sx, 0.25, 0.05);
    g.add(upright);
    for (const sz of [-0.24, 0.24]) {
      const wheel = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.04, 12), MAT.wood);
      wheel.rotation.z = Math.PI / 2; wheel.position.set(sx * 1.25, 0.07, sz); wheel.castShadow = true;
      g.add(wheel);
    }
  }
  g.add(box(0.36, 0.04, 0.04, MAT.wood, 0, 0.42, 0.05));
  const arm = box(0.05, 0.05, 0.7, MAT.wood, 0, 0.3, -0.1);
  arm.rotation.x = 0.55;
  const cup = new THREE.Mesh(new THREE.SphereGeometry(0.06, 10, 6, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2), MAT.wood);
  cup.position.set(0, 0.12, -0.38);
  g.add(arm, cup);
  holeGroup.add(g);
  holeGroup.add(rails([{ x: a.x, y: a.y + 0.01, z: a.z }, { x: bx, y: a.y + 0.1, z: bz }], 0.025, 0.006, MACH.steel));
}

// The ball lift dressed as a round stone winch tower with a slate cone roof.
function addWinchTower(lf) {
  const a = lf.a, b = lf.b;
  const top = Math.max(a.y, b.y) + 0.45;
  const tx = a.x - a.out[0] * 0.35, tz = a.z - a.out[1] * 0.35;
  const H = top + 0.2 - a.y;
  const tower = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.3, H, 16, 1, true, Math.PI * 0.25, Math.PI * 1.5), MAT.castle);
  tower.position.set(tx, a.y + H / 2, tz);
  tower.rotation.y = Math.atan2(a.out[0], a.out[1]) + Math.PI; // the open side faces the lane
  tower.castShadow = true;
  const roof = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.5, 16), MAT.slate);
  roof.position.set(tx, a.y + H + 0.3, tz); roof.castShadow = true;
  holeGroup.add(tower, roof);
  addBanner(tx, a.y + H + 0.55, tz, 0.5);
}

function addBanner(x, y, z, pole) {
  holeGroup.add(box(0.02, pole, 0.02, MAT.wood, x, y + pole / 2, z));
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.22, 0.14).translate(0.11, 0, 0), MAT.banner);
  flag.position.set(x, y + pole - 0.08, z);
  holeGroup.add(flag);
  anim.flags.push(flag);
}

// The drawbridge: planks hinged at the far bank, raised and lowered on chains from two pillars.
function addDrawbridgeModel(hole) {
  const db = hole.drawbridge, cells = db.cells;
  const c0 = Math.min(...cells.map(c => c.c)), c1 = Math.max(...cells.map(c => c.c)) + 1;
  const r0 = Math.min(...cells.map(c => c.r)), r1 = Math.max(...cells.map(c => c.r)) + 1;
  const y = cells[0].level * CONFIG.levelStep;
  const [dx, dz] = db.d; // towards the hinge
  // hinge line on the far side of the span
  const hx = dx > 0 ? c1 * C : dx < 0 ? c0 * C : (c0 + c1) * C / 2;
  const hz = dz > 0 ? r1 * C : dz < 0 ? r0 * C : (r0 + r1) * C / 2;
  const spanLen = dx ? (c1 - c0) * C : (r1 - r0) * C, width = dx ? (r1 - r0) * C : (c1 - c0) * C;
  const pivot = new THREE.Group();
  pivot.position.set(hx, y, hz);
  pivot.rotation.order = 'YXZ'; // turn to face the span first, then tilt about the hinge
  pivot.rotation.y = Math.atan2(-dx, -dz); // local +z points from the hinge back across the span
  const deck = box(width, 0.04, spanLen, MAT.deck, 0, -0.02, spanLen / 2);
  deck.castShadow = true; deck.receiveShadow = true;
  pivot.add(deck);
  for (const sx of [-width / 2 + 0.04, width / 2 - 0.04]) pivot.add(box(0.05, 0.05, spanLen, MAT.iron, sx, 0.005, spanLen / 2));
  holeGroup.add(pivot);
  const pillars = [];
  for (const s of [-1, 1]) {
    const px = hx + (dx ? 0 : s * (width / 2 + 0.15)) + dx * 0.15, pz = hz + (dz ? 0 : s * (width / 2 + 0.15)) + dz * 0.15;
    holeGroup.add(box(0.22, 0.9, 0.22, MAT.castle, px, y + 0.45, pz));
    holeGroup.add(box(0.28, 0.06, 0.28, MAT.castle, px, y + 0.93, pz));
    pillars.push(new THREE.Vector3(px, y + 0.85, pz));
  }
  const chains = pillars.map(() => { const c = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1, 5), MAT.iron); holeGroup.add(c); return c; });
  anim.drawbridge = { db, pivot, chains, pillars, spanLen, width };
}

// A gatehouse: a stone block with battlements and two turrets, an arched passage, and an iron portcullis.
function addGatehouseModel(hole, p) {
  if (p.press) return addPressModel(hole, p);
  const g = new THREE.Group();
  const y0 = groundHeight(hole, p.x, p.z) || 0;
  g.position.set(p.x, y0, p.z);
  if (p.axis === 'x') g.rotation.y = Math.PI / 2; // local z runs along the lane
  const hw = p.halfWidth + 0.15, d = p.depth, dh = p.door / 2, H = 1.0, side = hw - dh;
  g.add(box(side, H, d, MAT.castle, -(dh + side / 2), H / 2, 0), box(side, H, d, MAT.castle, dh + side / 2, H / 2, 0));
  g.add(box(p.door, H - 0.3, d, MAT.castle, 0, 0.3 + (H - 0.3) / 2, 0));
  const dark = new THREE.Mesh(new THREE.PlaneGeometry(p.door, 0.3), MAT.dark);
  dark.position.set(0, 0.15, 0); g.add(dark);
  for (let x = -hw + 0.08; x < hw; x += 0.22) for (const zz of [-d / 2 + 0.05, d / 2 - 0.05]) g.add(box(0.12, 0.12, 0.1, MAT.castle, x, H + 0.06, zz));
  for (const s of [-1, 1]) {
    const turret = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.22, H + 0.4, 12), MAT.castle);
    turret.position.set(s * (hw + 0.12), (H + 0.4) / 2, 0); turret.castShadow = true;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.27, 0.45, 12), MAT.slate);
    roof.position.set(s * (hw + 0.12), H + 0.62, 0);
    g.add(turret, roof);
  }
  // the portcullis grid, slid up and down in the passage
  const grid = new THREE.Group();
  for (let x = -dh + 0.02; x <= dh - 0.02 + 1e-6; x += 0.055) grid.add(box(0.012, 0.32, 0.012, MAT.iron, x, 0.16, 0));
  for (const yy of [0.06, 0.16, 0.26]) grid.add(box(p.door - 0.02, 0.012, 0.014, MAT.iron, 0, yy, 0));
  for (let x = -dh + 0.02; x <= dh - 0.02 + 1e-6; x += 0.055) { const tip = new THREE.Mesh(new THREE.ConeGeometry(0.01, 0.03, 4), MAT.iron); tip.position.set(x, -0.005, 0); tip.rotation.x = Math.PI; grid.add(tip); }
  g.add(grid);
  holeGroup.add(g);
  const [bx1, bz1] = laneXZ(p, 0, 0);
  addBanner(bx1 + (p.axis === 'z' ? hw + 0.12 : 0), y0 + H + 0.8, bz1 + (p.axis === 'x' ? hw + 0.12 : 0), 0.4);
  anim.gates.push({ p, grid });
}

// A crenellated curtain wall between two points, with a round tower at each end.
function addCastleWall(ax, az, bx, bz, h) {
  const len = Math.hypot(bx - ax, bz - az), ang = Math.atan2(bz - az, bx - ax);
  const wall = box(len, h, 0.4, MAT.castle, (ax + bx) / 2, h / 2 - 0.02, (az + bz) / 2);
  wall.rotation.y = -ang;
  holeGroup.add(wall);
  const n = Math.floor(len / 0.3);
  for (let i = 0; i < n; i += 2) {
    const t = (i + 0.5) / n;
    const m = box(0.15, 0.14, 0.42, MAT.castle, ax + (bx - ax) * t, h + 0.05, az + (bz - az) * t);
    m.rotation.y = -ang;
    holeGroup.add(m);
  }
  for (const [x, z] of [[ax, az], [bx, bz]]) {
    const tw = new THREE.Mesh(new THREE.CylinderGeometry(0.38, 0.42, h + 0.6, 14), MAT.castle);
    tw.position.set(x, (h + 0.6) / 2 - 0.02, z); tw.castShadow = true;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.48, 0.7, 14), MAT.slate);
    roof.position.set(x, h + 0.95, z); roof.castShadow = true;
    holeGroup.add(tw, roof);
    addBanner(x, h + 1.25, z, 0.5);
  }
}

function addCastleScenery(hole) {
  const b = holeBounds(hole);
  const pick = (m0, m1) => {
    for (let i = 0; i < 40; i++) {
      const x = b.x0 - m1 + rnd() * (b.x1 - b.x0 + 2 * m1), z = b.z0 - m1 + rnd() * (b.z1 - b.z0 + 2 * m1);
      const dx = Math.max(b.x0 - x, 0, x - b.x1), dz = Math.max(b.z0 - z, 0, z - b.z1);
      const d = Math.hypot(dx, dz);
      if (d > m0 && d < m1 && Math.hypot(x - hole.tee.x, z - hole.tee.z) > 2.8) return [x, z];
    }
    return [b.x1 + m1, b.z0];
  };
  // round-topped trees and clipped hedges in the castle grounds
  for (let i = 0; i < 14; i++) {
    const [x, z] = pick(2.5, 10), h = 1.4 + rnd() * 1.5, r = 0.6 + rnd() * 0.5;
    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.12, h, 6), MAT.bark);
    trunk.position.set(x, h / 2, z); trunk.castShadow = true;
    const crown = new THREE.Mesh(new THREE.IcosahedronGeometry(r, 1), MAT.leaf);
    crown.position.set(x, h + r * 0.5, z); crown.castShadow = true;
    holeGroup.add(trunk, crown);
  }
  for (let i = 0; i < 10; i++) {
    const [x, z] = pick(0.6, 2.4);
    const hd = box(0.5 + rnd() * 0.6, 0.35, 0.3, MAT.hedge, x, 0.16, z); hd.rotation.y = rnd() * 6;
    holeGroup.add(hd);
  }
  for (let i = 0; i < 4; i++) { const [x, z] = pick(0.6, 2); addArmour(x, -0.02, z, 0.16); }
  for (let i = 0; i < 4; i++) { const [x, z] = pick(0.5, 1.6); addBanner(x, -0.02, z, 1.4); }
  // low crenellated wall round the plot, with corner towers
  const fx0 = b.x0 - 1.4, fx1 = b.x1 + 1.4, fz0 = b.z0 - 1.4, fz1 = b.z1 + 1.4;
  const corners = [[fx0, fz0], [fx1, fz0], [fx1, fz1], [fx0, fz1]];
  for (let k = 0; k < 4; k++) {
    const [ax, az] = corners[k], [bx, bz] = corners[(k + 1) % 4];
    // leave the stretch behind the tee open so the camera can see over it
    const len = Math.hypot(bx - ax, bz - az), ang = Math.atan2(bz - az, bx - ax), n = Math.ceil(len / 0.6);
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n, mx = ax + (bx - ax) * (t0 + t1) / 2, mz = az + (bz - az) * (t0 + t1) / 2;
      if (Math.hypot(mx - hole.tee.x, mz - hole.tee.z) < 2.6) continue;
      const seg = box(len / n + 0.01, 0.4, 0.22, MAT.castle, mx, 0.18, mz); seg.rotation.y = -ang;
      const crn = box(len / n * 0.5, 0.12, 0.24, MAT.castle, mx, 0.44, mz); crn.rotation.y = -ang;
      holeGroup.add(seg, crn);
    }
  }
  for (const [x, z] of corners) {
    if (Math.hypot(x - hole.tee.x, z - hole.tee.z) < 2.6) continue;
    const tw = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.32, 1.2, 12), MAT.castle);
    tw.position.set(x, 0.58, z); tw.castShadow = true;
    const roof = new THREE.Mesh(new THREE.ConeGeometry(0.38, 0.55, 12), MAT.slate);
    roof.position.set(x, 1.45, z);
    holeGroup.add(tw, roof);
    addBanner(x, 1.68, z, 0.45);
  }
  // the castle on its hill, keeping watch over the course
  const cx = (b.x0 + b.x1) / 2 + 4, cz = b.z0 - 26;
  const hill = new THREE.Mesh(new THREE.SphereGeometry(14, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2), MAT.grass);
  hill.scale.y = 0.35; hill.position.set(cx, -0.5, cz);
  holeGroup.add(hill);
  const base = 4.4;
  const keep = box(4, 6, 4, MAT.castle, cx, base + 3, cz);
  holeGroup.add(keep);
  for (const [ox, oz] of [[-4, -3], [4, -3], [-4, 3], [4, 3]]) {
    const tw = new THREE.Mesh(new THREE.CylinderGeometry(1, 1.1, 6, 14), MAT.castle);
    tw.position.set(cx + ox, base + 2.6, cz + oz);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(1.25, 2.4, 14), MAT.slate);
    roof.position.set(cx + ox, base + 6.8, cz + oz);
    holeGroup.add(tw, roof);
  }
  for (const [ax, az, bx, bz] of [[-4, 3, 4, 3], [-4, -3, 4, -3], [-4, -3, -4, 3], [4, -3, 4, 3]]) {
    const w = box(Math.abs(bx - ax) || 0.6, 3.2, Math.abs(bz - az) || 0.6, MAT.castle, cx + (ax + bx) / 2, base + 1.4, cz + (az + bz) / 2);
    holeGroup.add(w);
  }
  const keepRoof = new THREE.Mesh(new THREE.ConeGeometry(3, 2.5, 4), MAT.slate);
  keepRoof.position.set(cx, base + 7.2, cz); keepRoof.rotation.y = Math.PI / 4;
  holeGroup.add(keepRoof);
  const bigBanner = new THREE.Mesh(new THREE.PlaneGeometry(1.2, 0.8).translate(0.6, 0, 0), MAT.banner);
  bigBanner.position.set(cx, base + 9.2, cz);
  holeGroup.add(box(0.08, 1.4, 0.08, MAT.wood, cx, base + 8.8, cz), bigBanner);
  anim.flags.push(bigBanner);
}

function animateCastle(t) {
  const a = anim.drawbridge;
  if (a) {
    const raise = drawbridgeRaise(a.db, t);
    a.pivot.rotation.x = -raise * 1.35; // swings up about its hinge
    a.pivot.updateMatrixWorld(true);
    // chains run from the pillar tops to the bridge's free end
    a.chains.forEach((c, i) => {
      const end = new THREE.Vector3((i ? 1 : -1) * (a.width / 2 - 0.05), 0, a.spanLen).applyMatrix4(a.pivot.matrixWorld);
      const st = a.pillars[i];
      c.position.copy(st).add(end).multiplyScalar(0.5);
      c.scale.set(1, st.distanceTo(end), 1);
      c.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), end.clone().sub(st).normalize());
    });
  }
  for (const { p, grid } of anim.gates) grid.position.y = portcullisLift(p, t) * 0.22;
}

// Shiny materials reflect the current sky, rendered into a prefiltered environment map.
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;
MAT.ice.userData.env = 0.5;
for (const m of [MAT.water, MAT.lagoon, MAT.moat, MAT.sea, MAT.iceWater]) m.userData.env = 0.3;
const SHINY = [MACH.steel, MACH.yellow, MAT.iron, MAT.armour, MAT.gold, MAT.water, MAT.lagoon, MAT.moat, MAT.sea,
  MAT.ice, MAT.iceBlock, MAT.iceWater, MAT.iceTrough, MAT.plate, MAT.hazard, MAT.corrugated, MAT.robotOrange, MAT.robotWhite,
  MAT.robotDark, MAT.pipe, MAT.pipeRed, MAT.barrelBlue, MAT.acrylic];
const ENV_GROUND = { park: '#5f8f48', beach: '#e6cf9c', jungle: '#3d5a2a', castle: '#5f8f48', ice: '#e8eef5', factory: '#7a7975' };
function updateEnvironment() {
  // a painted panorama: sky above, a bright sun, the course's ground below
  const sk = SKIES[STYLE] || SKIES.park;
  const pano = canvasTex(512, 256, (g, w, h) => {
    const gr = g.createLinearGradient(0, 0, 0, h);
    gr.addColorStop(0, sk.top); gr.addColorStop(0.48, sk.bottom); gr.addColorStop(0.52, ENV_GROUND[STYLE] || ENV_GROUND.park); gr.addColorStop(1, ENV_GROUND[STYLE] || ENV_GROUND.park);
    g.fillStyle = gr; g.fillRect(0, 0, w, h);
    const sun = g.createRadialGradient(w * 0.62, h * 0.2, 0, w * 0.62, h * 0.2, 40);
    sun.addColorStop(0, 'rgba(255,255,240,1)'); sun.addColorStop(1, 'rgba(255,255,240,0)');
    g.fillStyle = sun; g.fillRect(0, 0, w, h);
  });
  pano.mapping = THREE.EquirectangularReflectionMapping;
  if (envRT) envRT.dispose();
  envRT = pmrem.fromEquirectangular(pano);
  pano.dispose();
  for (const m of SHINY) { m.envMap = envRT.texture; m.envMapIntensity = m.userData.env ?? 1; m.needsUpdate = true; }
}

// Random spots in a band m0..m1 metres outside the plot, never near the tee so its camera stays clear.
function scatterPicker(hole) {
  const b = holeBounds(hole);
  return (m0, m1) => {
    for (let i = 0; i < 60; i++) {
      const x = b.x0 - m1 + rnd() * (b.x1 - b.x0 + 2 * m1), z = b.z0 - m1 + rnd() * (b.z1 - b.z0 + 2 * m1);
      const d = Math.hypot(Math.max(b.x0 - x, 0, x - b.x1), Math.max(b.z0 - z, 0, z - b.z1));
      if (d > m0 && d < m1 && Math.hypot(x - hole.tee.x, z - hole.tee.z) > 2.8) return [x, z];
    }
    return [b.x1 + m1, b.z0];
  };
}

//  CHUTES (bobsled run / marble run)
// ============================================================
// An open half-pipe swept along a curve; its bottom runs along the ball's path.
function troughGeometry(curve, n, R) {
  const pos = [], nor = [], uv = [], idx = [], segs = 12, up = new THREE.Vector3(0, 1, 0);
  const side = new THREE.Vector3(), upish = new THREE.Vector3(), centre = new THREE.Vector3(), p = new THREE.Vector3();
  let dist = 0, prev = null;
  for (let i = 0; i <= n; i++) {
    const t = i / n, q = curve.getPointAt(t), tan = curve.getTangentAt(t);
    if (prev) dist += q.distanceTo(prev);
    prev = q;
    side.crossVectors(tan, up).normalize();
    upish.crossVectors(side, tan).normalize();
    centre.copy(q).addScaledVector(upish, R);
    for (let k = 0; k <= segs; k++) {
      const a = -0.15 * Math.PI + (k / segs) * 1.3 * Math.PI;
      p.copy(centre).addScaledVector(side, Math.cos(a) * R).addScaledVector(upish, -Math.sin(a) * R);
      pos.push(p.x, p.y, p.z);
      const nn = centre.clone().sub(p).normalize();
      nor.push(nn.x, nn.y, nn.z);
      uv.push(k / segs, dist * 2);
    }
  }
  for (let i = 0; i < n; i++) for (let k = 0; k < segs; k++) {
    const a = i * (segs + 1) + k, b = a + segs + 1;
    idx.push(a, b, a + 1, a + 1, b, b + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
  g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  g.setIndex(idx);
  return g;
}

function addChuteModel(hole, ch) {
  const factory = STYLE === 'factory';
  const curve = new THREE.CatmullRomCurve3(ch.path.map(p => new THREE.Vector3(p.x, p.y, p.z)));
  const n = Math.max(60, Math.round(ch.length * 16));
  const R = factory ? 0.034 : 0.055;
  if (factory) {
    // a clear acrylic tube with steel collars
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(ch.path.map(p => new THREE.Vector3(p.x, p.y + CONFIG.ballR, p.z))), n, R, 14, false), MAT.acrylic);
    tube.renderOrder = 2;
    holeGroup.add(tube);
    for (let s = 0.25; s < ch.length; s += 0.5) {
      const t = s / ch.length, q = curve.getPointAt(t), tan = curve.getTangentAt(t);
      const ring = new THREE.Mesh(new THREE.TorusGeometry(R + 0.006, 0.006, 6, 18), MACH.steel);
      ring.position.set(q.x, q.y + CONFIG.ballR, q.z);
      ring.lookAt(q.x + tan.x, q.y + CONFIG.ballR + tan.y, q.z + tan.z);
      holeGroup.add(ring);
    }
  } else {
    // a bobsled run: an icy half-pipe with red and blue lips
    const trough = new THREE.Mesh(troughGeometry(curve, n, R), MAT.iceTrough);
    trough.castShadow = true; trough.receiveShadow = true;
    holeGroup.add(trough);
    for (const [s, mat] of [[1, MAT.scarf], [-1, MAT.scarfBlue]]) {
      const lip = [];
      for (let i = 0; i <= 80; i++) {
        const t = i / 80, q = curve.getPointAt(t), tan = curve.getTangentAt(t);
        const side = new THREE.Vector3().crossVectors(tan, new THREE.Vector3(0, 1, 0)).normalize();
        lip.push(q.clone().addScaledVector(side, s * R * 1.02).add(new THREE.Vector3(0, R * 1.05, 0)));
      }
      const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(lip), 160, 0.007, 6, false), mat);
      holeGroup.add(tube);
    }
  }
  // supports down to the ground every so often
  for (let s = 0.5; s < ch.length - 0.3; s += factory ? 0.9 : 1.1) {
    const q = curve.getPointAt(s / ch.length);
    const gy = groundHeight(hole, q.x, q.z) ?? -0.02;
    const h = q.y - 0.01 - gy;
    if (h < 0.05) continue;
    holeGroup.add(box(0.025, h, 0.025, factory ? MACH.steel : MAT.wood, q.x, gy + h / 2, q.z));
  }
  // a funnel at the top and a collar at the bottom
  for (const [m, funnel] of [[ch.a, true], [ch.b, false]]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(funnel ? 0.09 : 0.06, 0.014, 8, 20), factory ? MACH.yellow : MAT.scarf);
    ring.position.set(m.x - m.out[0] * 0.1, m.y + 0.03, m.z - m.out[1] * 0.1);
    ring.rotation.x = Math.PI / 2;
    holeGroup.add(ring);
  }
}

function addSnowman(x, y, z, rad) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = rnd() * 6.28;
  const ball = (r, yy) => { const m = new THREE.Mesh(new THREE.SphereGeometry(r, 20, 14), MAT.snow); m.position.y = yy; m.castShadow = true; m.receiveShadow = true; g.add(m); return yy; };
  const b = ball(rad, rad * 0.85), m = ball(rad * 0.74, b + rad * 1.3), h = ball(rad * 0.52, m + rad * 1.05);
  for (const s of [-1, 1]) {
    const eye = new THREE.Mesh(new THREE.SphereGeometry(rad * 0.07, 6, 4), MAT.coal);
    eye.position.set(s * rad * 0.18, h + rad * 0.12, rad * 0.46); g.add(eye);
    const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.006, rad * 1.8, 5), MAT.bark);
    arm.position.set(s * rad * 1.3, m + rad * 0.25, 0); arm.rotation.z = s * -1.0; g.add(arm);
  }
  for (const yy of [m + rad * 0.3, m - rad * 0.1, b + rad * 0.5]) { const btn = new THREE.Mesh(new THREE.SphereGeometry(rad * 0.07, 6, 4), MAT.coal); btn.position.set(0, yy, rad * 0.7); g.add(btn); }
  const nose = new THREE.Mesh(new THREE.ConeGeometry(rad * 0.09, rad * 0.5, 8), MAT.carrot);
  nose.rotation.x = Math.PI / 2; nose.position.set(0, h, rad * 0.7); g.add(nose);
  const scarf = new THREE.Mesh(new THREE.TorusGeometry(rad * 0.5, rad * 0.1, 6, 16), rnd() < 0.5 ? MAT.scarf : MAT.scarfBlue);
  scarf.rotation.x = Math.PI / 2; scarf.position.y = m + rad * 0.62; g.add(scarf);
  const brim = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.55, rad * 0.55, rad * 0.05, 16), MAT.coal);
  brim.position.y = h + rad * 0.42;
  const hat = new THREE.Mesh(new THREE.CylinderGeometry(rad * 0.36, rad * 0.38, rad * 0.55, 16), MAT.coal);
  hat.position.y = h + rad * 0.7;
  g.add(brim, hat);
  holeGroup.add(g);
}

function addSnowMounds(spots) {
  if (!spots.length) return;
  const mound = new THREE.InstancedMesh(new THREE.SphereGeometry(1, 12, 6, 0, Math.PI * 2, 0, Math.PI / 2), MAT.snowCap, spots.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  spots.forEach(([x, z], i) => {
    const r = i % 2 ? 0 : 0.05 + rnd() * 0.07; // drifts heaped against every other spot
    m.compose(p.set(x, -0.02, z), q, s.set(r * (1 + rnd() * 0.5), r * 0.8, r)); mound.setMatrixAt(i, m);
  });
  mound.castShadow = true; mound.receiveShadow = true;
  holeGroup.add(mound);
}

// Snowy pines, instanced: a trunk, three tiers of branches and snow on each tier.
function addPines(hole, pick, count, m0, m1) {
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.06, 0.1, 1, 6), MAT.bark, count);
  const tiers = [0, 1, 2].map(() => new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 8), MAT.pine, count));
  const caps = [0, 1, 2].map(() => new THREE.InstancedMesh(new THREE.ConeGeometry(1, 1, 8), MAT.pineSnow, count));
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < count; i++) {
    const [x, z] = pick(m0, m1), h = 1.8 + rnd() * 2.6, w = h * (0.32 + rnd() * 0.08);
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6);
    m.compose(p.set(x, h * 0.12, z), q, s.set(1, h * 0.25, 1)); trunk.setMatrixAt(i, m);
    for (let k = 0; k < 3; k++) {
      const ty = h * (0.3 + k * 0.22), tw = w * (1 - k * 0.27), th = h * 0.42;
      m.compose(p.set(x, ty + th / 2, z), q, s.set(tw, th, tw)); tiers[k].setMatrixAt(i, m);
      m.compose(p.set(x, ty + th * 0.62, z), q, s.set(tw * 0.78, th * 0.6, tw * 0.78)); caps[k].setMatrixAt(i, m);
    }
  }
  for (const im of [trunk, ...tiers, ...caps]) { im.castShadow = true; im.receiveShadow = true; holeGroup.add(im); }
}

function addCabin(x, z, turn) {
  const g = new THREE.Group();
  g.position.set(x, -0.02, z); g.rotation.y = turn;
  const W = 2.4, D = 1.9, H = 1.3;
  for (let y = 0.1; y < H; y += 0.17) for (const [lx, lz, len, rot] of [[0, -D / 2, W + 0.2, 0], [0, D / 2, W + 0.2, 0], [-W / 2, 0, D + 0.2, Math.PI / 2], [W / 2, 0, D + 0.2, Math.PI / 2]]) {
    const log = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, len, 8), MAT.cabin);
    log.rotation.z = Math.PI / 2; log.rotation.y = rot; log.position.set(lx, y, lz); log.castShadow = true; log.receiveShadow = true;
    g.add(log);
  }
  g.add(box(W, H, D, MAT.cabin, 0, H / 2, 0));
  for (const s of [-1, 1]) { // a steep roof thick with snow
    const slab = box(W + 0.5, 0.12, D * 0.62, MAT.roof, 0, H + 0.42, s * D * 0.27);
    slab.rotation.x = s * 0.75;
    const snow = box(W + 0.55, 0.12, D * 0.62, MAT.snowCap, 0, H + 0.5, s * D * 0.3);
    snow.rotation.x = s * 0.75;
    g.add(slab, snow);
  }
  g.add(box(0.28, 0.9, 0.28, MAT.stone, W * 0.3, H + 0.75, -D * 0.15));
  for (const wx of [-0.6, 0.6]) {
    const win = box(0.42, 0.36, 0.02, MAT.glow, wx, 0.75, D / 2 + 0.1);
    g.add(win, box(0.48, 0.04, 0.04, MAT.wood, wx, 0.55, D / 2 + 0.12), box(0.04, 0.42, 0.03, MAT.wood, wx, 0.75, D / 2 + 0.12));
  }
  g.add(box(0.5, 0.85, 0.03, MAT.wood, 0, 0.43, D / 2 + 0.1));
  holeGroup.add(g);
  const chimney = new THREE.Vector3(W * 0.3, H + 1.25, -D * 0.15).applyAxisAngle(new THREE.Vector3(0, 1, 0), turn).add(g.position);
  anim.chimneys.push({ x: chimney.x, y: chimney.y, z: chimney.z, timer: 0 });
}

// The lift dressed as a ski lift: a steel pylon beside the tower with a cable and a chair.
function addSkiLiftPylon(lf) {
  const a = lf.a, top = Math.max(a.y, lf.b.y) + 0.45;
  const px = a.x - a.out[0] * 0.35 + a.out[1] * 0.42, pz = a.z - a.out[1] * 0.35 - a.out[0] * 0.42;
  const H = top + 0.9 - a.y;
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.04, 0.06, H, 10), MACH.steel);
  pole.position.set(px, a.y + H / 2, pz); pole.castShadow = true;
  holeGroup.add(pole);
  const arm = box(0.7, 0.05, 0.06, MACH.steel, px, a.y + H, pz);
  arm.rotation.y = Math.atan2(a.out[0], a.out[1]);
  holeGroup.add(arm);
  for (const s of [-1, 1]) {
    const wx = px + Math.cos(arm.rotation.y) * s * 0.32, wz = pz - Math.sin(arm.rotation.y) * s * 0.32;
    const wheel = new THREE.Mesh(new THREE.TorusGeometry(0.06, 0.012, 6, 14), MACH.yellow);
    wheel.position.set(wx, a.y + H - 0.05, wz); wheel.rotation.y = arm.rotation.y + Math.PI / 2;
    holeGroup.add(wheel);
    // the cable runs away from the course, up the mountain
    const far = new THREE.Vector3(wx - a.out[0] * 14, a.y + H + 4, wz - a.out[1] * 14), near = new THREE.Vector3(wx, a.y + H - 0.1, wz);
    const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.005, near.distanceTo(far), 4), MAT.coal);
    cable.position.copy(near).add(far).multiplyScalar(0.5);
    cable.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), far.clone().sub(near).normalize());
    holeGroup.add(cable);
    if (s > 0) {
      const at = near.clone().lerp(far, 0.18), chair = new THREE.Group();
      chair.position.copy(at);
      chair.add(box(0.012, 0.42, 0.012, MACH.steel, 0, -0.21, 0), box(0.42, 0.04, 0.2, MACH.red, 0, -0.42, 0.05), box(0.42, 0.2, 0.03, MACH.red, 0, -0.32, -0.05));
      chair.rotation.y = arm.rotation.y;
      holeGroup.add(chair);
    }
  }
}

function addIceScenery(hole) {
  const b = holeBounds(hole), pick = scatterPicker(hole);
  addPines(hole, pick, 44, 2.4, 14);
  // snow-capped boulders
  for (let i = 0; i < 10; i++) {
    const [x, z] = pick(0.6, 4), r = 0.15 + rnd() * 0.3;
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(r, 0), MAT.rock);
    rock.position.set(x, r * 0.3, z); rock.rotation.y = rnd() * 6; rock.castShadow = true;
    const cap = new THREE.Mesh(new THREE.SphereGeometry(r * 0.85, 10, 6, 0, Math.PI * 2, 0, Math.PI / 2), MAT.snowCap);
    cap.scale.y = 0.45; cap.position.set(x, r * 0.62, z);
    holeGroup.add(rock, cap);
  }
  for (let i = 0; i < 3; i++) { const [x, z] = pick(0.8, 3); addSnowman(x, -0.02, z, 0.22 + rnd() * 0.1); }
  // skis and poles planted in the snow
  for (let i = 0; i < 3; i++) {
    const [x, z] = pick(0.7, 2.5), turn = rnd() * 6;
    for (const s of [-1, 1]) {
      const ski = box(0.06, 1.3, 0.015, s > 0 ? MAT.scarf : MAT.scarfBlue, x + Math.cos(turn) * s * 0.06, 0.55, z + Math.sin(turn) * s * 0.06);
      ski.rotation.set(0, -turn, s * 0.08);
      const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 1.1, 5), MACH.steel);
      pole.position.set(x + Math.cos(turn) * s * 0.3, 0.5, z + Math.sin(turn) * s * 0.3 + 0.15); pole.rotation.z = s * 0.12;
      holeGroup.add(ski, pole);
    }
  }
  { // a wooden sled
    const [x, z] = pick(0.8, 2.5), sled = new THREE.Group();
    sled.position.set(x, -0.02, z); sled.rotation.y = rnd() * 6;
    for (const s of [-0.16, 0.16]) sled.add(box(0.03, 0.03, 0.9, MACH.red, s, 0.03, 0), box(0.025, 0.12, 0.025, MAT.wood, s, 0.1, 0.25), box(0.025, 0.12, 0.025, MAT.wood, s, 0.1, -0.25));
    for (let k = -3; k <= 3; k++) sled.add(box(0.4, 0.02, 0.08, MAT.wood, 0, 0.17, k * 0.11));
    holeGroup.add(sled);
  }
  { const [x, z] = pick(6, 10); addCabin(x, z, Math.atan2((b.x0 + b.x1) / 2 - x, (b.z0 + b.z1) / 2 - z)); }
  // a snow-capped split-rail fence round the plot, open behind the tee
  const fx0 = b.x0 - 1.4, fx1 = b.x1 + 1.4, fz0 = b.z0 - 1.4, fz1 = b.z1 + 1.4;
  const corners = [[fx0, fz0], [fx1, fz0], [fx1, fz1], [fx0, fz1]];
  for (let k = 0; k < 4; k++) {
    const [ax, az] = corners[k], [bx, bz] = corners[(k + 1) % 4];
    const len = Math.hypot(bx - ax, bz - az), ang = Math.atan2(bz - az, bx - ax), n = Math.ceil(len / 1.2);
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n, mx = ax + (bx - ax) * (t0 + t1) / 2, mz = az + (bz - az) * (t0 + t1) / 2;
      if (Math.hypot(mx - hole.tee.x, mz - hole.tee.z) < 2.6) continue;
      const px = ax + (bx - ax) * t0, pz = az + (bz - az) * t0;
      holeGroup.add(box(0.07, 0.6, 0.07, MAT.wood, px, 0.28, pz), box(0.09, 0.03, 0.09, MAT.snowCap, px, 0.6, pz));
      for (const y of [0.22, 0.45]) {
        const rail = box(len / n + 0.02, 0.05, 0.05, MAT.wood, mx, y, mz); rail.rotation.y = -ang;
        const cap = box(len / n + 0.02, 0.025, 0.06, MAT.snowCap, mx, y + 0.035, mz); cap.rotation.y = -ang;
        holeGroup.add(rail, cap);
      }
    }
  }
  // the mountains all round, fading into the haze
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  for (let i = 0; i < 14; i++) {
    const ang = (i / 14) * Math.PI * 2 + rnd() * 0.3, dist = 55 + rnd() * 25, h = 16 + rnd() * 22, r = h * (0.9 + rnd() * 0.5);
    const x = cx + Math.cos(ang) * dist, z = cz + Math.sin(ang) * dist;
    const peak = new THREE.Mesh(new THREE.ConeGeometry(r, h, 7, 3), MAT.mountain);
    peak.position.set(x, h / 2 - 1, z); peak.rotation.y = rnd() * 6;
    const snow = new THREE.Mesh(new THREE.ConeGeometry(r * 0.42, h * 0.42, 7, 1), MAT.pineSnow);
    snow.position.set(x, h - 1 - h * 0.21 + 0.05, z); snow.rotation.y = peak.rotation.y;
    holeGroup.add(peak, snow);
  }
  // a chairlift climbing away up the slope behind the course
  const lx = b.x1 + 5, lz0 = b.z1 + 4;
  const tops = [];
  for (let k = 0; k < 6; k++) {
    const z = lz0 - k * 7, y = k * 1.6, H = 4;
    holeGroup.add(box(0.12, H + y, 0.12, MACH.steel, lx, (H + y) / 2 - 0.02, z), box(1.4, 0.1, 0.12, MACH.steel, lx, H + y, z));
    tops.push(new THREE.Vector3(lx, H + y - 0.1, z));
  }
  for (const s of [-0.6, 0.6]) for (let k = 0; k < tops.length - 1; k++) {
    const p0 = tops[k].clone().add(new THREE.Vector3(s, 0, 0)), p1 = tops[k + 1].clone().add(new THREE.Vector3(s, 0, 0));
    const cable = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, p0.distanceTo(p1), 4), MAT.coal);
    cable.position.copy(p0).add(p1).multiplyScalar(0.5);
    cable.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), p1.clone().sub(p0).normalize());
    holeGroup.add(cable);
  }
  for (let k = 0; k < 10; k++) {
    const chair = new THREE.Group();
    chair.add(box(0.03, 0.9, 0.03, MACH.steel, 0, -0.45, 0), box(0.8, 0.08, 0.4, MACH.red, 0, -0.9, 0.1), box(0.8, 0.4, 0.06, MACH.red, 0, -0.72, -0.1));
    holeGroup.add(chair);
    anim.chairs.push({ chair, tops, u: k / 10, side: k % 2 ? 0.6 : -0.6 });
  }
  addSnowfall(hole);
}

function addSnowfall(hole) {
  const b = holeBounds(hole), N = 1600;
  const half = Math.max(b.x1 - b.x0, b.z1 - b.z0) / 2 + 10;
  const pos = new Float32Array(N * 3), speed = new Float32Array(N);
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  for (let i = 0; i < N; i++) {
    pos[i * 3] = cx + (rnd() * 2 - 1) * half; pos[i * 3 + 1] = rnd() * 9; pos[i * 3 + 2] = cz + (rnd() * 2 - 1) * half;
    speed[i] = 0.35 + rnd() * 0.45;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map: TEX.spark, color: '#ffffff', size: 0.07, transparent: true, opacity: 0.9, depthWrite: false }));
  pts.frustumCulled = false;
  holeGroup.add(pts);
  anim.snow = { pts, speed, half, cx, cz };
}

function addFactoryScenery(hole) {
  const b = holeBounds(hole), pick = scatterPicker(hole);
  const M = 7.5, X0 = b.x0 - M, X1 = b.x1 + M, Z0 = b.z0 - M, Z1 = b.z1 + M, H = 7;
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  // the hall: corrugated walls with a band of windows, open to the evening sky
  for (const [ax, az, bx, bz] of [[X0, Z0, X1, Z0], [X1, Z0, X1, Z1], [X1, Z1, X0, Z1], [X0, Z1, X0, Z0]]) {
    const len = Math.hypot(bx - ax, bz - az), ang = Math.atan2(bz - az, bx - ax);
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(len, H), MAT.corrugated);
    wall.geometry.attributes.uv.array.forEach((v, i, arr) => { arr[i] = v * (i % 2 ? H : len) * 0.5; });
    wall.position.set((ax + bx) / 2, H / 2 - 0.02, (az + bz) / 2);
    wall.rotation.y = -ang; wall.receiveShadow = true;
    holeGroup.add(wall);
    const n = Math.floor(len / 1.6);
    for (let i = 0; i < n; i++) {
      const t = (i + 0.5) / n, wx = ax + (bx - ax) * t, wz = az + (bz - az) * t;
      const pane = new THREE.Mesh(new THREE.PlaneGeometry(1.25, 1.3), MAT.windowPane);
      pane.position.set(wx, 5.1, wz); pane.rotation.y = wall.rotation.y;
      pane.translateZ(0.02);
      holeGroup.add(pane);
    }
    const beam = box(len, 0.35, 0.3, MAT.robotOrange, (ax + bx) / 2, H - 0.6, (az + bz) / 2); // gantry crane rail
    beam.rotation.y = -ang; beam.translateZ(0.4);
    holeGroup.add(beam);
    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.14, len, 12), rnd() < 0.5 ? MAT.pipe : MAT.pipeRed);
    pipe.rotation.z = Math.PI / 2; pipe.rotation.y = -ang;
    pipe.position.set((ax + bx) / 2, 2.6, (az + bz) / 2); pipe.translateZ(0.35);
    holeGroup.add(pipe);
  }
  // the far wall carries the sign, with the factory mascot standing beneath it
  const sign = new THREE.Mesh(new THREE.PlaneGeometry(6, 1.5), MAT.sign);
  sign.position.set(cx, 3.6, Z0 + 0.06);
  holeGroup.add(sign);
  addBigRobot(cx + 5.5, Z0 + 1.6, 0);
  // a conveyor running along the far wall with boxes riding on it
  const beltLen = X1 - X0 - 3;
  const line = box(beltLen, 0.08, 0.6, MAT.belt, cx, 0.75, Z0 + 2.4);
  holeGroup.add(line, box(beltLen, 0.7, 0.5, MAT.robotDark, cx, 0.36, Z0 + 2.4));
  for (let k = 0; k < 9; k++) {
    const crate = box(0.45, 0.4, 0.45, MAT.wood, 0, 0.99, Z0 + 2.4);
    holeGroup.add(crate);
    anim.crates.push({ crate, u: k / 9, x0: cx - beltLen / 2 + 0.3, len: beltLen - 0.6 });
  }
  // robot arms at work beside the course
  for (let i = 0; i < 4; i++) {
    const [x, z] = pick(1.6, 3.4);
    addRobotArm(x, z, Math.atan2(cx - x, cz - z) + Math.PI / 2 + (rnd() - 0.5), 0.9 + rnd() * 0.3);
  }
  // stacked crates, barrels and gas bottles round the hall
  for (let i = 0; i < 10; i++) {
    const [x, z] = pick(3.5, 6.8), s = 0.5 + rnd() * 0.3, turn = rnd() * 0.4;
    addCrate(x, -0.02, z, s, turn);
    if (rnd() < 0.6) addCrate(x + 0.05, s - 0.02, z, s * 0.85, turn + 0.2);
  }
  for (let i = 0; i < 6; i++) {
    const [x, z] = pick(2.5, 6.5);
    for (let k = 0; k < 3; k++) {
      const brl = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.6, 16), k % 2 ? MAT.barrelBlue : MAT.pipeRed);
      brl.position.set(x + (k % 2) * 0.42, 0.28, z + (k > 1 ? 0.4 : 0)); brl.castShadow = true;
      holeGroup.add(brl);
    }
  }
  // control desks with blinking lights
  for (let i = 0; i < 3; i++) {
    const [x, z] = pick(2.2, 3.5), turn = Math.atan2(cx - x, cz - z);
    const desk = new THREE.Group();
    desk.position.set(x, -0.02, z); desk.rotation.y = turn;
    desk.add(box(0.9, 0.8, 0.45, MAT.robotDark, 0, 0.4, 0));
    const top = box(0.9, 0.05, 0.4, MAT.plate, 0, 0.86, 0.04); top.rotation.x = 0.4; desk.add(top);
    for (let k = 0; k < 6; k++) {
      const led = new THREE.Mesh(new THREE.SphereGeometry(0.025, 8, 6), [MAT.ledRed, MAT.ledGreen, MAT.ledAmber][k % 3]);
      led.position.set(-0.3 + k * 0.12, 0.9, 0.06); desk.add(led);
      anim.leds.push({ mesh: led, rate: 1 + rnd() * 4, phase: rnd() * 6 });
    }
    desk.add(box(0.4, 0.28, 0.03, MAT.eye, 0, 1.12, -0.14));
    holeGroup.add(desk);
  }
  // light towers in the corners of the hall
  for (const [x, z] of [[X0 + 1, Z0 + 1], [X1 - 1, Z0 + 1], [X1 - 1, Z1 - 1], [X0 + 1, Z1 - 1]]) {
    holeGroup.add(box(0.12, 5, 0.12, MACH.steel, x, 2.5, z), box(0.9, 0.35, 0.3, MAT.robotDark, x, 5.1, z), box(0.8, 0.25, 0.05, MAT.glow, x, 5.1, z + (z < cz ? 0.16 : -0.16)));
  }
  // yellow safety rail round the plot, open behind the tee, and hazard stripes on the floor
  const fx0 = b.x0 - 1.2, fx1 = b.x1 + 1.2, fz0 = b.z0 - 1.2, fz1 = b.z1 + 1.2;
  const corners = [[fx0, fz0], [fx1, fz0], [fx1, fz1], [fx0, fz1]];
  for (let k = 0; k < 4; k++) {
    const [ax, az] = corners[k], [bx, bz] = corners[(k + 1) % 4];
    const len = Math.hypot(bx - ax, bz - az), ang = Math.atan2(bz - az, bx - ax), n = Math.ceil(len / 1.2);
    const stripe = new THREE.Mesh(new THREE.PlaneGeometry(len, 0.18), MAT.hazard);
    stripe.rotation.x = -Math.PI / 2; stripe.rotation.z = -ang;
    stripe.position.set((ax + bx) / 2, -0.015, (az + bz) / 2);
    holeGroup.add(stripe);
    for (let i = 0; i < n; i++) {
      const t0 = i / n, t1 = (i + 1) / n, mx = ax + (bx - ax) * (t0 + t1) / 2, mz = az + (bz - az) * (t0 + t1) / 2;
      if (Math.hypot(mx - hole.tee.x, mz - hole.tee.z) < 2.6) continue;
      const px = ax + (bx - ax) * t0, pz = az + (bz - az) * t0;
      holeGroup.add(box(0.05, 0.75, 0.05, MACH.yellow, px, 0.36, pz));
      for (const y of [0.4, 0.72]) { const rail = box(len / n + 0.02, 0.04, 0.04, MACH.yellow, mx, y, mz); rail.rotation.y = -ang; holeGroup.add(rail); }
    }
  }
  addSparks();
}

// Welding sparks from the robot arms' torches.
function addSparks() {
  const N = 240, pos = new Float32Array(N * 3).fill(-100);
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  const pts = new THREE.Points(geo, new THREE.PointsMaterial({ map: TEX.spark, color: '#ffc86a', size: 0.05, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending }));
  pts.frustumCulled = false;
  holeGroup.add(pts);
  anim.sparks = { pts, vel: new Float32Array(N * 3), life: new Float32Array(N), next: 0 };
}

// Per-frame life for the Frozen Peaks and Robot Factory scenery: falling snow, chairlift, belts, robots.
const _v = new THREE.Vector3();
function animateThemes(t, dt) {
  TEX.belt.offset.y = -((t * CONFIG.beltSpeed * 2) % 1);
  for (const f of anim.fans) f.rotation.z = t * 14;
  for (const c of anim.chairs) {
    const n = c.tops.length - 1, u = (c.u + t * 0.012) % 1, k = Math.min(n - 1, Math.floor(u * n)), f = u * n - k;
    _v.copy(c.tops[k]).lerp(c.tops[k + 1], f);
    c.chair.position.set(_v.x + c.side, _v.y, _v.z);
  }
  for (const r of anim.robots) {
    const ph = t * 0.6 + r.phase;
    r.turret.rotation.y = Math.sin(ph) * 0.9;
    r.shoulder.rotation.z = -0.55 + Math.sin(ph * 1.3) * 0.3;
    r.elbow.rotation.z = 1.25 + Math.sin(ph * 1.7) * 0.35;
    r.wrist.rotation.z = 0.6 + Math.sin(ph * 2.1) * 0.4;
  }
  for (const h of anim.heads) h.head.rotation.y = Math.sin(t * 0.8 + h.phase) * 0.8;
  for (const l of anim.leds) l.mesh.visible = Math.sin(t * l.rate + l.phase) > -0.3;
  for (const g of anim.gates) if (g.lamp) g.lamp.visible = portcullisLift(g.p, t) < 0.05 && Math.sin(t * 18) > 0;
  for (const c of anim.crates) c.crate.position.x = c.x0 + ((c.u + t * 0.03) % 1) * c.len;
  if (anim.snow) {
    const s = anim.snow, a = s.pts.geometry.attributes.position, p = a.array;
    for (let i = 0; i < s.speed.length; i++) {
      p[i * 3 + 1] -= s.speed[i] * dt;
      p[i * 3] += Math.sin(t * 0.7 + i) * 0.12 * dt;
      if (p[i * 3 + 1] < 0) p[i * 3 + 1] += 9;
    }
    a.needsUpdate = true;
  }
  if (anim.sparks && anim.robots.length) {
    const s = anim.sparks, a = s.pts.geometry.attributes.position, p = a.array, N = s.life.length;
    // each arm welds in bursts
    anim.robots.forEach((r, ri) => {
      if (Math.sin(t * 2.3 + r.phase * 3) < 0.2) return;
      r.torch.getWorldPosition(_v);
      for (let k = 0; k < 3; k++) {
        const i = s.next; s.next = (s.next + 1) % N;
        p[i * 3] = _v.x; p[i * 3 + 1] = _v.y; p[i * 3 + 2] = _v.z;
        s.vel[i * 3] = (Math.random() - 0.5) * 1.6; s.vel[i * 3 + 1] = Math.random() * 1.4; s.vel[i * 3 + 2] = (Math.random() - 0.5) * 1.6;
        s.life[i] = 0.4 + Math.random() * 0.4;
      }
    });
    for (let i = 0; i < N; i++) {
      if (s.life[i] <= 0) { p[i * 3 + 1] = -100; continue; }
      s.life[i] -= dt;
      s.vel[i * 3 + 1] -= 9.8 * dt;
      p[i * 3] += s.vel[i * 3] * dt; p[i * 3 + 1] += s.vel[i * 3 + 1] * dt; p[i * 3 + 2] += s.vel[i * 3 + 2] * dt;
      if (p[i * 3 + 1] < 0) { p[i * 3 + 1] = 0; s.vel[i * 3 + 1] *= -0.3; }
    }
    a.needsUpdate = true;
  }
  for (const c of anim.chimneys) {
    c.timer -= dt;
    if (c.timer > 0) continue;
    c.timer = 0.35;
    const puff = new THREE.Mesh(new THREE.SphereGeometry(0.12, 8, 6), MAT.smoke.clone());
    puff.position.set(c.x, c.y, c.z);
    puff.userData = { vx: 0.15 + Math.random() * 0.1, vy: 0.45 + Math.random() * 0.2, vz: (Math.random() - 0.5) * 0.1, life: 3, grow: 0.35 };
    scene.add(puff); puffs.push(puff);
  }
}

function fitSun(hole) {
  const b = holeBounds(hole);
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  const r = Math.hypot(b.x1 - b.x0, b.z1 - b.z0) / 2 + 4;
  sun.position.set(cx + 8, 16, cz + 5);
  sun.target.position.set(cx, 0, cz);
  const sc = sun.shadow.camera;
  sc.left = -r; sc.right = r; sc.top = r; sc.bottom = -r; sc.near = 1; sc.far = 50;
  sc.updateProjectionMatrix();
}

const PLAYER_COLOURS = ['#ffffff', '#ffd43b', '#ff8c42', '#ff6bd6'];
const ballMat = new THREE.MeshStandardMaterial({ color: '#ffffff', roughness: 0.3, bumpMap: TEX.dimples, bumpScale: 0.4 });
ballMat.userData.env = 0.5;
SHINY.push(ballMat);
const ballMesh = new THREE.Mesh(new THREE.SphereGeometry(CONFIG.ballR, 40, 28), ballMat);
ballMesh.castShadow = true;
scene.add(ballMesh);

const AIM_SEGS = 24;
const aimGeo = new THREE.BufferGeometry();
aimGeo.setAttribute('position', new THREE.Float32BufferAttribute(new Float32Array((AIM_SEGS + 1) * 2 * 3), 3));
const aimIdx = [];
for (let i = 0; i < AIM_SEGS; i += 2) { const a = i * 2; aimIdx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
aimGeo.setIndex(aimIdx);
const aimMesh = new THREE.Mesh(aimGeo, MAT.aim);
aimMesh.frustumCulled = false;
scene.add(aimMesh);

function updateAimLine(ball, angle, power, visible) {
  aimMesh.visible = visible;
  if (!visible) return;
  const dx = Math.cos(angle), dz = Math.sin(angle);
  const len = 0.35 + power * 1.4, w = 0.012;
  const pos = aimGeo.attributes.position.array;
  for (let i = 0; i <= AIM_SEGS; i++) {
    const t = 0.06 + (i / AIM_SEGS) * len;
    const x = ball.x + dx * t, z = ball.z + dz * t;
    const y = (groundHeight(game.hole, x, z) ?? ball.y) + 0.006;
    pos.set([x - dz * w, y, z + dx * w], i * 6);
    pos.set([x + dz * w, y, z - dx * w], i * 6 + 3);
  }
  aimGeo.attributes.position.needsUpdate = true;
}

// ============================================================
//  SOUND (Web Audio, synthesised)
// ============================================================
let actx = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { actx = null; } }
  if (actx && actx.state === 'suspended') actx.resume();
  return actx;
}
function noiseBuffer(ac, secs) {
  const b = ac.createBuffer(1, Math.floor(ac.sampleRate * secs), ac.sampleRate);
  const d = b.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return b;
}
function tone(freq, dur, type, vol, when = 0, slide = 0) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * slide), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + 0.02);
}
function noise(dur, vol, filterType, freq, when = 0, q = 1) {
  const ac = audio(); if (!ac) return;
  const t = ac.currentTime + when;
  const src = ac.createBufferSource(); src.buffer = noiseBuffer(ac, dur);
  const f = ac.createBiquadFilter(); f.type = filterType; f.frequency.value = freq; f.Q.value = q;
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(f).connect(g).connect(ac.destination); src.start(t);
}
const sfx = {
  putt: p => { noise(0.05, 0.25 + p * 0.4, 'bandpass', 2500, 0, 2); tone(320, 0.08, 'sine', 0.12 + p * 0.2, 0, 0.5); },
  wall: v => { const k = Math.min(1, v / 3); noise(0.06, 0.08 + k * 0.3, 'bandpass', 900, 0, 3); tone(170, 0.09, 'triangle', 0.06 + k * 0.2, 0, 0.7); },
  cup: () => { [0, 0.07, 0.13, 0.18].forEach((w, i) => noise(0.04, 0.25 - i * 0.04, 'bandpass', 3200 - i * 300, w, 4)); tone(140, 0.25, 'sine', 0.25, 0.2, 0.6); },
  cheer: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.25, 'triangle', 0.1, 0.25 + i * 0.09)); },
  lip: () => { noise(0.05, 0.2, 'bandpass', 3000, 0, 5); tone(600, 0.06, 'sine', 0.06, 0.02, 0.7); },
  sizzle: () => { noise(0.9, 0.35, 'highpass', 2500, 0, 0.5); noise(0.5, 0.3, 'lowpass', 300, 0, 1); },
  bounce: v => { tone(160, 0.25, 'sine', 0.12 + Math.min(0.2, v / 20), 0, 2.2); noise(0.05, 0.08, 'bandpass', 600, 0, 2); },
  splash: () => { noise(0.6, 0.45, 'lowpass', 1400, 0, 0.7); noise(0.3, 0.2, 'highpass', 3000, 0.05); },
  tunnel: () => { noise(0.9, 0.25, 'lowpass', 260, 0, 1); },
  lift: () => { for (let i = 0; i < 10; i++) noise(0.03, 0.12, 'bandpass', 1800, i * 0.16, 6); tone(90, 1.6, 'sawtooth', 0.03, 0, 1.3); },
  cannon: () => { noise(0.9, 0.7, 'lowpass', 500, 0, 0.8); tone(70, 0.6, 'sine', 0.5, 0, 0.4); noise(1.4, 0.15, 'lowpass', 180, 0.1); },
  chute: () => { noise(2.4, 0.2, 'bandpass', 500, 0, 0.8); noise(2.4, 0.08, 'highpass', 4000, 0.1, 0.5); tone(220, 0.4, 'sine', 0.05, 0, 0.5); },
  loop: () => { noise(0.7, 0.18, 'bandpass', 700, 0, 1.5); tone(300, 0.6, 'sine', 0.05, 0, 2); },
  post: v => { const k = Math.min(1, v / 3); tone(420, 0.18, 'sine', 0.12 + k * 0.15, 0, 1.8); noise(0.05, 0.12 + k * 0.2, 'bandpass', 1500, 0, 3); },
};

// ============================================================
//  GAME STATE
// ============================================================
const game = {
  screen: 'menu', theme: THEMES[0], roundLen: 15, players: [],
  holeList: [], holeN: 0, hole: null, def: null, cur: 0, strokes: 0,
  ball: null, phase: 'aim', aim: 0, power: 0, lastPos: null, simT: 0, acc: 0,
  overview: false, timer: 0, after: null,
};

const $ = id => document.getElementById(id);
const hud = $('hud'), cardEl = $('card'), menuEl = $('menu');

function banner(big, small, secs = 1.8) {
  const b = $('banner');
  b.querySelector('.big').textContent = big;
  b.querySelector('.small').textContent = small || '';
  b.style.opacity = 1;
  clearTimeout(banner.t);
  banner.t = setTimeout(() => { b.style.opacity = 0; }, secs * 1000);
}

function scoreName(strokes, par) {
  if (strokes === 1) return 'Hole in one!';
  const d = strokes - par;
  return { '-3': 'Albatross!', '-2': 'Eagle!', '-1': 'Birdie!', '0': 'Par', '1': 'Bogey', '2': 'Double bogey' }[d] || `+${d}`;
}

function startRound() {
  const course = game.theme.course;
  game.holeList = game.roundLen === 10 ? course.shortRound.slice() : course.holes.map((_, i) => i);
  game.holeN = 0;
  game.players.forEach(p => { p.scores = []; });
  menuEl.classList.add('hidden');
  cardEl.classList.add('hidden');
  hud.classList.remove('hidden');
  game.screen = 'play';
  audio();
  loadHole();
}

function loadHole() {
  const idx = game.holeList[game.holeN];
  game.def = game.theme.course.holes[idx];
  game.hole = parseHole(game.def);
  buildHole(game.hole, game.theme.course.style);
  game.cur = 0;
  game.overview = false;
  $('btnView').classList.remove('on');
  game.field = distanceField(game.hole);
  const info = $('holeInfo');
  info.querySelector('.num').textContent = `Hole ${game.holeN + 1} of ${game.holeList.length} · ${game.theme.name}`;
  info.querySelector('.name').textContent = game.def.name;
  info.querySelector('.par').textContent = `Par ${game.def.par}`;
  startTurn(true);
}

function startTurn(firstOfHole) {
  const h = game.hole;
  game.strokes = 0;
  game.ball = createBall(h.tee);
  game.lastPos = { x: h.tee.x, y: h.tee.y, z: h.tee.z };
  ballMat.color.set(PLAYER_COLOURS[game.cur]).convertSRGBToLinear();
  ballMesh.visible = true;
  game.aim = aimTowardPath(h.tee);
  game.power = 0;
  game.phase = 'aim';
  snapCamera();
  const p = game.players[game.cur];
  if (firstOfHole) banner(`Hole ${game.holeN + 1}`, `${game.def.name} · Par ${game.def.par}${game.players.length > 1 ? ` · ${p.name} first` : ''}`, 2.2);
  else banner(`${p.name}'s turn`, `Hole ${game.holeN + 1} · Par ${game.def.par}`, 1.6);
  renderPlayers();
}

// Face down the course: follow the distance field a couple of metres from the ball.
function aimTowardPath(pos) {
  const h = game.hole, f = game.field;
  let cell = cellAt(h, pos.x, pos.z);
  for (let k = 0; k < 5; k++) {
    let best = null;
    for (const [dr, dc] of [[0, 1], [1, 0], [0, -1], [-1, 0]]) {
      const n = cellOf(h, cell.r + dr, cell.c + dc);
      if (n && f[n.r * h.cols + n.c] < f[(best || cell).r * h.cols + (best || cell).c]) best = n;
    }
    if (!best) break;
    cell = best;
  }
  const tx = (cell.c + 0.5) * C, tz = (cell.r + 0.5) * C;
  if (Math.hypot(tx - pos.x, tz - pos.z) < 0.01) return Math.atan2(h.cup.z - pos.z, h.cup.x - pos.x);
  return Math.atan2(tz - pos.z, tx - pos.x);
}

function renderPlayers() {
  $('players').innerHTML = game.players.map((p, i) => {
    const total = p.scores.reduce((a, b) => a + b, 0);
    const live = i === game.cur && game.screen === 'play' ? ` · ${game.strokes}` : '';
    return `<div class="chip ${i === game.cur ? 'on' : ''}"><span class="dot" style="background:${PLAYER_COLOURS[i]}"></span>${escapeHtml(p.name)}<span class="s">${total}${live}</span></div>`;
  }).join('');
}

function escapeHtml(s) { return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch])); }

function putt() {
  if (game.phase !== 'aim' || game.overview || game.power < 0.02) return;
  game.lastPos = { x: game.ball.x, y: game.ball.y, z: game.ball.z };
  shoot(game.ball, game.aim, game.power);
  sfx.putt(game.power);
  game.strokes++;
  game.phase = 'rolling';
  game.power = 0;
  renderPlayers();
}

function finishPlayer(score, label) {
  game.players[game.cur].scores[game.holeN] = score;
  game.phase = 'done';
  renderPlayers();
  later(label === 'cap' ? 1.6 : 2.0, () => {
    if (game.cur < game.players.length - 1) { game.cur++; startTurn(false); }
    else showHoleCard();
  });
}

function later(secs, fn) { game.timer = secs; game.after = fn; }

function handleEvents(events) {
  const b = game.ball;
  for (const ev of events) {
    const sp = Math.hypot(b.vx, b.vz);
    if (ev === 'wall') { if (sp > 0.15) sfx.wall(sp); }
    else if (ev === 'lip') sfx.lip();
    else if (ev === 'post') sfx.post(sp);
    else if (ev === 'tunnel') sfx.tunnel();
    else if (ev === 'lift') sfx.lift();
    else if (ev === 'chute') sfx.chute();
    else if (ev === 'loop') sfx.loop();
    else if (ev === 'cannon') { sfx.cannon(); const cn = game.hole.cannons.find(c => Math.hypot(c.a.x - b.x, c.a.z - b.z) < 0.6) || game.hole.cannons[0]; cannonSmoke(cn); }
    else if (ev === 'holed') {
      sfx.cup();
      const name = scoreName(game.strokes, game.def.par);
      if (game.strokes <= game.def.par) sfx.cheer();
      banner(name, `${game.players[game.cur].name} · ${game.strokes} stroke${game.strokes === 1 ? '' : 's'}`);
      finishPlayer(game.strokes, 'holed');
      return;
    } else if (ev === 'bounce') sfx.bounce(Math.abs(b.vy));
    else if (ev === 'water' || ev === 'lava' || ev === 'out') {
      if (ev === 'lava') sfx.sizzle(); else sfx.splash();
      game.strokes++;
      game.phase = 'penalty';
      ballMesh.visible = ev === 'out';
      if (game.strokes >= CONFIG.maxStrokes) {
        banner({ water: 'Splash!', lava: 'Lava!' }[ev] || 'Out!', `Stroke limit — scores ${CONFIG.maxStrokes + 1}`);
        finishPlayer(cappedScore(game.strokes, false), 'cap');
        return;
      }
      banner({ water: 'Splash!', lava: 'Lava! Too hot!' }[ev] || 'Out of bounds', '+1 stroke — back to where you hit from', 1.5);
      renderPlayers();
      later(1.4, () => {
        game.ball = createBall(game.lastPos);
        ballMesh.visible = true;
        game.phase = 'aim';
        game.aim = aimTowardPath(game.ball);
        snapCamera();
      });
      return;
    } else if (ev === 'stopped') {
      if (game.strokes >= CONFIG.maxStrokes) {
        banner('Stroke limit', `${game.players[game.cur].name} scores ${CONFIG.maxStrokes + 1}`);
        finishPlayer(cappedScore(game.strokes, false), 'cap');
        return;
      }
      game.phase = 'aim';
      game.aim = aimTowardPath(game.ball);
      return;
    }
  }
}

// ============================================================
//  SCORECARDS
// ============================================================
function scoreTable(upto) {
  const holes = game.holeList.slice(0, upto);
  const pars = holes.map(i => game.theme.course.holes[i].par);
  const parTot = pars.reduce((a, b) => a + b, 0);
  let html = '<table><tr><th>Hole</th>' + holes.map((_, i) => `<th>${i + 1}</th>`).join('') + '<th>Total</th><th>±</th></tr>';
  html += '<tr class="par"><td>Par</td>' + pars.map(p => `<td>${p}</td>`).join('') + `<td class="tot">${parTot}</td><td></td></tr>`;
  for (const [i, p] of game.players.entries()) {
    const sc = p.scores.slice(0, upto);
    const tot = sc.reduce((a, b) => a + b, 0), d = tot - parTot;
    html += `<tr><td><span class="dot" style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${PLAYER_COLOURS[i]};border:1px solid #0003;margin-right:6px"></span>${escapeHtml(p.name)}</td>`
      + sc.map((s, k) => `<td class="${s < pars[k] ? 'under' : s > pars[k] ? 'over' : ''}">${s}</td>`).join('')
      + `<td class="tot">${tot}</td><td class="${d < 0 ? 'under' : d > 0 ? 'over' : ''}">${d === 0 ? 'E' : d > 0 ? '+' + d : d}</td></tr>`;
  }
  return html + '</table>';
}

function showHoleCard() {
  game.screen = 'card';
  const last = game.holeN === game.holeList.length - 1;
  if (last) return showFinal();
  cardEl.querySelector('.box').innerHTML = `<h3>Hole ${game.holeN + 1} done</h3><div class="sub">${escapeHtml(game.def.name)} · Par ${game.def.par}</div>${scoreTable(game.holeN + 1)}
    <div class="actions"><button id="next">Next hole →</button></div>`;
  cardEl.classList.remove('hidden');
  $('next').onclick = () => { cardEl.classList.add('hidden'); game.holeN++; game.screen = 'play'; loadHole(); };
}

function showFinal() {
  const totals = game.players.map(p => p.scores.reduce((a, b) => a + b, 0));
  const best = Math.min(...totals);
  const winners = game.players.filter((_, i) => totals[i] === best).map(p => p.name);
  const title = game.players.length === 1 ? `Round complete — ${best} strokes` : winners.length > 1 ? `It's a tie! ${winners.join(' & ')}` : `${winners[0]} wins!`;
  cardEl.querySelector('.box').innerHTML = `<h3>${escapeHtml(title)}</h3><div class="sub">${escapeHtml(game.theme.name)} · ${game.holeList.length} holes</div>${scoreTable(game.holeList.length)}
    <div class="actions"><button id="again">Play again</button><button id="toMenu" class="alt">Menu</button></div>`;
  cardEl.classList.remove('hidden');
  $('again').onclick = startRound;
  $('toMenu').onclick = showMenu;
}

function showMenu() {

$('play').onclick = () => {
  try { localStorage.setItem('minigolf-menu', JSON.stringify(menuState)); } catch (e) { /* private mode */ }
  game.theme = THEMES.find(t => t.id === menuState.theme && t.course) || THEMES[0];
  game.roundLen = menuState.len;

};
$('btnMenu').onclick = showMenu;
$('btnView').onclick = () => toggleOverview();

function toggleOverview() {
  if (game.screen !== 'play') return;
  game.overview = !game.overview;
  $('btnView').classList.toggle('on', game.overview);
}

//  INPUT
// ============================================================
const drag = { active: false, id: null, sx: 0, sy: 0, startAim: 0 };
canvas.addEventListener('pointerdown', e => {
  if (game.screen !== 'play' || game.phase !== 'aim' || game.overview) return;
  audio();
  drag.active = true; drag.id = e.pointerId; drag.sx = e.clientX; drag.sy = e.clientY; drag.startAim = game.aim;
  canvas.setPointerCapture(e.pointerId);
  canvas.style.cursor = 'grabbing';
});
canvas.addEventListener('pointermove', e => {
  if (!drag.active || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  game.aim = drag.startAim + dx * 0.004;
  game.power = Math.min(1, Math.max(0, dy / (window.innerHeight * 0.38)));
});
function endDrag(e, cancel) {
  if (!drag.active || e.pointerId !== drag.id) return;
  drag.active = false;
  canvas.style.cursor = 'grab';
  if (!cancel) putt(); else game.power = 0;
}
canvas.addEventListener('pointerup', e => endDrag(e, false));
canvas.addEventListener('pointercancel', e => endDrag(e, true));

const keys = {};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  keys[e.code] = true;
  if (game.screen !== 'play') return;
  if (e.code === 'Space') { e.preventDefault(); putt(); }
  if (e.code === 'KeyV') toggleOverview();
  if (e.code.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

function keyboardAim(dt) {
  if (game.phase !== 'aim' || drag.active) return;
  const fine = keys.ShiftLeft || keys.ShiftRight ? 0.25 : 1;
  if (keys.ArrowLeft || keys.KeyA) game.aim -= 1.2 * fine * dt;
  if (keys.ArrowRight || keys.KeyD) game.aim += 1.2 * fine * dt;
  if (keys.ArrowUp || keys.KeyW) game.power = Math.min(1, game.power + 0.6 * fine * dt);
  if (keys.ArrowDown || keys.KeyS) game.power = Math.max(0, game.power - 0.6 * fine * dt);
}

// ============================================================
//  CAMERA
// ============================================================
const camPos = new THREE.Vector3(), camLook = new THREE.Vector3();
let followDir = 0;

function cameraTarget(out) {
  const b = game.ball, h = game.hole;
  if (game.overview) {
    const bd = holeBounds(h), cx = (bd.x0 + bd.x1) / 2, cz = (bd.z0 + bd.z1) / 2;
    const span = Math.max(bd.x1 - bd.x0, bd.z1 - bd.z0);
    out.pos.set(cx, span * 0.95 + 1.5, cz + span * 0.35 + 1);
    out.look.set(cx, 0, cz);
    return;
  }
  let dir = game.aim, dist = 2.1, height = 1.0, ahead = 1.4;
  if (game.phase !== 'aim') {
    const sp = Math.hypot(b.vx, b.vz);
    if (sp > 0.25) followDir = Math.atan2(b.vz, b.vx);
    dir = followDir; dist = 2.4; height = 1.25; ahead = 0.8;
  } else followDir = dir;
  let tx = b.x, ty = b.y, tz = b.z;
  const tr = b.transport;
  if (tr && tr.kind === 'loop') {
    // watch a loop from the side so its circle reads clearly
    const lp = h.loops.reduce((best, l) => (Math.hypot(l.M.x - b.x, l.M.z - b.z) < Math.hypot(best.M.x - b.x, best.M.z - b.z) ? l : best));
    out.pos.set(lp.M.x - lp.d[1] * 1.5, lp.M.y + 0.55, lp.M.z + lp.d[0] * 1.5);
    out.look.set(lp.M.x, lp.M.y + lp.radius, lp.M.z);
    return;
  }
  if (tr && tr.kind === 'chute') {
    // follow the ball down the chute from above and behind, facing the way the track is heading
    const p0 = transportPos(tr), p1 = transportPos({ ...tr, t: tr.t + 0.9 });
    if (Math.hypot(p1.x - p0.x, p1.z - p0.z) > 0.05) followDir = Math.atan2(p1.z - p0.z, p1.x - p0.x);
    const cdx = Math.cos(followDir), cdz = Math.sin(followDir);
    out.pos.set(b.x - cdx * 2.1, b.y + 1.25, b.z - cdz * 2.1);
    out.look.set(b.x + cdx * 0.9, b.y, b.z + cdz * 0.9);
    return;
  }
  if (tr) {
    // ride along with a visible machine; for a hidden tunnel, wait at the exit
    dir = followDir = Math.atan2(tr.exit.vz, tr.exit.vx);
    if (tr.visible) { dist = 2.6; height = 1.1; ahead = 0; }
    else { tx = tr.exit.x; tz = tr.exit.z; ty = groundHeight(h, tx, tz) || 0; }
  }
  const dx = Math.cos(dir), dz = Math.sin(dir);
  out.pos.set(tx - dx * dist, ty + height, tz - dz * dist);
  out.look.set(tx + dx * ahead, ty, tz + dz * ahead);
}
const camT = { pos: new THREE.Vector3(), look: new THREE.Vector3() };
function snapCamera() { cameraTarget(camT); camPos.copy(camT.pos); camLook.copy(camT.look); }

function updateCamera(dt) {
  cameraTarget(camT);
  const k = 1 - Math.exp(-dt * (game.overview ? 3 : game.phase === 'aim' ? 10 : 4));
  camPos.lerp(camT.pos, k);
  camLook.lerp(camT.look, k);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
}

// ============================================================
//  MAIN LOOP
// ============================================================
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;

  if (game.screen === 'play' || game.screen === 'card') {
    keyboardAim(dt);
    game.acc += dt;
    while (game.acc >= CONFIG.dt) {
      game.acc -= CONFIG.dt;
      if (game.phase === 'rolling') handleEvents(stepBall(game.hole, game.ball, game.simT, CONFIG.dt));
      game.simT += CONFIG.dt;
    }
    if (game.after && (game.timer -= dt) <= 0) { const fn = game.after; game.after = null; fn(); }

    const b = game.ball;
    if (b) {
      ballMesh.position.set(b.x, b.y + CONFIG.ballR, b.z);
      if (b.transport) ballMesh.visible = b.transport.visible;
      else if (game.phase === 'rolling' || game.phase === 'aim') ballMesh.visible = true;
      const sp = Math.hypot(b.vx, b.vz);
      if (sp > 0) ballMesh.rotateOnWorldAxis(new THREE.Vector3(b.vz, 0, -b.vx).normalize(), (sp * dt) / CONFIG.ballR);
      updateAimLine(b, game.aim, game.power, game.phase === 'aim' && !game.overview);
    }
    animateMachines(game.simT);
    if (anim.flag) anim.flag.rotation.y = Math.sin(now / 700) * 0.35;
    TEX.water.offset.set(now / 30000, now / 45000);
    TEX.lagoon.offset.set(now / 26000, now / 40000);
    TEX.sea.offset.set(now / 60000, now / 90000);
    for (const [i, f] of anim.flags.entries()) f.rotation.y = (f.userData.baseY ??= f.rotation.y) + Math.sin(now / 500 + i) * 0.25;
    if (anim.ship) { anim.ship.rotation.z = Math.sin(now / 1800) * 0.03; anim.ship.position.y = -0.1 + Math.sin(now / 1300) * 0.05; }
    updateSmoke(dt);
    TEX.lava.offset.set(now / 70000, now / 50000);
    for (const v of anim.volcanoes) {
      v.timer -= dt;
      if (v.timer <= 0) { emitAsh(v); v.timer = v.size > 1 ? 0.25 : 0.5; }
      if (v.glow) v.glow.intensity = 1.0 + Math.sin(now / 230) * 0.25 + Math.random() * 0.15;
    }
    for (const fl of anim.flames) { const k = 0.85 + Math.random() * 0.3; fl.scale.set(k, 0.8 + Math.random() * 0.5, k); }
    animateThemes(game.simT, dt);

    $('power').querySelector('.fill').style.height = `${Math.round(game.power * 100)}%`;
    const hint = game.overview ? 'Overview — press Overview (V) to return'
      : game.phase === 'aim' ? 'Drag down for power, sideways to aim — release to putt · ←→ aim ↑↓ power Space putt'
      : game.phase === 'rolling' ? `${game.players[game.cur].name} · stroke ${game.strokes}` : '';
    const hintEl = $('hint');
    if (hintEl.textContent !== hint) hintEl.textContent = hint;
    hintEl.style.visibility = hint ? 'visible' : 'hidden';
    updateCamera(dt);
  } else {
    // menu backdrop: slow orbit over the first hole
    const t = now / 1000;
    if (game.hole) {
      const bd = holeBounds(game.hole), cx = (bd.x0 + bd.x1) / 2, cz = (bd.z0 + bd.z1) / 2;
      camera.position.set(cx + Math.cos(t * 0.1) * 9, 4.5, cz + Math.sin(t * 0.1) * 9);
      camera.lookAt(cx, 0, cz);
      animateMachines(t);
    }
  }
  renderer.render(scene, camera);
}

// Menu backdrop hole
game.def = SUNNY_PARK.holes[3];
game.hole = parseHole(game.def);
buildHole(game.hole);
ballMesh.visible = false;
aimMesh.visible = false;
renderMenu();
requestAnimationFrame(frame);
</script>
</body>
</html>
