<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mini Golf 3D</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #cfe8ff; font-family: 'Segoe UI', system-ui, sans-serif; color: #17301c; }
  canvas#view { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
  .hidden { display: none !important; }
  button { font: inherit; cursor: pointer; }

  /* ---- Menu ---- */
  #menu { position: fixed; inset: 0; overflow-y: auto; background: linear-gradient(160deg, rgba(40,110,60,.92), rgba(20,60,40,.95)); color: #fff; padding: 24px 16px 40px; }
  #menu .wrap { max-width: 880px; margin: 0 auto; }
  #menu .back { color: #d6f5dc; text-decoration: none; font-size: 14px; opacity: .85; }
  #menu h1 { font-size: clamp(36px, 7vw, 64px); font-weight: 900; letter-spacing: 1px; margin: 10px 0 2px; text-shadow: 0 4px 0 #0b3b1b; }
  #menu h1 span { color: #ffd43b; }
  #menu .tag { opacity: .85; margin-bottom: 22px; }
  #menu h2 { font-size: 15px; text-transform: uppercase; letter-spacing: 2px; color: #bfeccb; margin: 22px 0 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .pill { background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.25); color: #fff; border-radius: 999px; padding: 8px 18px; font-weight: 700; }
  .pill.on { background: #ffd43b; border-color: #ffd43b; color: #263a12; }
  .names { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; margin-top: 12px; }
  .names label { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.18); border-radius: 12px; padding: 6px 10px; }
  .names .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; box-shadow: inset 0 -2px 0 rgba(0,0,0,.25); }
  .names input { width: 100%; min-width: 0; background: transparent; border: 0; color: #fff; font: inherit; font-weight: 600; outline: none; }
  .themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .theme { position: relative; text-align: left; border-radius: 16px; padding: 16px; min-height: 96px; border: 3px solid transparent; background: rgba(255,255,255,.1); color: #fff; }
  .theme .sw { position: absolute; right: 14px; top: 14px; width: 34px; height: 34px; border-radius: 10px; }
  .theme b { display: block; font-size: 18px; margin-bottom: 4px; padding-right: 44px; }
  .theme small { opacity: .8; }
  .theme.on { border-color: #ffd43b; background: rgba(255,212,59,.15); }
  .theme:disabled { opacity: .45; cursor: not-allowed; }
  .theme .soon { display: inline-block; margin-top: 8px; font-size: 11px; font-weight: 800; letter-spacing: 1px; background: rgba(0,0,0,.3); border-radius: 6px; padding: 2px 6px; }
  #play { margin-top: 28px; background: #ffd43b; color: #263a12; border: 0; border-radius: 16px; padding: 16px 48px; font-size: 22px; font-weight: 900; box-shadow: 0 6px 0 #b8901a; }
  #play:active { transform: translateY(3px); box-shadow: 0 3px 0 #b8901a; }

  /* ---- HUD ---- */
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { background: rgba(255,255,255,.88); border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
  #holeInfo { position: absolute; left: 12px; top: 12px; padding: 10px 14px; }
  #holeInfo .num { font-size: 13px; font-weight: 800; color: #3a7a45; letter-spacing: 1px; text-transform: uppercase; }
  #holeInfo .name { font-size: 20px; font-weight: 900; }
  #holeInfo .par { font-size: 14px; opacity: .75; }
  #players { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; }
  .chip { display: flex; align-items: center; gap: 6px; padding: 6px 10px; border-radius: 10px; font-weight: 700; font-size: 14px; white-space: nowrap; }
  .chip.on { background: #17301c; color: #fff; }
  .chip .dot { width: 12px; height: 12px; border-radius: 50%; }
  .chip .s { font-variant-numeric: tabular-nums; opacity: .8; }
  #buttons { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; pointer-events: auto; }
  #buttons button { border: 0; padding: 10px 14px; font-weight: 800; }
  #buttons button.on { background: #ffd43b; }
  #power { position: absolute; left: 16px; bottom: 16px; width: 26px; height: 180px; padding: 4px; display: flex; align-items: flex-end; }
  #power .fill { width: 100%; border-radius: 8px; background: linear-gradient(0deg, #3fbf5a, #ffd43b 60%, #ff5b3a); height: 0%; }
  #hint { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px; font-size: 14px; font-weight: 600; text-align: center; max-width: calc(100% - 100px); }
  #banner { position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%); text-align: center; color: #fff; text-shadow: 0 3px 12px rgba(0,0,0,.45), 0 2px 0 rgba(0,0,0,.35); transition: opacity .35s; }
  #banner .big { font-size: clamp(34px, 7vw, 64px); font-weight: 900; }
  #banner .small { font-size: clamp(16px, 3vw, 22px); font-weight: 700; }

  /* ---- Scorecard ---- */
  #card { position: fixed; inset: 0; background: rgba(10,30,15,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
  #card .box { background: #fffdf4; border-radius: 18px; padding: 20px; max-width: 100%; max-height: 100%; overflow: auto; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
  #card h3 { font-size: 24px; font-weight: 900; margin-bottom: 4px; }
  #card .sub { opacity: .7; margin-bottom: 14px; }
  #card table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #card th, #card td { padding: 6px 8px; text-align: center; border-bottom: 1px solid #e3e0cf; font-size: 14px; }
  #card th:first-child, #card td:first-child { text-align: left; font-weight: 800; white-space: nowrap; }
  #card tr.par td { color: #6b7a5a; font-style: italic; }
  #card td.tot { font-weight: 900; background: #f1f6e6; }
  #card .under { color: #1f8a3c; font-weight: 800; }
  #card .over { color: #b8402a; }
  #card .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  #card .actions button { border: 0; border-radius: 12px; padding: 12px 22px; font-weight: 900; font-size: 16px; background: #2f8f3a; color: #fff; }
  #card .actions button.alt { background: #e6e2cf; color: #17301c; }

  @media (max-width: 600px) {
    #holeInfo .name { font-size: 16px; }
    #players { top: auto; bottom: 60px; }
    #hint { font-size: 12px; }
    #power { height: 130px; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="hud" class="hidden">
  <div id="holeInfo" class="panel"><div class="num"></div><div class="name"></div><div class="par"></div></div>
  <div id="players" class="panel"></div>
  <div id="buttons"><button id="btnView" class="panel" title="Overview (V)">Overview</button><button id="btnMenu" class="panel">Menu</button></div>
  <div id="power" class="panel"><div class="fill"></div></div>
  <div id="hint" class="panel"></div>
  <div id="banner"><div class="big"></div><div class="small"></div></div>
</div>

<div id="card" class="hidden"><div class="box"></div></div>

<div id="menu">
  <div class="wrap">
    <a class="back" href="../index.html">← All games</a>
    <h1>Mini Golf <span>3D</span></h1>
    <p class="tag">A real adventure golf park — pick a course, grab your friends, sink some putts.</p>
    <h2>Players</h2>
    <div class="row" id="countRow"></div>
    <div class="names" id="names"></div>
    <h2>Course</h2>
    <div class="themes" id="themes"></div>
    <h2>Round</h2>
    <div class="row" id="lenRow"></div>
    <button id="play">Play ⛳</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ==== PURE BEGIN ====
// Everything between the PURE markers is plain JS (no THREE, no DOM) so tests/pure-minigolf.mjs
// can load it in Node. Units: metres and seconds. Holes are ASCII grids of CELL-sized squares,
// x = column, z = row, y = up.

const CONFIG = {
  cell: 0.5,            // grid cell size
  levelStep: 0.25,      // height of one level digit
  wallHeight: 0.1,      // border height above the green
  waterDepth: 0.05,     // water surface sits this far below its level
  ballR: 0.02135,       // regulation ball
  cupR: 0.054,          // regulation cup
  gravity: 9.81,
  rollK: 5 / 7,         // rolling-sphere factor on slope acceleration
  rollDecel: 0.65,      // carpet rolling resistance, m/s²
  sandDecel: 3.2,       // sand drags the ball to a stop
  plankWidth: 0.28,     // a ship's plank is narrower than a cell; roll off it and you're in the sea
  trampoline: 0.9,      // a trampoline pad sends a falling ball back up with this much of its speed
  maxSpeed: 5.5,        // full-power putt
  stopSpeed: 0.02,
  captureSpeed: 1.4,    // crosses the cup slower than this → holed
  lipSpeed: 2.2,        // between capture and this → lips out; faster skims over
  restitution: 0.7,     // wall bounce, normal component
  wallTangent: 0.95,    // wall bounce, tangential component
  landing: 0.8,         // horizontal speed kept when landing from a drop
  dropTolerance: 0.01,  // ground falling away faster than this → airborne
  tunnelExitMin: 0.9,
  maxStrokes: 6,        // not holed after this many → hole scores maxStrokes + 1
  dt: 1 / 120,
};

const RAMP_DIRS = { '^': [0, -1], 'v': [0, 1], '>': [1, 0], '<': [-1, 0] };
const OUT_DIRS = { n: [0, -1], s: [0, 1], e: [1, 0], w: [-1, 0] };

function isCourseChar(ch) { return ch !== undefined && ch !== '.' && ch !== ' '; }

function parseHole(def) {
  const C = CONFIG.cell;
  const rows = def.map.length;
  const cols = Math.max(...def.map.map(r => r.length));
  const hole = {
    name: def.name, par: def.par, rows, cols, cells: [], tee: null, cup: null,
    hills: [], windmills: [], tunnels: [], lifts: [], loops: [], cannons: [], ship: null, volcano: null, sliders: [], pendulums: [], posts: [],
    extraSegs: [], segments: [], cellSegs: [],
  };
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const ch = def.map[r][c] || '.';
      const lvChar = def.levels && def.levels[r] ? def.levels[r][c] : '0';
      const level = /[0-9]/.test(lvChar || '') ? +lvChar : 0;
      hole.cells[r * cols + c] = { ch, level, r, c, ramp: null };
      hole.cellSegs[r * cols + c] = [];
      const centre = { x: (c + 0.5) * C, z: (r + 0.5) * C };
      if (ch === '@') { if (hole.tee) throw new Error(`${def.name}: two tees`); hole.tee = centre; }
      if (ch === 'o') { if (hole.cup) throw new Error(`${def.name}: two cups`); hole.cup = centre; }
    }
  }
  if (!hole.tee || !hole.cup) throw new Error(`${def.name}: needs one tee (@) and one cup (o)`);

  computeRamps(hole);
  // a plank runs along whichever axis has dry footing at an end
  for (const cell of hole.cells) {
    if (cell.ch !== 'p') continue;
    const dry = n => n && isCourseChar(n.ch) && n.ch !== 'w';
    cell.plankAxis = dry(cellOf(hole, cell.r - 1, cell.c)) || dry(cellOf(hole, cell.r + 1, cell.c)) ? 'z' : 'x';
  }

  const mouth = m => ({ c: m.c, r: m.r, x: (m.c + 0.5) * C, z: (m.r + 0.5) * C, out: OUT_DIRS[m.out] });
  const lane = e => ({ x: e.c * C, z: e.r * C, axis: e.axis, halfWidth: e.halfWidth, period: e.period, phase: e.phase || 0 });
  for (const e of def.extras || []) {
    if (e.type === 'hill') hole.hills.push({ x: e.c * C, z: e.r * C, rad: e.rad * C, h: e.h });
    else if (e.type === 'bumper') hole.extraSegs.push(seg(e.a[0] * C, e.a[1] * C, e.b[0] * C, e.b[1] * C, 10, 'bumper'));
    else if (e.type === 'windmill') addWindmill(hole, e);
    else if (e.type === 'tunnel') hole.tunnels.push({ a: mouth(e.a), b: mouth(e.b), length: e.length });
    else if (e.type === 'lift') hole.lifts.push({ a: mouth(e.in), b: mouth(e.out), exitSpeed: e.exitSpeed || 1.1 });
    else if (e.type === 'loop') {
      const d = OUT_DIRS[e.dir];
      const at = k => mouth({ c: e.c + d[0] * k, r: e.r + d[1] * k, out: e.dir });
      hole.loops.push({ d, E: at(0), M: at(1), X: at(2), radius: e.radius || 0.25 });
    } else if (e.type === 'slider') hole.sliders.push({ ...lane(e), gap: e.gap || 0.42, period: e.period || 3 });
    else if (e.type === 'pendulum') hole.pendulums.push({ ...lane(e), length: e.length || 0.8, amp: e.amp || 0.95, period: e.period || 2.6, bobR: 0.11 });
    else if (e.type === 'post') hole.posts.push({ x: e.c * C, z: e.r * C, rad: e.rad || 0.06 });
    else if (e.type === 'cannon') hole.cannons.push({ a: mouth(e.in), target: { c: e.target.c, r: e.target.r, x: (e.target.c + 0.5) * C, z: (e.target.r + 0.5) * C }, apex: e.apex || 1, landSpeed: e.landSpeed || 1 });
    else if (e.type === 'ship') hole.ship = { bow: e.bow };
    else if (e.type === 'volcano') hole.volcano = { x: e.c * C, z: e.r * C, height: e.height, radius: e.radius };
    else throw new Error(`${def.name}: unknown extra ${e.type}`);
  }

  hole.cup.y = groundHeight(hole, hole.cup.x, hole.cup.z);
  hole.tee.y = groundHeight(hole, hole.tee.x, hole.tee.z);
  for (const o of [...hole.sliders, ...hole.pendulums]) o.y = groundHeight(hole, o.x + 1e-3, o.z + 1e-3) ?? 0;
  for (const lp of hole.loops) for (const k of ['E', 'M', 'X']) lp[k].y = groundHeight(hole, lp[k].x, lp[k].z);
  for (const m of [...hole.tunnels, ...hole.lifts].flatMap(t => [t.a, t.b])) m.y = groundHeight(hole, m.x, m.z);
  for (const cn of hole.cannons) { cn.a.y = groundHeight(hole, cn.a.x, cn.a.z); cn.target.y = groundHeight(hole, cn.target.x, cn.target.z); }
  buildWalls(hole);
  return hole;
}

function cellOf(hole, r, c) {
  if (r < 0 || c < 0 || r >= hole.rows || c >= hole.cols) return null;
  return hole.cells[r * hole.cols + c];
}

function cellAt(hole, x, z) {
  return cellOf(hole, Math.floor(z / CONFIG.cell), Math.floor(x / CONFIG.cell));
}

// A run of same-direction ramp cells climbs linearly from the cell before the run to the cell after it.
function computeRamps(hole) {
  for (const cell of hole.cells) {
    const d = RAMP_DIRS[cell.ch];
    if (!d) continue;
    let back = 0, fwd = 0;
    while (cellOf(hole, cell.r - d[1] * (back + 1), cell.c - d[0] * (back + 1))?.ch === cell.ch) back++;
    while (cellOf(hole, cell.r + d[1] * (fwd + 1), cell.c + d[0] * (fwd + 1))?.ch === cell.ch) fwd++;
    const low = cellOf(hole, cell.r - d[1] * (back + 1), cell.c - d[0] * (back + 1));
    const high = cellOf(hole, cell.r + d[1] * (fwd + 1), cell.c + d[0] * (fwd + 1));
    const own = cell.level * CONFIG.levelStep;
    cell.ramp = {
      dx: d[0], dz: d[1], idx: back, n: back + fwd + 1,
      lowH: low && isCourseChar(low.ch) ? low.level * CONFIG.levelStep : own,
      highH: high && isCourseChar(high.ch) ? high.level * CONFIG.levelStep : own,
    };
  }
}

// Height of the cell's own surface at (x, z), ignoring hills.
function baseHeight(cell, x, z) {
  const C = CONFIG.cell;
  if (cell.ramp) {
    const fx = x / C - cell.c, fz = z / C - cell.r;
    const { dx, dz, idx, n, lowH, highH } = cell.ramp;
    const s = dx === 1 ? fx : dx === -1 ? 1 - fx : dz === 1 ? fz : 1 - fz;
    return lowH + (highH - lowH) * (idx + s) / n;
  }
  if (cell.ch === 'w' || cell.ch === 'L') return cell.level * CONFIG.levelStep - CONFIG.waterDepth;
  if (offPlank(cell, x, z)) return -CONFIG.waterDepth; // the sea under a plank is at ground level
  return cell.level * CONFIG.levelStep;
}

function offPlank(cell, x, z) {
  if (cell.ch !== 'p') return false;
  const C = CONFIG.cell;
  const across = cell.plankAxis === 'z' ? x - (cell.c + 0.5) * C : z - (cell.r + 0.5) * C;
  return Math.abs(across) > CONFIG.plankWidth / 2;
}

// Water and lava are both hazards the ball sinks into.
function isWet(cell, x, z) { return cell.ch === 'w' || cell.ch === 'L' || offPlank(cell, x, z); }
const isHazardChar = ch => ch === 'w' || ch === 'L';

function surfaceDecel(cell) { return cell && cell.ch === 's' ? CONFIG.sandDecel : CONFIG.rollDecel; }

function hillHeight(hole, x, z) {
  let h = 0;
  for (const hl of hole.hills) {
    const d2 = (x - hl.x) ** 2 + (z - hl.z) ** 2;
    h += hl.h * Math.exp(-d2 / (hl.rad * hl.rad));
  }
  return h;
}

// Surface height under (x, z), or null off the course.
function groundHeight(hole, x, z) {
  const cell = cellAt(hole, x, z);
  if (!cell || !isCourseChar(cell.ch)) return null;
  const h = baseHeight(cell, x, z);
  return isWet(cell, x, z) ? h : h + hillHeight(hole, x, z);
}

function seg(ax, az, bx, bz, top, kind) { return { ax, az, bx, bz, top, kind }; }

// Borders where the course meets scenery, rails where a bridge meets water, and step faces where
// two course cells meet at different heights (a step face only stops the ball on its lower side).
function buildWalls(hole) {
  const C = CONFIG.cell, inset = 1e-4;
  const sampleEdge = (cell, ax, az, bx, bz, nx, nz) => {
    const pts = [[ax, az], [(ax + bx) / 2, (az + bz) / 2], [bx, bz]]
      .map(([x, z]) => baseHeight(cell, x - nx * inset, z - nz * inset));
    return { mid: pts[1], max: Math.max(...pts) };
  };
  const add = (s, a, b) => {
    hole.segments.push(s);
    if (a) hole.cellSegs[a.r * hole.cols + a.c].push(s);
    if (b) hole.cellSegs[b.r * hole.cols + b.c].push(s);
  };
  for (const a of hole.cells) {
    if (!isCourseChar(a.ch)) continue;
    const { r, c } = a;
    // [neighbour, edge endpoints in cell units, outward normal]
    const edges = [
      [cellOf(hole, r, c + 1), c + 1, r, c + 1, r + 1, 1, 0],
      [cellOf(hole, r + 1, c), c, r + 1, c + 1, r + 1, 0, 1],
      [cellOf(hole, r, c - 1), c, r, c, r + 1, -1, 0],
      [cellOf(hole, r - 1, c), c, r, c + 1, r, 0, -1],
    ];
    edges.forEach(([b, ec0, er0, ec1, er1, nx, nz], i) => {
      const ax = ec0 * C, az = er0 * C, bx = ec1 * C, bz = er1 * C;
      const ha = sampleEdge(a, ax, az, bx, bz, nx, nz);
      if (!b || !isCourseChar(b.ch)) {
        const s = seg(ax, az, bx, bz, ha.max + CONFIG.wallHeight, 'border');
        s.nx = nx; s.nz = nz; s.cell = a; // outward normal and owning cell, for drawing
        add(s, a, null);
        return;
      }
      if (i >= 2) return; // course–course edges are handled once, from the left/top cell
      if ((a.ch === '=' && isHazardChar(b.ch)) || (isHazardChar(a.ch) && b.ch === '=')) {
        const bridge = a.ch === '=' ? a : b;
        add(seg(ax, az, bx, bz, bridge.level * CONFIG.levelStep + CONFIG.wallHeight, 'rail'), a, b);
        return;
      }
      const hb = sampleEdge(b, ax, az, bx, bz, -nx, -nz);
      if (Math.abs(ha.mid - hb.mid) > 0.005) {
        const s = seg(ax, az, bx, bz, Math.max(ha.max, hb.max), 'step');
        s.cellA = a; s.cellB = b;
        add(s, a, b);
      }
    });
  }
}

// A windmill straddles a lane: two faces with a doorway, a short passage, and blades that close
// the doorway whenever one points down. e.c/e.r are the doorway centre in cell units.
function addWindmill(hole, e) {
  const C = CONFIG.cell;
  const w = {
    x: e.c * C, z: e.r * C, axis: e.axis, halfWidth: e.halfWidth, door: 0.24, depth: 0.5,
    period: e.period || 4, phase: e.phase || 0, front: e.front || -1, gate: null,
  };
  // u runs along the lane, v across it
  const P = (u, v) => e.axis === 'z' ? [w.x + v, w.z + u] : [w.x + u, w.z + v];
  const S = (u0, v0, u1, v1, kind) => { const [ax, az] = P(u0, v0), [bx, bz] = P(u1, v1); return seg(ax, az, bx, bz, 10, kind); };
  const hd = w.depth / 2, dd = w.door / 2, hw = w.halfWidth;
  for (const u of [-hd, hd]) {
    hole.extraSegs.push(S(u, -hw, u, -dd, 'windmill'), S(u, dd, u, hw, 'windmill'));
  }
  hole.extraSegs.push(S(-hd, -dd, hd, -dd, 'windmill'), S(-hd, dd, hd, dd, 'windmill'));
  const gu = w.front * (hd + 0.04);
  w.gate = S(gu, -dd, gu, dd, 'blade');
  hole.windmills.push(w);
}

function windmillAngle(w, t) { return (2 * Math.PI * t) / w.period + w.phase; }

function windmillBlocked(w, t) {
  const a = windmillAngle(w, t);
  for (let k = 0; k < 4; k++) if (Math.sin(a + (k * Math.PI) / 2) < -0.949) return true;
  return false;
}

function createBall(pos) {
  return { x: pos.x, y: pos.y, z: pos.z, vx: 0, vy: 0, vz: 0, air: false, transport: null, lipLock: false, moving: false };
}

// ---- Machines ----
// Lane-relative coordinates: u runs along the lane, v across it.
function laneXZ(o, u, v) { return o.axis === 'z' ? [o.x + v, o.z + u] : [o.x + u, o.z + v]; }
function laneUV(o, x, z) { return o.axis === 'z' ? [z - o.z, x - o.x] : [x - o.x, z - o.z]; }

// A sliding gate: a barrier across the lane with an opening that slides from side to side.
function sliderPieces(s, t) {
  const w = (2 * Math.PI) / s.period, A = s.halfWidth - s.gap / 2 - 0.04;
  const o = A * Math.sin(w * t + s.phase), ov = A * w * Math.cos(w * t + s.phase);
  const [vx, vz] = s.axis === 'z' ? [ov, 0] : [0, ov];
  return [[-s.halfWidth, o - s.gap / 2], [o + s.gap / 2, s.halfWidth]].map(([v0, v1]) => {
    const [ax, az] = laneXZ(s, 0, v0), [bx, bz] = laneXZ(s, 0, v1);
    return { seg: seg(ax, az, bx, bz, 10, 'slider'), vx, vz, v0, v1 };
  });
}

// A pendulum swinging across the lane. Its bob only reaches the ball near the bottom of the swing.
function pendulumState(p, t) {
  const w = (2 * Math.PI) / p.period;
  const th = p.amp * Math.sin(w * t + p.phase), thd = p.amp * w * Math.cos(w * t + p.phase);
  const [x, z] = laneXZ(p, 0, p.length * Math.sin(th));
  const sv = p.length * Math.cos(th) * thd;
  const [vx, vz] = p.axis === 'z' ? [sv, 0] : [0, sv];
  return { th, x, z, vx, vz, lift: p.length * (1 - Math.cos(th)) };
}

// Position along a transport path (lift ride, loop, cannon flight) at time t.
function transportPos(tr) {
  const pts = tr.path;
  let total = 0;
  const lens = [];
  for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y, pts[i].z - pts[i - 1].z); lens.push(l); total += l; }
  let s = Math.min(1, tr.t / tr.dur) * total;
  for (let i = 0; i < lens.length; i++) {
    if (s <= lens[i] || i === lens.length - 1) {
      const k = lens[i] ? Math.min(1, s / lens[i]) : 1, a = pts[i], b = pts[i + 1];
      return { x: a.x + (b.x - a.x) * k, y: a.y + (b.y - a.y) * k, z: a.z + (b.z - a.z) * k };
    }
    s -= lens[i];
  }
  return pts[pts.length - 1];
}

function startTransport(ball, kind, path, dur, exit, visible) {
  ball.transport = { kind, path, dur, t: 0, exit, visible };
  ball.vx = ball.vy = ball.vz = 0;
  ball.air = false;
}

const P3 = (m, y = m.y) => ({ x: m.x, y, z: m.z });

function enterTunnel(ball, tn, m, other, sp) {
  const s = Math.max(sp * 0.85, CONFIG.tunnelExitMin), C = CONFIG.cell;
  startTransport(ball, 'tunnel', [P3(m), P3(other)], tn.length / Math.max(sp, 1),
    { x: other.x + other.out[0] * C * 0.55, z: other.z + other.out[1] * C * 0.55, vx: other.out[0] * s, vz: other.out[1] * s }, false);
}

// The lift carries the ball up its tower at a steady pace and lets it roll down a short chute.
function enterLift(ball, lf) {
  const C = CONFIG.cell, a = lf.a, b = lf.b;
  const top = Math.max(a.y, b.y) + 0.45;
  const tower = { x: a.x - a.out[0] * 0.35, z: a.z - a.out[1] * 0.35 };
  const chute = { x: b.x - b.out[0] * 0.35, z: b.z - b.out[1] * 0.35 };
  const path = [P3(a), { ...tower, y: a.y + 0.03 }, { ...tower, y: top }, { ...chute, y: b.y + 0.12 }, P3(b)];
  const dur = 0.4 + (top - a.y) / 0.35 + 0.7;
  startTransport(ball, 'lift', path, dur,
    { x: b.x + b.out[0] * C * 0.55, z: b.z + b.out[1] * C * 0.55, vx: b.out[0] * lf.exitSpeed, vz: b.out[1] * lf.exitSpeed }, true);
}

// The cannon takes the ball into its breech and fires it on a ballistic arc to a fixed landing spot.
function cannonMuzzle(cn) {
  return { x: cn.a.x - cn.a.out[0] * 0.3, y: cn.a.y + 0.22, z: cn.a.z - cn.a.out[1] * 0.3 };
}

function enterCannon(ball, cn) {
  const G = CONFIG.gravity, m = cannonMuzzle(cn), tg = cn.target;
  const vy0 = Math.sqrt(2 * G * cn.apex);
  const fall = m.y + cn.apex - tg.y;
  const flight = vy0 / G + Math.sqrt((2 * fall) / G);
  const path = [P3(cn.a), m];
  for (let i = 1; i <= 30; i++) {
    const t = (i / 30) * flight;
    path.push({ x: m.x + (tg.x - m.x) * (i / 30), y: m.y + vy0 * t - 0.5 * G * t * t, z: m.z + (tg.z - m.z) * (i / 30) });
  }
  const hd = Math.hypot(tg.x - m.x, tg.z - m.z) || 1;
  startTransport(ball, 'cannon', path, 0.35 + flight,
    { x: tg.x, z: tg.z, vx: ((tg.x - m.x) / hd) * cn.landSpeed, vz: ((tg.z - m.z) / hd) * cn.landSpeed }, true);
  ball.transport.flightStart = 0.35 / (0.35 + flight);
}

// Speed a rolling ball needs at the bottom of a loop of radius R to stay on the track at the top:
// v_top² ≥ gR and v_bottom² = v_top² + (10/7)·g·2R (rolling), plus a little for track friction.
function loopSpeedNeeded(R) { return Math.sqrt((27 / 7) * CONFIG.gravity * R) * 1.06; }

function enterLoop(ball, lp, sgn, sp) {
  const C = CONFIG.cell, R = lp.radius, G = CONFIG.gravity;
  const from = sgn > 0 ? lp.E : lp.X, to = sgn > 0 ? lp.X : lp.E;
  const dx = lp.d[0] * sgn, dz = lp.d[1] * sgn, M = lp.M;
  const at = phi => ({ x: M.x + dx * R * Math.sin(phi), y: M.y + R - R * Math.cos(phi), z: M.z + dz * R * Math.sin(phi) });
  const arc = (p0, p1) => { const out = []; for (let i = 0; i <= 24; i++) out.push(at(p0 + ((p1 - p0) * i) / 24)); return out; };
  if (sp >= loopSpeedNeeded(R)) {
    const out = sp * 0.85;
    startTransport(ball, 'loop', [P3(from), ...arc(0, 2 * Math.PI), P3(to)], (2 * C + 2 * Math.PI * R) / Math.max(sp * 0.75, 0.5),
      { x: to.x + dx * C * 0.55, z: to.z + dz * C * 0.55, vx: dx * out, vz: dz * out }, true);
  } else {
    // climbs as high as its speed allows, then rolls back out the way it came
    const h = (0.7 * sp * sp) / G;
    const phiMax = h < R ? Math.acos(1 - h / R) : Math.min(Math.PI * 0.85, Math.PI / 2 + (h - R) / R);
    const back = sp * 0.6;
    startTransport(ball, 'loop', [P3(from), ...arc(0, phiMax), ...arc(phiMax, 0), P3(from)], (C + 2 * R * phiMax) / Math.max(sp * 0.6, 0.4),
      { x: from.x - dx * C * 0.55, z: from.z - dz * C * 0.55, vx: -dx * back, vz: -dz * back }, true);
  }
}

// A ball must never come to rest where a moving gate or pendulum sweeps; nudge it clear.
function clearOfMachines(hole, ball) {
  const R = CONFIG.ballR;
  for (const o of [...hole.sliders, ...hole.pendulums]) {
    const half = (o.bobR || 0) + R * 1.6;
    const [u, v] = laneUV(o, ball.x, ball.z);
    if (Math.abs(u) >= half || Math.abs(v) > (o.halfWidth || 1) + 0.1) continue;
    const [x, z] = laneXZ(o, (u < 0 ? -1 : 1) * half * 1.05, v);
    if (groundHeight(hole, x, z) === null) continue;
    ball.x = x; ball.z = z; ball.y = groundHeight(hole, x, z);
  }
}

function shoot(ball, angle, power) {
  const s = Math.min(1, Math.max(0, power)) * CONFIG.maxSpeed;
  ball.vx = Math.cos(angle) * s;
  ball.vz = Math.sin(angle) * s;
  ball.vy = 0;
  ball.moving = s > 0;
  ball.lipLock = false;
}

// Downhill pull uses one-sided differences at step edges so a cliff never reads as a slope.
function gradient(hole, x, z) {
  const e = 0.005, h0 = groundHeight(hole, x, z);
  const axis = (hp, hm) => {
    const okP = hp !== null && Math.abs(hp - h0) < 0.01;
    const okM = hm !== null && Math.abs(h0 - hm) < 0.01;
    if (okP && okM) return (hp - hm) / (2 * e);
    if (okP) return (hp - h0) / e;
    if (okM) return (h0 - hm) / e;
    return 0;
  };
  if (h0 === null) return { x: 0, z: 0 };
  return {
    x: axis(groundHeight(hole, x + e, z), groundHeight(hole, x - e, z)),
    z: axis(groundHeight(hole, x, z + e), groundHeight(hole, x, z - e)),
  };
}

// (wvx, wvz) is the wall's own velocity, for moving gates; the bounce is worked out relative to it.
function collideSegment(ball, s, wvx = 0, wvz = 0) {
  if (ball.y >= s.top - 0.001) return false;
  const R = CONFIG.ballR;
  const ex = s.bx - s.ax, ez = s.bz - s.az;
  const len2 = ex * ex + ez * ez;
  let t = len2 ? ((ball.x - s.ax) * ex + (ball.z - s.az) * ez) / len2 : 0;
  t = Math.max(0, Math.min(1, t));
  const px = s.ax + ex * t, pz = s.az + ez * t;
  let dx = ball.x - px, dz = ball.z - pz;
  const d = Math.hypot(dx, dz);
  if (d >= R) return false;
  if (d < 1e-9) { dx = -ez; dz = ex; } // dead on the line: push along its normal
  const dl = Math.hypot(dx, dz);
  const nx = dx / dl, nz = dz / dl;
  ball.x = px + nx * R;
  ball.z = pz + nz * R;
  bounce(ball, nx, nz, wvx, wvz, CONFIG.restitution, 0);
  return true;
}

function bounce(ball, nx, nz, wvx, wvz, e, kick) {
  const rvx = ball.vx - wvx, rvz = ball.vz - wvz;
  const vn = rvx * nx + rvz * nz;
  if (vn >= 0) return;
  const tx = rvx - vn * nx, tz = rvz - vn * nz, out = -vn * e + kick;
  ball.vx = wvx + tx * CONFIG.wallTangent + out * nx;
  ball.vz = wvz + tz * CONFIG.wallTangent + out * nz;
}

function collideCircle(ball, cx, cz, rad, wvx, wvz, e, kick) {
  const dx = ball.x - cx, dz = ball.z - cz, d = Math.hypot(dx, dz), min = rad + CONFIG.ballR;
  if (d >= min || d < 1e-9) return false;
  const nx = dx / d, nz = dz / d;
  ball.x = cx + nx * min; ball.z = cz + nz * min;
  bounce(ball, nx, nz, wvx, wvz, e, kick);
  return true;
}

// Returns 'post' for a pinball post, 'wall' for anything else hit, or null.
function collideWalls(hole, ball, t) {
  let hit = false;
  for (const p of hole.posts) if (collideCircle(ball, p.x, p.z, p.rad, 0, 0, 0.95, 0.5)) return 'post';
  for (const s of hole.sliders) for (const pc of sliderPieces(s, t)) hit = collideSegment(ball, pc.seg, pc.vx, pc.vz) || hit;
  for (const p of hole.pendulums) {
    const st = pendulumState(p, t);
    if (st.lift < 2 * CONFIG.ballR) hit = collideCircle(ball, st.x, st.z, p.bobR, st.vx, st.vz, 0.6, 0) || hit;
  }
  const r0 = Math.floor(ball.z / CONFIG.cell), c0 = Math.floor(ball.x / CONFIG.cell);
  for (let r = r0 - 1; r <= r0 + 1; r++) {
    for (let c = c0 - 1; c <= c0 + 1; c++) {
      const cell = cellOf(hole, r, c);
      if (!cell) continue;
      for (const s of hole.cellSegs[r * hole.cols + c]) hit = collideSegment(ball, s) || hit;
    }
  }
  for (const s of hole.extraSegs) hit = collideSegment(ball, s) || hit;
  for (const w of hole.windmills) if (windmillBlocked(w, t)) hit = collideSegment(ball, w.gate) || hit;
  return hit ? 'wall' : null;
}

// One small step. Returns null, or an event: 'holed' | 'water' | 'out' | 'stopped' | 'wall' | 'post' | 'lip'
// | 'tunnel' | 'lift' | 'loop' (entering a machine) | 'arrive' (leaving one).
function substep(hole, ball, t, h) {
  const K = CONFIG.rollK, G = CONFIG.gravity;
  let bounced = false;
  const tr = ball.transport;
  if (tr) {
    tr.t += h;
    const p = transportPos(tr);
    ball.x = p.x; ball.y = p.y; ball.z = p.z;
    if (tr.t < tr.dur) return null;
    ball.x = tr.exit.x; ball.z = tr.exit.z;
    ball.y = groundHeight(hole, ball.x, ball.z);
    ball.vx = tr.exit.vx; ball.vz = tr.exit.vz; ball.vy = 0;
    ball.transport = null;
    return 'arrive';
  }

  if (!ball.air) {
    const g = gradient(hole, ball.x, ball.z);
    ball.vx -= K * G * g.x * h;
    ball.vz -= K * G * g.z * h;
    let sp = Math.hypot(ball.vx, ball.vz);
    if (sp > 0) {
      const dec = Math.min(sp, surfaceDecel(cellAt(hole, ball.x, ball.z)) * h);
      ball.vx -= (ball.vx / sp) * dec;
      ball.vz -= (ball.vz / sp) * dec;
    }
    sp = Math.hypot(ball.vx, ball.vz);
    if (sp < CONFIG.stopSpeed && K * G * Math.hypot(g.x, g.z) < surfaceDecel(cellAt(hole, ball.x, ball.z))) {
      ball.vx = ball.vz = 0;
      ball.moving = false;
      clearOfMachines(hole, ball);
      return 'stopped';
    }
    const px = ball.x, pz = ball.z;
    ball.x += ball.vx * h;
    ball.z += ball.vz * h;
    const gh = groundHeight(hole, ball.x, ball.z);
    if (gh !== null) {
      if (gh < ball.y - CONFIG.dropTolerance) { ball.air = true; ball.vy = 0; }
      else if (gh > ball.y + CONFIG.dropTolerance) {
        // ran into a rise with no step face (a corner) — bounce back
        ball.x = px; ball.z = pz; ball.vx *= -0.5; ball.vz *= -0.5;
      } else ball.y = gh;
    }
  } else {
    ball.vy -= G * h;
    ball.x += ball.vx * h;
    ball.y += ball.vy * h;
    ball.z += ball.vz * h;
    const gh = groundHeight(hole, ball.x, ball.z);
    if (gh !== null && ball.y <= gh) {
      const under = cellAt(hole, ball.x, ball.z);
      if (under.ch === 'j' && ball.vy < -0.5) {
        // a trampoline throws it back up
        ball.y = gh; ball.vy = -ball.vy * CONFIG.trampoline;
        bounced = true;
      } else {
        ball.y = gh; ball.vy = 0; ball.air = false;
        ball.vx *= CONFIG.landing; ball.vz *= CONFIG.landing;
      }
    }
  }

  const hitWall = collideWalls(hole, ball, t);

  const cell = cellAt(hole, ball.x, ball.z);
  if (!cell || !isCourseChar(cell.ch)) return 'out';
  if (isWet(cell, ball.x, ball.z) && ball.y <= baseHeight(cell, ball.x, ball.z) + 0.02) return cell.ch === 'L' ? 'lava' : 'water';

  if (!ball.air) {
    const sp = Math.hypot(ball.vx, ball.vz);
    const at = m => cell.r === m.r && cell.c === m.c;
    const into = m => ball.vx * m.out[0] + ball.vz * m.out[1] < -0.05; // heading into a mouth that faces out
    for (const tn of hole.tunnels) {
      for (const [m, other] of [[tn.a, tn.b], [tn.b, tn.a]]) {
        if (at(m) && into(m)) { enterTunnel(ball, tn, m, other, sp); return 'tunnel'; }
      }
    }
    for (const lf of hole.lifts) if (at(lf.a) && into(lf.a)) { enterLift(ball, lf); return 'lift'; }
    for (const cn of hole.cannons) if (at(cn.a) && into(cn.a)) { enterCannon(ball, cn); return 'cannon'; }
    for (const lp of hole.loops) {
      for (const [m, sgn] of [[lp.E, 1], [lp.X, -1]]) {
        if (at(m) && (ball.vx * lp.d[0] + ball.vz * lp.d[1]) * sgn > 0.1) { enterLoop(ball, lp, sgn, sp); return 'loop'; }
      }
    }
  }

  const cup = hole.cup;
  const dc = Math.hypot(ball.x - cup.x, ball.z - cup.z);
  if (dc > CONFIG.cupR + CONFIG.ballR) ball.lipLock = false;
  else if (!ball.air && dc < CONFIG.cupR && !ball.lipLock && Math.abs(ball.y - cup.y) < 0.03) {
    const sp = Math.hypot(ball.vx, ball.vz);
    if (sp < CONFIG.captureSpeed) {
      ball.x = cup.x; ball.z = cup.z; ball.y = cup.y - 0.08;
      ball.vx = ball.vz = ball.vy = 0; ball.moving = false;
      return 'holed';
    }
    ball.lipLock = true;
    if (sp < CONFIG.lipSpeed) {
      // spin round the rim and out: turn away from the side the cup is on
      const side = Math.sign(ball.vx * (cup.z - ball.z) - ball.vz * (cup.x - ball.x)) || 1;
      const a = -side * (0.5 + 0.5 * (1 - dc / CONFIG.cupR));
      const ca = Math.cos(a), sa = Math.sin(a);
      const vx = ball.vx * ca - ball.vz * sa, vz = ball.vx * sa + ball.vz * ca;
      ball.vx = vx * 0.7; ball.vz = vz * 0.7;
      return 'lip';
    }
  }
  return hitWall || (bounced ? 'bounce' : null);
}

// Advance dt seconds, sub-stepping so the ball never moves more than half its radius per step.
// Returns the events that happened, in order.
function stepBall(hole, ball, t, dt) {
  const sp = Math.hypot(ball.vx, ball.vy, ball.vz);
  const n = Math.max(1, Math.ceil((sp * dt) / (CONFIG.ballR * 0.5)));
  const h = dt / n, events = [];
  for (let i = 0; i < n; i++) {
    const ev = substep(hole, ball, t + i * h, h);
    if (ev) {
      events.push(ev);
      if (FINAL_EVENTS.includes(ev)) break;
    }
  }
  return events;
}

const FINAL_EVENTS = ['holed', 'water', 'lava', 'out', 'stopped'];

// Play one putt to completion. Returns the final event and where the ball ended up.
function simulateShot(hole, start, angle, power, maxTime = 25) {
  const ball = createBall(start);
  shoot(ball, angle, power);
  for (let t = 0; t < maxTime; t += CONFIG.dt) {
    const evs = stepBall(hole, ball, t, CONFIG.dt);
    const fin = evs.find(e => FINAL_EVENTS.includes(e));
    if (fin) return { event: fin, ball };
  }
  return { event: 'stopped', ball };
}

// Walking distance (m) from every cell to the cup, through tunnels, around water.
function distanceField(hole) {
  const dist = new Array(hole.cells.length).fill(Infinity);
  const startC = cellAt(hole, hole.cup.x, hole.cup.z);
  const q = [startC];
  dist[startC.r * hole.cols + startC.c] = 0;
  const links = [];
  for (const tn of hole.tunnels) links.push([tn.a, tn.b], [tn.b, tn.a]);
  for (const lf of hole.lifts) links.push([lf.b, lf.a]); // one-way: the lift only goes up
  for (const cn of hole.cannons) links.push([cn.target, cn.a]);
  while (q.length) {
    const cell = q.shift();
    const d0 = dist[cell.r * hole.cols + cell.c];
    const next = [[0, 1], [1, 0], [0, -1], [-1, 0]].map(([dr, dc]) => cellOf(hole, cell.r + dr, cell.c + dc));
    for (const [m, other] of links) if (m.r === cell.r && m.c === cell.c) next.push(cellOf(hole, other.r, other.c));
    for (const n of next) {
      if (!n || !isCourseChar(n.ch) || isHazardChar(n.ch)) continue;
      const i = n.r * hole.cols + n.c;
      if (dist[i] > d0 + CONFIG.cell) { dist[i] = d0 + CONFIG.cell; q.push(n); }
    }
  }
  return dist;
}

// A brute-force putter used by tests to prove every hole can be finished.
function botPlay(hole, opts = {}) {
  const angles = opts.angles || 72;
  const powers = opts.powers || [0.06, 0.1, 0.14, 0.19, 0.25, 0.32, 0.4, 0.5, 0.62, 0.76, 0.9];
  const field = distanceField(hole);
  let pos = { x: hole.tee.x, y: hole.tee.y, z: hole.tee.z };
  for (let stroke = 1; stroke <= CONFIG.maxStrokes; stroke++) {
    let best = null;
    for (let i = 0; i < angles; i++) {
      const a = (i / angles) * Math.PI * 2;
      for (const p of powers) {
        const res = simulateShot(hole, pos, a, p);
        if (res.event === 'holed') return { strokes: stroke };
        if (res.event !== 'stopped') continue;
        const cell = cellAt(hole, res.ball.x, res.ball.z);
        const score = field[cell.r * hole.cols + cell.c] + 0.1 * Math.hypot(res.ball.x - hole.cup.x, res.ball.z - hole.cup.z);
        if (!best || score < best.score) best = { score, pos: { x: res.ball.x, y: res.ball.y, z: res.ball.z } };
      }
    }
    if (best) pos = best.pos;
  }
  return { strokes: null };
}

// Score for a hole given how many strokes were played without holing out.
function cappedScore(strokes, holed) { return holed ? strokes : CONFIG.maxStrokes + 1; }

// ---- Courses ----
// Map: g green, @ tee, o cup, ^v<> ramp rising that way, w water, = bridge, t tunnel mouth, . scenery.
// Levels: digit per cell, 0.25 m each. Extras use cell units (c = column, r = row; 1 unit = 0.5 m).
const rep = (n, s) => Array(n).fill(s);

const SUNNY_PARK = {
  id: 'sunny', name: 'Sunny Park',
  shortRound: [0, 1, 3, 4, 5, 7, 9, 10, 13, 14],
  holes: [
    { name: 'First Putt', par: 2,
      map: ['ggg', 'gog', ...rep(13, 'ggg'), 'g@g', 'ggg'] },

    { name: 'Swing Corner', par: 3,
      map: ['gggggggggggg', 'ggggggggggog', 'gggggggggggg', ...rep(10, 'ggg.........'), 'g@g.........', 'ggg.........'],
      extras: [
        { type: 'bumper', a: [0, 1.5], b: [1.5, 0] },
        { type: 'pendulum', c: 1.5, r: 8, axis: 'z', halfWidth: 0.75, period: 2.4 },

let seed = 1;
function rnd() { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (srgb) t.encoding = THREE.sRGBEncoding;
  return t;
}

function speckle(g, w, h, n, colours, size) {
  for (let i = 0; i < n; i++) {
    g.fillStyle = colours[(i * 7919) % colours.length];
    g.fillRect(Math.random() * w, Math.random() * h, size * (0.5 + Math.random()), size * (0.5 + Math.random()));
  }
}

const TEX = {
  carpet: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#2d8a3c'; g.fillRect(0, 0, w, h);
    speckle(g, w, h, 9000, ['#3a9c48', '#24763a', '#33914a', '#1f6b33', '#46a855'], 1.6);
  }),
  grass: canvasTex(256, 256, (g, w, h) => {
    g.fillStyle = '#5f9e46'; g.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      g.strokeStyle = ['#6fae52', '#4f8a3a', '#7ab85c', '#568f3f'][i % 4];
      const x = Math.random() * w, y = Math.random() * h;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x + (Math.random() - 0.5) * 3, y - 3 - Math.random() * 5); g.stroke();
    }
  }),
  brick: canvasTex(256, 128, (g, w, h) => {
    g.fillStyle = '#d9ccb4'; g.fillRect(0, 0, w, h);
    const bw = 64, bh = 32;
    for (let r = 0; r < h / bh; r++) {
      for (let c = -1; c < w / bw + 1; c++) {

// The park lawn, with the hole's plot cut out so ponds below green level aren't covered.
// Inside the plot every non-course cell gets its own grass or flower-bed square.
let ground = null, sea = null;
function buildGround(hole) {
  if (ground) { ground.geometry.dispose(); scene.remove(ground); }
  if (sea) { scene.remove(sea); sea = null; }
  const W = hole.cols * C, D = hole.rows * C;
  const shape = new THREE.Shape();
  // the park lawn runs to the horizon; the beach is a sandy island in the sea
  const island = STYLE !== 'park';
  const m = island ? 11 : 200;
  const x0 = island ? -m : -200, x1 = island ? W + m : 200;
  const y0 = island ? -D - m : -200, y1 = island ? m : 200;
  shape.moveTo(x0, y0); shape.lineTo(x1, y0); shape.lineTo(x1, y1); shape.lineTo(x0, y1); shape.lineTo(x0, y0);
  // shape y maps to world −z after the rotation below
  const cut = new THREE.Path();
  cut.moveTo(0, 0); cut.lineTo(0, -D); cut.lineTo(W, -D); cut.lineTo(W, 0); cut.lineTo(0, 0);
  shape.holes.push(cut);
  ground = new THREE.Mesh(new THREE.ShapeGeometry(shape), { beach: MAT.sand, jungle: MAT.jungle }[STYLE] || MAT.grass);
  ground.rotation.x = -Math.PI / 2;
  ground.position.y = -0.02;
  ground.receiveShadow = true;
  scene.add(ground);
  if (island) {
    sea = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), MAT.sea);
    sea.rotation.x = -Math.PI / 2; sea.position.set(W / 2, -0.1, D / 2);
    sea.receiveShadow = true;
    scene.add(sea);
  }
}

// Collects triangles with UVs and builds a non-indexed BufferGeometry.
class GeoBuilder {
  constructor() { this.pos = []; this.nor = []; this.uv = []; }
  tri(a, b, c, ua, ub, uc, na, nb, nc) {
    if (!na) {
      const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2];
      const vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      na = nb = nc = [nx / l, ny / l, nz / l];
    }
    this.pos.push(...a, ...b, ...c);
    this.nor.push(...na, ...nb, ...nc);
    this.uv.push(...ua, ...ub, ...uc);
  }
  quad(a, b, c, d, ua, ub, uc, ud) { this.tri(a, b, c, ua, ub, uc); this.tri(a, c, d, ua, uc, ud); }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.pos, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(this.nor, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    return g;
  }
  get empty() { return this.pos.length === 0; }
}

// A wall-like block along a ground segment a→b, extending `thick` along normal n, with a sloped top.
function prism(gb, ax, az, bx, bz, nx, nz, thick, bottom, topA, topB) {
  const ox = nx * thick, oz = nz * thick;
  const len = Math.hypot(bx - ax, bz - az);
  const A0 = [ax, bottom, az], B0 = [bx, bottom, bz], A1 = [ax, topA, az], B1 = [bx, topB, bz];
  const C0 = [ax + ox, bottom, az + oz], D0 = [bx + ox, bottom, bz + oz], C1 = [ax + ox, topA, az + oz], D1 = [bx + ox, topB, bz + oz];
  const s = 2; // texture repeats per metre
  gb.quad(A0, B0, B1, A1, [0, bottom * s], [len * s, bottom * s], [len * s, topB * s], [0, topA * s]);
  gb.quad(D0, C0, C1, D1, [len * s, bottom * s], [0, bottom * s], [0, topA * s], [len * s, topB * s]);
  gb.quad(A1, B1, D1, C1, [0, 0], [len * s, 0], [len * s, thick * s], [0, thick * s]);
  gb.quad(C0, A0, A1, C1, [0, bottom * s], [thick * s, bottom * s], [thick * s, topA * s], [0, topA * s]);
  gb.quad(B0, D0, D1, B1, [0, bottom * s], [thick * s, bottom * s], [thick * s, topB * s], [0, topB * s]);
}

function meshOf(gb, mat, shadows = true) {
  const m = new THREE.Mesh(gb.build(), mat);
  m.castShadow = shadows; m.receiveShadow = true;
  return m;
}

function box(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true;
  return m;
}

function rails(points, side, radius, mat) {
  // two thin rails following `points`, offset ±side along the horizontal normal of each segment
  const g = new THREE.Group();
  for (const s of [-1, 1]) {
    const pts = points.map((p, i) => {
      const q = points[Math.min(i + 1, points.length - 1)], o = points[Math.max(i - 1, 0)];
      let dx = q.x - o.x, dz = q.z - o.z;
      const l = Math.hypot(dx, dz) || 1;
      return new THREE.Vector3(p.x - (dz / l) * side * s, p.y, p.z + (dx / l) * side * s);
    });
    const tube = new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), Math.max(8, pts.length * 3), radius, 6, false), mat);
    tube.castShadow = true;
    g.add(tube);
  }
  return g;
}

function addLiftModel(hole, lf) {
  const a = lf.a, b = lf.b;
  const top = Math.max(a.y, b.y) + 0.45;
  const tx = a.x - a.out[0] * 0.35, tz = a.z - a.out[1] * 0.35;
  const g = new THREE.Group();
  const H = top + 0.2 - a.y, s = 0.11;
  for (const [ox, oz] of [[-s, -s], [s, -s], [-s, s], [s, s]]) g.add(box(0.03, H, 0.03, MACH.yellow, tx + ox, a.y + H / 2, tz + oz));
  for (let y = a.y + 0.15; y < top + 0.15; y += 0.22) {
    g.add(box(2 * s + 0.03, 0.02, 0.02, MACH.yellow, tx, y, tz - s), box(2 * s + 0.03, 0.02, 0.02, MACH.yellow, tx, y, tz + s));
  }
  g.add(box(2 * s + 0.08, 0.05, 2 * s + 0.08, MACH.red, tx, a.y + H + 0.025, tz));
  const tubeGlass = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.05, H, 16, 1, true), MACH.glass);
  tubeGlass.position.set(tx, a.y + H / 2, tz);
  g.add(tubeGlass);
  // feed ramp from the mouth into the tower, and the chute down to the upper green
  g.add(rails([{ x: a.x, y: a.y + 0.01, z: a.z }, { x: tx, y: a.y + 0.03, z: tz }], 0.025, 0.006, MACH.steel));
  const cx = b.x - b.out[0] * 0.35, cz = b.z - b.out[1] * 0.35;
  g.add(rails([{ x: tx, y: top, z: tz }, { x: (tx + cx) / 2, y: (top + b.y + 0.12) / 2 + 0.02, z: (tz + cz) / 2 }, { x: cx, y: b.y + 0.12, z: cz }, { x: b.x, y: b.y + 0.01, z: b.z }], 0.025, 0.006, MACH.steel));
  const sign = box(0.3, 0.12, 0.02, MACH.stripes, tx, a.y + H + 0.14, tz);
  g.add(sign);
  holeGroup.add(g);
}

function addLoopModel(hole, lp) {
  const R = lp.radius, M = lp.M, dx = lp.d[0], dz = lp.d[1];
  const pts = [];
  pts.push({ x: lp.E.x, y: M.y + 0.006, z: lp.E.z });
  for (let i = 0; i <= 48; i++) {
    const phi = (i / 48) * Math.PI * 2;
    // drift sideways through the loop so the track can cross itself, like a real one
    const side = (i / 48 - 0.5) * 0.09;
    pts.push({ x: M.x + dx * R * Math.sin(phi) - dz * side, y: M.y + R - R * Math.cos(phi) + 0.006, z: M.z + dz * R * Math.sin(phi) + dx * side });
  }
  pts.push({ x: lp.X.x, y: M.y + 0.006, z: lp.X.z });
  holeGroup.add(rails(pts, 0.026, 0.006, MACH.steel));
  // A-frame supports either side of the loop
  for (const s of [-1, 1]) {
    const px = M.x - dz * s * 0.12, pz = M.z + dx * s * 0.12;
    holeGroup.add(box(0.03, 2 * R + 0.12, 0.03, MACH.red, px, M.y + R + 0.06, pz));
  }
  const beam = box(Math.abs(dz) ? 0.27 : 0.03, 0.03, Math.abs(dx) ? 0.27 : 0.03, MACH.red, M.x, M.y + 2 * R + 0.1, M.z);
  holeGroup.add(beam);
}

function addSliderModel(hole, s) {
  const hw = s.halfWidth;
  for (const v of [-(hw + 0.06), hw + 0.06]) {
    const [x, z] = laneXZ(s, 0, v);
    holeGroup.add(box(0.06, 0.32, 0.06, MAT.wood, x, s.y + 0.16, z));
  }
  const [cx, cz] = laneXZ(s, 0, 0);
  const beam = box(s.axis === 'z' ? 2 * hw + 0.18 : 0.06, 0.06, s.axis === 'z' ? 0.06 : 2 * hw + 0.18, MAT.wood, cx, s.y + 0.32, cz);
  holeGroup.add(beam);
  const pieces = [0, 1].map(() => { const m = box(1, 0.09, 0.035, { beach: MAT.deck, jungle: MAT.bamboo }[STYLE] || MACH.stripes, 0, 0, 0); holeGroup.add(m); return m; });
  anim.sliders.push({ s, pieces });
}

function addPendulumModel(hole, p) {
  const pivotY = p.y + p.length + p.bobR + 0.005, hw = p.halfWidth + 0.1;
  for (const v of [-hw, hw]) {
    const [x, z] = laneXZ(p, 0, v);
    holeGroup.add(box(0.07, pivotY + 0.05 - p.y, 0.07, MAT.wood, x, p.y + (pivotY + 0.05 - p.y) / 2, z));
  }
  const [cx, cz] = laneXZ(p, 0, 0);
  holeGroup.add(box(p.axis === 'z' ? 2 * hw + 0.07 : 0.07, 0.07, p.axis === 'z' ? 0.07 : 2 * hw + 0.07, MAT.wood, cx, pivotY + 0.05, cz));
  const arm = new THREE.Group();
  arm.position.set(cx, pivotY, cz);
  const rod = new THREE.Mesh(new THREE.CylinderGeometry(0.012, 0.012, p.length, 8), MACH.steel);
  rod.position.y = -p.length / 2; rod.castShadow = true;
  // in Pirate Cove the pendulum swings a cannonball on a chain
  const bob = new THREE.Mesh(new THREE.SphereGeometry(p.bobR, 24, 16), { beach: MAT.iron, jungle: MAT.basaltRock }[STYLE] || MACH.stripes);
  bob.position.y = -p.length; bob.castShadow = true;
  arm.add(rod, bob);
  holeGroup.add(arm);
  anim.pendulums.push({ p, arm });
}

function addPostModel(hole, p) {
  const y = groundHeight(hole, p.x, p.z) ?? 0;
  if (STYLE === 'jungle') { addTiki(p.x, y, p.z, p.rad, 0.32); return; }
  if (STYLE === 'beach') {
    // a rum barrel: staves with iron hoops
    const barrel = new THREE.Mesh(new THREE.CylinderGeometry(p.rad * 0.92, p.rad * 0.92, 0.22, 16), MAT.wood);
    barrel.position.set(p.x, y + 0.11, p.z); barrel.castShadow = true;
    holeGroup.add(barrel);
    for (const hy of [0.04, 0.18]) {
      const hoop = new THREE.Mesh(new THREE.TorusGeometry(p.rad * 0.95, 0.008, 6, 20), MAT.iron);
      hoop.rotation.x = Math.PI / 2; hoop.position.set(p.x, y + hy, p.z);
      holeGroup.add(hoop);
    }
    return;
  }
  const post = new THREE.Mesh(new THREE.CylinderGeometry(p.rad * 0.8, p.rad * 0.8, 0.16, 20), MAT.white);
  post.position.set(p.x, y + 0.08, p.z); post.castShadow = true;
  const ring = new THREE.Mesh(new THREE.TorusGeometry(p.rad * 0.92, p.rad * 0.22, 10, 24), MACH.rubber);
  ring.rotation.x = Math.PI / 2; ring.position.set(p.x, y + 0.03, p.z); ring.castShadow = true;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(p.rad * 0.8, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2), MACH.red);
  cap.position.set(p.x, y + 0.16, p.z);
  holeGroup.add(post, ring, cap);
}

function animateMachines(t) {
  for (const a of anim.windmills) a.rotor.rotation.z = a.flip * windmillAngle(a.w, t);
  for (const { s, pieces } of anim.sliders) {
    sliderPieces(s, t).forEach((pc, i) => {
      const m = pieces[i], len = Math.max(0.001, pc.v1 - pc.v0);
      const [x, z] = laneXZ(s, 0, (pc.v0 + pc.v1) / 2);
      m.position.set(x, s.y + 0.05, z);
      m.scale.set(len, 1, 1);
      m.rotation.y = s.axis === 'z' ? 0 : Math.PI / 2;
    });
  }
  for (const { p, arm } of anim.pendulums) {
    const th = pendulumState(p, t).th;
    if (p.axis === 'z') arm.rotation.z = th; else arm.rotation.x = -th;
  }
}

function disposeGroup(g) {
  g.traverse(o => { if (o.geometry) o.geometry.dispose(); });
  scene.remove(g);
}

let STYLE = 'park';

const SKIES = {
  park: { top: '#3f87d6', bottom: '#d9ecff' },
  beach: { top: '#2f8fe0', bottom: '#dff3ff' },
  jungle: { top: '#4a78b8', bottom: '#f3d2ad' }, // hazy, warmed by the volcano
};

function buildHole(hole, style = 'park') {
  STYLE = style;
  const beach = style === 'beach', jungle = style === 'jungle';
  const sk = SKIES[style] || SKIES.park;
  sky.material.uniforms.top.value.set(sk.top);
  sky.material.uniforms.bottom.value.set(sk.bottom);
  scene.fog.color.set(sk.bottom);
  if (holeGroup) disposeGroup(holeGroup);
  holeGroup = new THREE.Group();
  anim.windmills = []; anim.water = []; anim.sliders = []; anim.pendulums = []; anim.flags = []; anim.ship = null; anim.volcanoes = []; anim.flames = [];
  seed = 1 + hole.rows * 131 + hole.cols * 17;

  const carpet = new GeoBuilder(), bridge = new GeoBuilder(), water = new GeoBuilder(), basin = new GeoBuilder();
  const brick = new GeoBuilder(), wood = new GeoBuilder(), stone = new GeoBuilder(), soil = new GeoBuilder();
  const bunker = new GeoBuilder(), deck = new GeoBuilder(), hull = new GeoBuilder();
  const lava = new GeoBuilder(), tramp = new GeoBuilder(), basalt = new GeoBuilder();
  const N = 4;

  for (const cell of hole.cells) {
    if (!isCourseChar(cell.ch)) continue;
    const x0 = cell.c * C, z0 = cell.r * C;
    if (cell.ch === 'w' || cell.ch === 'p' || cell.ch === 'L') {
      const y = cell.ch !== 'p' ? baseHeight(cell, x0 + C / 2, z0 + C / 2) : -CONFIG.waterDepth;
      if (cell.ch === 'L') {
        lava.quad([x0, y, z0 + C], [x0 + C, y, z0 + C], [x0 + C, y, z0], [x0, y, z0], [x0, z0 + C], [x0 + C, z0 + C], [x0 + C, z0], [x0, z0]);
        continue;
      }
      if (cell.ch === 'p') {
        // the plank itself: a narrow board over the water
        const top = cell.level * CONFIG.levelStep, hw = CONFIG.plankWidth / 2, cx = x0 + C / 2, cz = z0 + C / 2;
        if (cell.plankAxis === 'z') prism(deck, cx - hw, z0, cx - hw, z0 + C, 1, 0, 2 * hw, top - 0.05, top, top);
        else prism(deck, x0, cz - hw, x0 + C, cz - hw, 0, 1, 2 * hw, top - 0.05, top, top);
      }
      water.quad([x0, y, z0 + C], [x0 + C, y, z0 + C], [x0 + C, y, z0], [x0, y, z0], [x0, z0 + C], [x0 + C, z0 + C], [x0 + C, z0], [x0, z0]);
      const by = y - 0.12;
      basin.quad([x0, by, z0 + C], [x0 + C, by, z0 + C], [x0 + C, by, z0], [x0, by, z0], [0, 1], [1, 1], [1, 0], [0, 0]);
      continue;
    }
    const gb = cell.ch === '=' ? bridge : cell.ch === 's' ? bunker : cell.ch === 'd' ? deck : cell.ch === 'j' ? tramp : carpet;
    // sample just inside the cell so neighbouring levels don't bleed in
    const P = (i, j) => {
      const x = x0 + Math.min(Math.max(i / N, 1e-4), 1 - 1e-4) * C;
      const z = z0 + Math.min(Math.max(j / N, 1e-4), 1 - 1e-4) * C;
      const y = groundHeight(hole, x, z);
      const g = gradient(hole, x, z);
      const l = Math.hypot(g.x, 1, g.z);
      return { p: [x0 + (i / N) * C, y, z0 + (j / N) * C], n: [-g.x / l, 1 / l, -g.z / l], uv: [(x0 + (i / N) * C) * 1.2, (z0 + (j / N) * C) * 1.2] };
    };
    for (let i = 0; i < N; i++) {
      for (let j = 0; j < N; j++) {
        const a = P(i, j + 1), b = P(i + 1, j + 1), c = P(i + 1, j), d = P(i, j);
        gb.tri(a.p, b.p, c.p, a.uv, b.uv, c.uv, a.n, b.n, c.n);
        gb.tri(a.p, c.p, d.p, a.uv, c.uv, d.uv, a.n, c.n, d.n);
      }
    }
  }

  for (const s of hole.segments) {
    if (s.kind === 'border') {
      const cell = s.cell;
      const ha = baseHeight(cell, s.ax - s.nx * 1e-4, s.az - s.nz * 1e-4);
      const hb = baseHeight(cell, s.bx - s.nx * 1e-4, s.bz - s.nz * 1e-4);
      const low = isHazardChar(cell.ch) ? ha - 0.12 : -0.05;
      const edge = jungle ? basalt : cell.ch === 'w' ? stone : cell.ch === 'd' ? hull : beach ? wood : brick;
      prism(edge, s.ax, s.az, s.bx, s.bz, s.nx, s.nz, 0.07, Math.min(low, -0.05), ha + CONFIG.wallHeight, hb + CONFIG.wallHeight);
    } else if (s.kind === 'step') {
      const a = s.cellA, b = s.cellB;
      const mx = (s.ax + s.bx) / 2, mz = (s.az + s.bz) / 2;
      const nx = b.c - a.c, nz = b.r - a.r;
      const hA = baseHeight(a, mx - nx * 1e-4, mz - nz * 1e-4), hB = baseHeight(b, mx + nx * 1e-4, mz + nz * 1e-4);
      const lowCell = hA < hB ? a : b;
      const bottom = isHazardChar(lowCell.ch) ? Math.min(hA, hB) - 0.12 : Math.min(hA, hB);
      const highCell = lowCell === a ? b : a;
      prism(highCell.ch === 'd' ? hull : jungle ? basalt : lowCell.ch === 'w' ? stone : wood, s.ax, s.az, s.bx, s.bz, 0, 0, 0, bottom, s.top, s.top);
    } else if (s.kind === 'rail' && jungle) {
      // a rope bridge: posts and a sagging hand-rope instead of a timber rail
      const y = s.top - CONFIG.wallHeight;
      holeGroup.add(box(0.035, 0.28, 0.035, MAT.wood, s.ax, y + 0.12, s.az), box(0.035, 0.28, 0.035, MAT.wood, s.bx, y + 0.12, s.bz));
      const pts = [];
      for (let j = 0; j <= 6; j++) { const t = j / 6; pts.push(new THREE.Vector3(s.ax + (s.bx - s.ax) * t, y + 0.2 - Math.sin(t * Math.PI) * 0.04, s.az + (s.bz - s.az) * t)); }
      holeGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 6, 0.01, 4, false), MAT.rope));
    } else if (s.kind === 'rail') {
      const y = s.top - CONFIG.wallHeight;
      prism(wood, s.ax, s.az, s.bx, s.bz, 0, 0, 0, y - 0.15, s.top, s.top);
      holeGroup.add(box(0.04, 0.3, 0.04, MAT.wood, s.ax, y + 0.1, s.az), box(0.04, 0.3, 0.04, MAT.wood, s.bx, y + 0.1, s.bz));
    }
  }
  for (const s of hole.extraSegs) {
    if (s.kind !== 'bumper') continue;
    const dx = s.bx - s.ax, dz = s.bz - s.az, l = Math.hypot(dx, dz);
    const cell = cellAt(hole, (s.ax + s.bx) / 2 + 0.01, (s.az + s.bz) / 2 + 0.01);
    const base = cell ? baseHeight(cell, (s.ax + s.bx) / 2, (s.az + s.bz) / 2) : 0;
    prism(jungle ? basalt : beach ? wood : brick, s.ax, s.az, s.bx, s.bz, dz / l, -dx / l, 0.06, base - 0.05, base + CONFIG.wallHeight, base + CONFIG.wallHeight);
  }

  // scenery cells inside the plot: flower beds hugging the course, lawn elsewhere
  const flowers = [], lawn = new GeoBuilder();
  for (const cell of hole.cells) {
    if (isCourseChar(cell.ch)) continue;
    let near = false;
    for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) {
      const n = cellOf(hole, cell.r + dr, cell.c + dc);
      if (n && isCourseChar(n.ch)) near = true;
    }
    const x0 = cell.c * C, z0 = cell.r * C;
    if (!near || beach || jungle) {
      const y = -0.02, u = v => v; // metres, like the lawn; the texture repeat does the scaling
      if ((beach || jungle) && near) for (let k = 0; k < 2; k++) flowers.push([x0 + 0.06 + rnd() * (C - 0.12), z0 + 0.06 + rnd() * (C - 0.12)]);
      lawn.quad([x0, y, z0 + C], [x0 + C, y, z0 + C], [x0 + C, y, z0], [x0, y, z0], [u(x0), u(-z0 - C)], [u(x0 + C), u(-z0 - C)], [u(x0 + C), u(-z0)], [u(x0), u(-z0)]);
      continue;
    }
    const y = -0.02;
    soil.quad([x0, y, z0 + C], [x0 + C, y, z0 + C], [x0 + C, y, z0], [x0, y, z0], [0, 1], [1, 1], [1, 0], [0, 0]);
    for (let k = 0; k < 5; k++) flowers.push([x0 + 0.06 + rnd() * (C - 0.12), z0 + 0.06 + rnd() * (C - 0.12)]);
  }
  if (!lawn.empty) holeGroup.add(meshOf(lawn, beach ? MAT.sand : jungle ? MAT.jungle : MAT.grass, false));

  const add = (gb, mat, shadows) => { if (!gb.empty) holeGroup.add(meshOf(gb, mat, shadows)); };
  add(carpet, MAT.carpet, false); add(bridge, beach ? MAT.deck : MAT.wood, false); add(basin, beach ? MAT.shallows : MAT.basin, false);
  add(bunker, MAT.bunker, false); add(deck, MAT.deck, true); add(hull, MAT.hull, true);
  add(tramp, MAT.tramp, false); add(basalt, MAT.basalt, true);
  if (!lava.empty) holeGroup.add(meshOf(lava, MAT.lava, false));
  add(brick, MAT.brick, true); add(wood, MAT.wood, true); add(stone, MAT.stone, true); add(soil, MAT.soil, false);
  if (!water.empty) { const wm = meshOf(water, beach ? MAT.lagoon : MAT.water, false); wm.receiveShadow = true; holeGroup.add(wm); }

  if (beach) addDuneGrass(flowers); else if (jungle) addFerns(flowers); else addFlowers(flowers);
  addCupAndFlag(hole);
  addTee(hole);
  for (const w of hole.windmills) addWindmillModel(hole, w);
  for (const tn of hole.tunnels) addTunnelModel(hole, tn);
  for (const lf of hole.lifts) addLiftModel(hole, lf);
  for (const lp of hole.loops) addLoopModel(hole, lp);
  for (const s of hole.sliders) addSliderModel(hole, s);
  for (const p of hole.pendulums) addPendulumModel(hole, p);
  for (const p of hole.posts) addPostModel(hole, p);
  for (const cn of hole.cannons) addCannonModel(hole, cn);
  if (hole.ship) addShipModel(hole);
  if (hole.volcano) addVolcanoModel(hole.volcano);
  if (jungle) addTrampolineFrames(hole);
  animateMachines(0);
  if (beach) addBeachScenery(hole); else if (jungle) addJungleScenery(hole); else addScenery(hole);

  scene.add(holeGroup);
  buildGround(hole);
  fitSun(hole);
}

function addFlowers(spots) {
  if (!spots.length) return;
  const stem = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.004, 0.004, 0.1, 4), MAT.leafDark, spots.length);
  const head = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.022, 0), new THREE.MeshStandardMaterial({ roughness: 0.7 }), spots.length);
  const cols = ['#ff5c8a', '#ffd43b', '#ffffff', '#b06cff', '#ff8a3c', '#ff4040'].map(c => new THREE.Color(c).convertSRGBToLinear());
  const m = new THREE.Matrix4();
  spots.forEach(([x, z], i) => {
    const h = 0.06 + rnd() * 0.06;
    m.makeTranslation(x, h / 2, z); stem.setMatrixAt(i, m);
    m.makeTranslation(x, h, z); head.setMatrixAt(i, m);
    head.setColorAt(i, cols[Math.floor(rnd() * cols.length)]);
  });
  head.castShadow = true;
  holeGroup.add(stem, head);
}

function addCupAndFlag(hole) {
  const { x, y, z } = hole.cup;
  const hole3 = new THREE.Mesh(new THREE.CircleGeometry(CONFIG.cupR, 32), MAT.cup);
  hole3.rotation.x = -Math.PI / 2; hole3.position.set(x, y + 0.002, z);
  const rim = new THREE.Mesh(new THREE.RingGeometry(CONFIG.cupR, CONFIG.cupR + 0.008, 32), MAT.rim);
  rim.rotation.x = -Math.PI / 2; rim.position.set(x, y + 0.0025, z);
  const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, 1.1, 8), MAT.white);
  pole.position.set(x, y + 0.55, z); pole.castShadow = true;
  const fg = new THREE.BufferGeometry();
  fg.setAttribute('position', new THREE.Float32BufferAttribute([0, 0, 0, 0.32, -0.1, 0, 0, -0.2, 0], 3));
  fg.computeVertexNormals();
  const flag = STYLE === 'beach' ? new THREE.Mesh(new THREE.PlaneGeometry(0.32, 0.2).translate(0.16, -0.1, 0), MAT.skull) : new THREE.Mesh(fg, MAT.flag);
  flag.position.set(x, y + 1.1, z); flag.castShadow = true;
  anim.flag = flag;
  holeGroup.add(hole3, rim, pole, flag);
}

function addTee(hole) {
  const { x, y, z } = hole.tee;
  // a rubber tee mat, slightly raised, with a white tee spot
  const mat = box(0.4, 0.003, 0.4, MAT.tee, x, y + 0.0015, z);
  mat.castShadow = false;
  const spot = new THREE.Mesh(new THREE.CircleGeometry(0.015, 16), MAT.white);
  spot.rotation.x = -Math.PI / 2; spot.position.set(x, y + 0.0035, z);
  holeGroup.add(mat, spot);
}

function addWindmillModel(hole, w) {
  const g = new THREE.Group();
  const along = w.axis === 'z';
  const y0 = groundHeight(hole, w.x, w.z) || 0;
  // local frame: u along the lane (local z), v across it (local x)
  if (!along) g.rotation.y = Math.PI / 2;
  g.position.set(w.x, y0, w.z);
  const hw = w.halfWidth + 0.12, d = w.depth, dh = w.door / 2, H = 1.3;
  const side = (hw - dh);
  g.add(box(side, H, d, MAT.plaster, -(dh + side / 2), H / 2, 0));
  g.add(box(side, H, d, MAT.plaster, dh + side / 2, H / 2, 0));
  g.add(box(w.door, H - 0.16, d, MAT.plaster, 0, 0.16 + (H - 0.16) / 2, 0));
  const roof = new THREE.Mesh(new THREE.ConeGeometry(hw * 1.25, 0.8, 4), MAT.roof);
  roof.position.y = H + 0.4; roof.rotation.y = Math.PI / 4; roof.castShadow = true;
  g.add(roof);
  const doorDark = new THREE.Mesh(new THREE.PlaneGeometry(w.door, 0.16), MAT.dark);
  doorDark.position.set(0, 0.08, 0); g.add(doorDark);
  // timber trim and windows on both faces
  for (const f of [-1, 1]) {
    const z = f * (d / 2 + 0.006);
    g.add(box(w.door + 0.06, 0.03, 0.012, MAT.wood, 0, 0.175, z));
    for (const x of [-hw * 0.55, hw * 0.55]) {
      const win = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 0.2), MAT.dark);
      win.position.set(x, 0.62, z + f * 0.001);
      if (f < 0) win.rotation.y = Math.PI;
      g.add(win, box(0.2, 0.025, 0.014, MAT.wood, x, 0.51, z), box(0.2, 0.025, 0.014, MAT.wood, x, 0.73, z));
    }
  }
  g.add(box(hw * 2 + 0.04, 0.05, d + 0.04, MAT.wood, 0, H, 0));
  // blades: hub on the front face; blade k points along (cos a, sin a) in the (across, up) plane
  const hubY = 0.95, len = 0.9;
  const rotor = new THREE.Group();
  rotor.position.set(0, hubY, w.front * (d / 2 + 0.06));
  for (let k = 0; k < 4; k++) {
    const arm = new THREE.Group();
    arm.rotation.z = (k * Math.PI) / 2;
    arm.add(box(len, 0.03, 0.03, MAT.wood, len / 2, 0, 0));
    const sail = new THREE.Mesh(new THREE.PlaneGeometry(len * 0.75, 0.16), MAT.sail);
    sail.position.set(len * 0.55, 0.09, 0); sail.castShadow = true;
    arm.add(sail);
    rotor.add(arm);
  }
  rotor.add(box(0.1, 0.1, 0.08, MAT.wood, 0, 0, 0));
  g.add(rotor);
  // local +x is "across" (v) for a z-lane; for an x-lane the group is turned so local x is −world z
  anim.windmills.push({ w, rotor, flip: along ? 1 : -1 });
  holeGroup.add(g);
}

function addTunnelModel(hole, tn) {
  // a hollow log pipe that leaves each mouth through the back wall and arcs between them
  const mouthPt = (m, back) => new THREE.Vector3(m.x - m.out[0] * back, (groundHeight(hole, m.x, m.z) || 0) + 0.09, m.z - m.out[1] * back);
  const a0 = mouthPt(tn.a, 0.05), a1 = mouthPt(tn.a, 0.6), b0 = mouthPt(tn.b, 0.05), b1 = mouthPt(tn.b, 0.6);
  const mid = a1.clone().add(b1).multiplyScalar(0.5);
  mid.y += 0.25;
  const away = new THREE.Vector3(-tn.a.out[0] - tn.b.out[0], 0, -tn.a.out[1] - tn.b.out[1]);
  mid.add(away.multiplyScalar(0.4));
  const curve = new THREE.CatmullRomCurve3([a0, a1, mid, b1, b0]);
  const beach = STYLE === 'beach', jungle = STYLE === 'jungle';
  const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 64, beach || jungle ? 0.13 : 0.1, 16, false), jungle ? MAT.basaltRock : beach ? MAT.rock : MAT.bark);
  if (beach) {
    // a sea-cave rock heaped over the pipe, with two dark hollows for eyes
    const rockMid = curve.getPoint(0.5);
    const mound = new THREE.Mesh(new THREE.DodecahedronGeometry(0.75, 1), MAT.rock);
    mound.scale.set(1, 0.65, 0.8); mound.position.set(rockMid.x, 0.2, rockMid.z); mound.castShadow = true; mound.receiveShadow = true;
    holeGroup.add(mound);
    const toward = new THREE.Vector3(tn.a.x - rockMid.x, 0, tn.a.z - rockMid.z).normalize();
    for (const side of [-1, 1]) {
      const eye = new THREE.Mesh(new THREE.SphereGeometry(0.12, 10, 8), MAT.dark);
      eye.position.set(rockMid.x + toward.x * 0.62 - toward.z * side * 0.22, 0.42, rockMid.z + toward.z * 0.62 + toward.x * side * 0.22);
      holeGroup.add(eye);
    }
  }
  tube.castShadow = true; tube.receiveShadow = true;
  holeGroup.add(tube);
  for (const m of [tn.a, tn.b]) {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.025, 8, 20), MAT.wood);
    const p = mouthPt(m, 0.03);
    ring.position.copy(p);
    ring.lookAt(p.x + m.out[0], p.y, p.z + m.out[1]);
    ring.castShadow = true;
    const inner = new THREE.Mesh(new THREE.CircleGeometry(0.095, 20), MAT.dark);
    inner.position.copy(mouthPt(m, 0.08));
    inner.lookAt(inner.position.x + m.out[0], inner.position.y, inner.position.z + m.out[1]);
    holeGroup.add(ring, inner);
  }
}

function holeBounds(hole) {
  return { x0: 0, z0: 0, x1: hole.cols * C, z1: hole.rows * C };
}

function addScenery(hole) {
  const b = holeBounds(hole);
  const cx = (b.x0 + b.x1) / 2, cz = (b.z0 + b.z1) / 2;
  const inBand = (x, z, m0, m1) => {
    const dx = Math.max(b.x0 - x, 0, x - b.x1), dz = Math.max(b.z0 - z, 0, z - b.z1);
    const d = Math.hypot(dx, dz);
    return d > m0 && d < m1;
  };
  const pick = (m0, m1) => {
    for (let i = 0; i < 40; i++) {
      const x = b.x0 - m1 + rnd() * (b.x1 - b.x0 + 2 * m1), z = b.z0 - m1 + rnd() * (b.z1 - b.z0 + 2 * m1);
      if (inBand(x, z, m0, m1) && Math.hypot(x - hole.tee.x, z - hole.tee.z) > 2.8) return [x, z]; // keep the tee-off camera clear
    }
    return [cx + m1, cz];
  };

  // trees
  const trees = 26;
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.08, 0.12, 1, 6), MAT.bark, trees);
  const crownA = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), MAT.leaf, trees);
  const crownB = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), MAT.leafDark, trees);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3();
  for (let i = 0; i < trees; i++) {
    const [x, z] = pick(2.2, 10);
    const h = 1.6 + rnd() * 2.2, r = 0.7 + rnd() * 0.7;
    m.compose(p.set(x, h / 2, z), q, s.set(1 + rnd() * 0.5, h, 1 + rnd() * 0.5)); trunk.setMatrixAt(i, m);
    m.compose(p.set(x, h + r * 0.4, z), q, s.set(r, r * 0.9, r)); crownA.setMatrixAt(i, m);
    m.compose(p.set(x + r * 0.35, h + r * 0.05, z - r * 0.2), q, s.set(r * 0.7, r * 0.65, r * 0.7)); crownB.setMatrixAt(i, m);
  }
  for (const im of [trunk, crownA, crownB]) { im.castShadow = true; im.receiveShadow = true; holeGroup.add(im); }

  // bushes and rocks closer in
  const bushes = 30;
  const bush = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(1, 1), MAT.leafDark, bushes);
  for (let i = 0; i < bushes; i++) {
    const [x, z] = pick(0.5, 2.2), r = 0.18 + rnd() * 0.25;
    m.compose(p.set(x, r * 0.5, z), q, s.set(r, r * 0.8, r)); bush.setMatrixAt(i, m);
  }
  bush.castShadow = true; holeGroup.add(bush);
  const rocks = 12;
  const rock = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0), MAT.rock, rocks);
  for (let i = 0; i < rocks; i++) {
    const [x, z] = pick(0.4, 3), r = 0.08 + rnd() * 0.18;
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rnd() * 6);
    m.compose(p.set(x, r * 0.3, z), q, s.set(r * 1.3, r * 0.8, r)); rock.setMatrixAt(i, m);
  }
  q.identity();
  rock.castShadow = true; rock.receiveShadow = true; holeGroup.add(rock);

  // white picket fence around the hole's plot
  const fx0 = b.x0 - 1.4, fx1 = b.x1 + 1.4, fz0 = b.z0 - 1.4, fz1 = b.z1 + 1.4;
  const per = 2 * (fx1 - fx0 + fz1 - fz0), spacing = 0.22, count = Math.floor(per / spacing);
  const picket = new THREE.InstancedMesh(new THREE.BoxGeometry(0.06, 0.5, 0.025), MAT.white, count);
  for (let i = 0; i < count; i++) {
    let d = i * spacing, x, z, rot = 0;
    const w = fx1 - fx0, hgt = fz1 - fz0;
    if (d < w) { x = fx0 + d; z = fz0; }
    else if ((d -= w) < hgt) { x = fx1; z = fz0 + d; rot = Math.PI / 2; }
    else if ((d -= hgt) < w) { x = fx1 - d; z = fz1; }
    else { d -= w; x = fx0; z = fz1 - d; rot = Math.PI / 2; }
    q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rot);
    m.compose(p.set(x, 0.25, z), q, s.set(1, 1, 1)); picket.setMatrixAt(i, m);
  }
  picket.castShadow = true; holeGroup.add(picket);
  for (const [ax, az, bx, bz] of [[fx0, fz0, fx1, fz0], [fx1, fz0, fx1, fz1], [fx1, fz1, fx0, fz1], [fx0, fz1, fx0, fz0]]) {
    const len = Math.hypot(bx - ax, bz - az);
    for (const y of [0.15, 0.38]) {
      const rail = box(len, 0.04, 0.02, MAT.white, (ax + bx) / 2, y, (az + bz) / 2);
      rail.rotation.y = -Math.atan2(bz - az, bx - ax);
      holeGroup.add(rail);
    }
  }
}

function addDuneGrass(spots) {
  if (!spots.length) return;
  const tufts = new THREE.InstancedMesh(new THREE.ConeGeometry(0.035, 0.16, 5), MAT.dune, spots.length * 3);
  const shells = new THREE.InstancedMesh(new THREE.SphereGeometry(0.018, 8, 4, 0, Math.PI * 2, 0, Math.PI / 2), MAT.white, spots.length);
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), p = new THREE.Vector3(), ax = new THREE.Vector3();
  let k = 0;
  spots.forEach(([x, z], i) => {
    for (let j = 0; j < 3; j++) {
      ax.set(rnd() - 0.5, 0, rnd() - 0.5).normalize();
      q.setFromAxisAngle(ax, (rnd() - 0.5) * 0.7);
      const hgt = 0.7 + rnd() * 0.8;
      m.compose(p.set(x + (rnd() - 0.5) * 0.06, 0.06 * hgt - 0.02, z + (rnd() - 0.5) * 0.06), q, s.set(1, hgt, 1));

}

function addPalm(x, z, h, lean, turn) {
  const g = new THREE.Group();
  g.position.set(x, -0.02, z);
  g.rotation.y = turn;
  // a curving trunk built from tapering segments
  let px = 0, py = 0;
  const segs = 8;
  for (let i = 0; i < segs; i++) {
    const t = i / segs, len = h / segs;
    const ang = lean * (0.3 + t);
    const seg = new THREE.Mesh(new THREE.CylinderGeometry(0.07 - t * 0.03, 0.08 - t * 0.03, len * 1.05, 7), MAT.palm);
    seg.position.set(px + Math.sin(ang) * len / 2, py + Math.cos(ang) * len / 2, 0);
    seg.rotation.z = -ang; seg.castShadow = true;
    g.add(seg);
    px += Math.sin(ang) * len; py += Math.cos(ang) * len;
  }
  // fronds: long drooping leaves fanned round the crown
  const frondGeo = new THREE.PlaneGeometry(1.1, 0.26, 6, 1);
  const pos = frondGeo.attributes.position;
  for (let i = 0; i < pos.count; i++) {
    const u = (pos.getX(i) + 0.55) / 1.1;
    pos.setX(i, u * 1.1); pos.setY(i, pos.getY(i) * (1 - u * 0.8)); pos.setZ(i, -u * u * 0.45);
  }
  frondGeo.computeVertexNormals();
  for (let k = 0; k < 9; k++) {
    const f = new THREE.Mesh(frondGeo, MAT.frond);
    f.position.set(px, py, 0);
    f.rotation.set(-Math.PI / 2 + 0.35, 0, (k / 9) * Math.PI * 2, 'YXZ');
    f.rotation.y = (k / 9) * Math.PI * 2;
    f.castShadow = true;
    g.add(f);
  }
  for (let k = 0; k < 3; k++) {
    const nut = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), MAT.bark);
    nut.position.set(px + Math.cos(k * 2.1) * 0.07, py - 0.06, Math.sin(k * 2.1) * 0.07);
    g.add(nut);
  }
  holeGroup.add(g);
}

// The wreck: a weathered hull under the deck cells, broken off at the bow, with a mast, sail and flag.
function addShipModel(hole) {
  const decks = hole.cells.filter(c => c.ch === 'd');
  if (!decks.length) return;
  const c0 = Math.min(...decks.map(c => c.c)), c1 = Math.max(...decks.map(c => c.c)) + 1;
  const r0 = Math.min(...decks.map(c => c.r)), r1 = Math.max(...decks.map(c => c.r)) + 1;
  const top = decks[0].level * CONFIG.levelStep;
  const x0 = c0 * C - 0.1, x1 = c1 * C + 0.1, z0 = r0 * C - 0.1, z1 = r1 * C + 0.1;
  const bow = hole.ship.bow, alongZ = bow === 'n' || bow === 's';
  const g = new GeoBuilder();
  // hull sides bulge outward below the deck line
  const sides = alongZ ? [[x0, z0, x0, z1, -1, 0], [x1, z1, x1, z0, 1, 0]] : [[x1, z0, x0, z0, 0, -1], [x0, z1, x1, z1, 0, 1]];
  for (const [ax, az, bx, bz, nx, nz] of sides) {
    prism(g, ax + nx * 0.12, az + nz * 0.12, bx + nx * 0.12, bz + nz * 0.12, -nx, -nz, 0.12, -0.1, top * 0.55, top * 0.55);
    prism(g, ax, az, bx, bz, -nx, -nz, 0.05, top * 0.5, top + 0.18, top + 0.18);
  }
  // the stern is closed off; the bow end is open and splintered — she ran aground
  const stern = { n: [x0, z1, x1, z1, 0, 1], s: [x1, z0, x0, z0, 0, -1], e: [x0, z0, x0, z1, -1, 0], w: [x1, z1, x1, z0, 1, 0] }[bow];
  prism(g, stern[0], stern[1], stern[2], stern[3], -stern[4], -stern[5], 0.1, -0.1, top + 0.18, top + 0.18);
  holeGroup.add(meshOf(g, MAT.hull, true));
  const bowEdge = { n: [x0, z0, x1, z0], s: [x0, z1, x1, z1], e: [x1, z0, x1, z1], w: [x0, z0, x0, z1] }[bow];
  for (let i = 0; i < 6; i++) {
    const t = (i + 0.5) / 6, len = 0.15 + rnd() * 0.3;
    const px = bowEdge[0] + (bowEdge[2] - bowEdge[0]) * t, pz = bowEdge[1] + (bowEdge[3] - bowEdge[1]) * t;
    const plank = box(alongZ ? 0.07 : len, 0.03, alongZ ? len : 0.07, MAT.hull, px, top * (0.2 + rnd() * 0.6), pz);
    plank.rotation.set((rnd() - 0.5) * 0.6, 0, (rnd() - 0.5) * 0.6);
    holeGroup.add(plank);
  }
  // mast stepped on the hull side, leaning a little, with a torn sail and the colours
  const mx = alongZ ? x1 + 0.22 : (x0 + x1) / 2, mz = alongZ ? (z0 + z1) / 2 : z1 + 0.22;
  const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 3.2, 10), MAT.wood);
  mast.position.set(mx, 1.6, mz); mast.rotation.z = alongZ ? -0.08 : 0; mast.rotation.x = alongZ ? 0 : 0.08; mast.castShadow = true;
  holeGroup.add(mast);
  const yard = box(alongZ ? 0.05 : 1.6, 0.05, alongZ ? 1.6 : 0.05, MAT.wood, mx + (alongZ ? 0.12 : 0), 2.6, mz + (alongZ ? 0 : 0.12));
  holeGroup.add(yard);
  const sailGeo = new THREE.PlaneGeometry(1.4, 1.2, 8, 6);
  const sp = sailGeo.attributes.position;
  for (let i = 0; i < sp.count; i++) {
    const x = sp.getX(i), y = sp.getY(i);
    sp.setZ(i, Math.cos((x / 1.4) * Math.PI) * 0.18 + (y < -0.3 && Math.abs(x) > 0.3 ? -0.1 : 0));
    if (y < -0.45 && ((x * 7) | 0) % 2) sp.setY(i, y + 0.15); // ragged hem
  }
  sailGeo.computeVertexNormals();
  const sail = new THREE.Mesh(sailGeo, MAT.canvas);
  sail.position.set(mx + (alongZ ? 0.15 : 0), 1.95, mz + (alongZ ? 0 : 0.15));
  sail.rotation.y = alongZ ? Math.PI / 2 : 0;
  sail.castShadow = true;
  holeGroup.add(sail);
  const flag = new THREE.Mesh(new THREE.PlaneGeometry(0.55, 0.35), MAT.skull);
  flag.position.set(mx + (alongZ ? 0 : 0.3), 3.05, mz + (alongZ ? 0.3 : 0));
  flag.rotation.y = alongZ ? -Math.PI / 2 : 0;
  holeGroup.add(flag);
  anim.flags = anim.flags || [];
  anim.flags.push(flag);
  // rigging down to the hull
  for (const [ex, ez] of [[x1 + 0.05, z0], [x1 + 0.05, z1], [x0, z1 + 0.05], [x1, z1 + 0.05]].slice(alongZ ? 0 : 2, alongZ ? 2 : 4)) {
    const a = new THREE.Vector3(mx, 3.0, mz), b2 = new THREE.Vector3(ex, top + 0.18, ez);
    const rope = new THREE.Mesh(new THREE.CylinderGeometry(0.006, 0.006, a.distanceTo(b2), 4), MAT.rope);
    rope.position.copy(a).add(b2).multiplyScalar(0.5);
    rope.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), b2.clone().sub(a).normalize());
    holeGroup.add(rope);
  }
}
